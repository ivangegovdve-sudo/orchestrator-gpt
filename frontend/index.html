<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/web/shared/favicon.svg?v=20260729g" type="image/svg+xml">
<script defer src="/web/shared/feedback.js?v=20260729g"></script>
<script type="module" src="/web/shared/forest-navigation.mjs?v=20260729g"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item Icon Generator</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1f2933;
      background-color: #f7f9fb;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: #fff;
      border: 1px solid #d8e2ec;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p.description {
      margin: 0 0 24px;
      color: #52606d;
    }

    .layout {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .column {
      flex: 1 1 300px;
      min-width: 280px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd2d9;
      background: #f8f9fb;
      font-size: 14px;
      resize: vertical;
    }

    textarea {
      min-height: 96px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #6d28d9);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.2s ease;
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.2);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
    }

    .card {
      border: 1px solid #e1e7ef;
      border-radius: 10px;
      padding: 16px;
      background: #fafbfc;
      transition: opacity 0.3s ease-in, transform 0.3s ease-in;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-item {
      margin: 8px 0;
    }

    .result-item span {
      font-weight: 600;
    }

    .error {
      color: #b42318;
      margin-top: 8px;
      font-weight: 600;
    }

    .preview {
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #d8e2ec;
      max-width: 100%;
      display: block;
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(79, 70, 229, 0.6);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Item Icon Generator</h1>
    <p class="description">Generate a stylized item icon from a seed image and description.</p>

    <div class="layout">
      <div class="column">
        <form id="icon-form">
          <div>
            <label for="seedImageUrl">Seed Image URL</label>
            <input type="text" id="seedImageUrl" name="seedImageUrl" placeholder="https://example.com/seed.png" />
          </div>

          <div>
            <label for="assetDescription">Asset Description</label>
            <textarea id="assetDescription" name="assetDescription" placeholder="Describe the item icon you want"></textarea>
          </div>

          <div>
            <label for="styleHint">Optional Style Hint</label>
            <input type="text" id="styleHint" name="styleHint" placeholder="e.g., painterly, metallic, neon" />
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="useWesternAnimation" name="useWesternAnimation" />
            <label for="useWesternAnimation">Use Western Animation Base Model</label>
          </div>

          <button type="submit" id="generateButton">Generate Item Icon</button>
          <div id="error" class="error" role="alert" aria-live="assertive"></div>
        </form>
      </div>

      <div class="column">
        <div class="card">
          <h2>Result</h2>
          <div id="resultContent">
            <p>Fill in the form and click "Generate Item Icon" to view results.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('icon-form');
    const resultContent = document.getElementById('resultContent');
    const errorEl = document.getElementById('error');
    const generateButton = document.getElementById('generateButton');

    // 🛡️ SECURITY: Prevent XSS by escaping HTML entities
    function escapeHtml(unsafe) {
      if (!unsafe) return "";
      return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 🛡️ SECURITY: Prevent executing javascript: URIs
    function sanitizeUrl(url) {
      if (!url) return "#";
      const str = String(url).trim();
      const lower = str.toLowerCase();
      if (lower.startsWith("javascript:") || lower.startsWith("data:") || lower.startsWith("vbscript:")) {
        return "#";
      }
      return escapeHtml(str);
    }

    function renderResult({ taskUUID, imageURL }) {
      const safeUUID = escapeHtml(taskUUID);
      const safeUrl = sanitizeUrl(imageURL);

      resultContent.innerHTML = `
        <div class="result-item fade-in"><span>Task UUID:</span> ${safeUUID}</div>
        <div class="result-item fade-in" style="animation-delay: 0.1s;"><span>Image URL:</span> <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a></div>
        <img class="preview fade-in" style="animation-delay: 0.2s;" src="${safeUrl}" alt="Generated item icon" />
      `;
    }

    function renderLoading() {
      resultContent.innerHTML = '<p class="fade-in">Generating…</p>';
    }

    function renderError(message) {
      errorEl.textContent = message;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      renderError('');

      const seedImageUrl = form.seedImageUrl.value.trim();
      const assetDescription = form.assetDescription.value.trim();
      const styleHint = form.styleHint.value.trim();
      const useWesternAnimationBaseModel = form.useWesternAnimation.checked;

      if (!seedImageUrl || !assetDescription) {
        renderError('Seed Image URL and Asset Description are required.');
        return;
      }

      const body = {
        seedImage: seedImageUrl,
        assetDescription: assetDescription,
        styleHint: styleHint || undefined,
        useWesternAnimationBase: useWesternAnimationBaseModel,
      };

      try {
        generateButton.disabled = true;
        const originalText = generateButton.textContent;
        generateButton.innerHTML = '<span class="spinner"></span> Generating...';
        renderLoading();

        const response = await fetch('http://localhost:8000/api/item-icon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (!response.ok) {
          throw new Error('Request failed. Please try again.');
        }

        const data = await response.json();
        renderResult(data);
      } catch (err) {
        renderError(err.message || 'An unexpected error occurred.');
        resultContent.innerHTML = '<p class="fade-in">Something went wrong. Please try again.</p>';
      } finally {
        generateButton.disabled = false;
        generateButton.textContent = 'Generate Item Icon';
      }
    });
  </script>
</body>
</html>
