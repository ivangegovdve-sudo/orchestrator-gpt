name: MCP page truth
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-manifest-checks:
    name: Manifest/page consistency only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Record the limit of these secretless checks
        run: |
          echo 'Independent private-source verification: NOT RUN. This job checks the committed manifest and generated pages only; it is not a source-verification or publication gate.' >> "$GITHUB_STEP_SUMMARY"
      # Check first: a build must not hide a hand edit by regenerating it in CI.
      - run: npm run check:mcp-pages
      - run: node --test scratch/tests/catalogue-provider-registry.test.js scratch/tests/mcp-release-promotion.test.mjs scratch/tests/mcp-provider-presentation.test.mjs scratch/tests/mcp-workflow-boundary.test.mjs
      - run: npm run build
      - name: Build must leave the generated sources unchanged
        run: git diff --exit-code -- web/open-dashboard/mcp/index.html web/open-dashboard/catalogues/index.html web/open-dashboard/package-facts.mjs web/open-dashboard/package-release.json

  trusted-source-verification:
    name: Independent private-source verification (approved main only)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # External prerequisite: required reviewers, no self-review, main-only
    # deployment branches, and an environment-only read credential. Merely
    # naming this environment does NOT configure its protection rules.
    environment: mcp-source-verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Read immutable package source pin
        id: package-source
        run: node --input-type=module -e "import {readReleaseManifest} from './scripts/generate-mcp-pages.mjs'; import {appendFileSync} from 'node:fs'; const release = await readReleaseManifest(); appendFileSync(process.env.GITHUB_OUTPUT, 'commit=' + release.source.commit + '\n');"
      - name: Require approved environment-only access to the private package repository
        env:
          PACKAGE_READ_ACCESS_CONFIGURED: ${{ secrets.MCP_PACKAGE_READ_TOKEN != '' }}
        run: |
          if [ "$PACKAGE_READ_ACCESS_CONFIGURED" != "true" ]; then
            echo "::error::Independent source verification is unavailable. With Ivan's approval, an administrator must first protect the mcp-source-verification environment with required reviewers, prevent self-review, and main-only deployment branches, then add its environment-only MCP_PACKAGE_READ_TOKEN with Contents:read access only to ivangegovdve-sudo/openrouter-dashboard-mcp. Never use a repository or organization secret. Approval must cover this exact site commit and pinned package commit. No source-check fallback is permitted."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ivangegovdve-sudo/openrouter-dashboard-mcp
          ref: ${{ steps.package-source.outputs.commit }}
          token: ${{ secrets.MCP_PACKAGE_READ_TOKEN }}
          path: .mcp-package-source
          persist-credentials: false
      - run: npm ci --ignore-scripts
        working-directory: .mcp-package-source
      - name: Check exact source commit, registry and tools/list against manifest
        run: node scripts/generate-mcp-pages.mjs --check-source --check
        env:
          MCP_PACKAGE_ROOT: ${{ github.workspace }}/.mcp-package-source
      - run: npm run check:mcp-pages
      - run: node --test scratch/tests/mcp-page-registry.test.mjs scratch/tests/catalogue-provider-registry.test.js scratch/tests/mcp-release-promotion.test.mjs scratch/tests/mcp-provider-presentation.test.mjs scratch/tests/mcp-workflow-boundary.test.mjs
        env:
          MCP_PACKAGE_ROOT: ${{ github.workspace }}/.mcp-package-source
      - run: npm run build
      - name: Build must leave the generated sources unchanged
        run: git diff --exit-code -- web/open-dashboard/mcp/index.html web/open-dashboard/catalogues/index.html web/open-dashboard/package-facts.mjs web/open-dashboard/package-release.json
      - name: Record completed independent source verification
        env:
          VERIFIED_SITE_COMMIT: ${{ github.sha }}
          VERIFIED_PACKAGE_COMMIT: ${{ steps.package-source.outputs.commit }}
        run: echo "Independent private-source verification PASSED for site $VERIFIED_SITE_COMMIT and package $VERIFIED_PACKAGE_COMMIT. This is post-merge main evidence, not PR-head source verification." >> "$GITHUB_STEP_SUMMARY"
