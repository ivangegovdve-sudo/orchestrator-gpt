# Fails when the committed glossary bundle does not match a fresh rebuild.
#
# WHAT THIS PROTECTS, AND WHAT IT DOES NOT
# ----------------------------------------
# `build-vercel-static.cjs` regenerates the bundle at deploy time, before copying web/,
# so a stale committed bundle is NEVER what gets served. This check is therefore not a
# correctness gate on the live site — it is a gate on the repository telling the truth
# about itself.
#
# That still matters, for two reasons that have both already cost time here:
#
#   1. A stale artifact makes `git status` dirty after any local build, which trains
#      people to ignore a dirty tree — the same argument .gitattributes already makes
#      about line endings, and the same habit that lets a real change go unnoticed.
#   2. It makes review diffs lie. A PR that adds glossary terms shows its bundle change
#      as a real diff; if the base bundle was already stale, the reviewer cannot tell
#      which part of that diff is the PR and which is accumulated drift. On 2026-08-19
#      the committed bundle on main was missing `2026-08-17-terms.md` from its stats,
#      which is exactly this.
#
# It runs on every pull request rather than behind a `paths:` filter. The build has no
# dependencies and takes seconds, and a path filter would let a bundle-affecting change
# slip through under a path nobody thought to list — a check that silently does not run
# reads identically to a check that passed.

name: glossary bundle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle-is-current:
    name: committed bundle matches a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify the human-review candidate boundary
        run: >-
          node --test
          scratch/tests/glossary-candidate-queue.test.js
          scratch/tests/glossary-verified-input.test.js

      # The repo has no dependencies — `npm ci` would fail for want of a lockfile.
      # Running the generator directly is both correct and faster.
      - name: Rebuild the bundle
        run: node scripts/build-glossary-bundle.cjs

      # If the generator were not byte-deterministic this check would flake, and a
      # flaky required check gets disabled rather than fixed. Prove determinism here
      # so a failure below always means "the commit is stale", never "the build drifts".
      - name: Rebuild again and confirm the output is byte-stable
        run: |
          cp web/library/glossary/glossary-bundle.json /tmp/bundle.first
          cp glossary/QUARANTINE.md /tmp/quarantine.first
          cp glossary/MISUSE.md /tmp/misuse.first
          node scripts/build-glossary-bundle.cjs
          diff /tmp/bundle.first     web/library/glossary/glossary-bundle.json
          diff /tmp/quarantine.first glossary/QUARANTINE.md
          diff /tmp/misuse.first     glossary/MISUSE.md

      - name: Fail if any generated file is out of date
        run: |
          if git diff --exit-code -- \
               web/library/glossary/glossary-bundle.json \
               glossary/QUARANTINE.md \
               glossary/MISUSE.md
          then
            echo "Generated glossary files are current."
            exit 0
          fi

          echo
          echo "::error::A committed glossary file does not match a fresh build."
          echo
          echo "This usually means a glossary source changed without the bundle being"
          echo "regenerated. Sources are:"
          echo "  glossary/verified-terms.json"
          echo "  glossary/<date>-terms.md"
          echo "  glossary/ai-terms-glossary.md"
          echo "  web/ai-init/glossary-data.js"
          echo
          echo "Fix it by running the generator and committing what it writes:"
          echo "  node scripts/build-glossary-bundle.cjs"
          echo "  git add web/library/glossary/glossary-bundle.json glossary/QUARANTINE.md glossary/MISUSE.md"
          echo
          echo "If only line endings differ, the file is missing a 'text eol=lf' pin"
          echo "in .gitattributes — add it there rather than committing the churn."
          exit 1
