name: Open Dashboard

on:
  pull_request:
    paths:
      - "web/open-dashboard/**"
      - "scripts/refresh-open-dashboard-package-facts.mjs"
      - "scripts/refresh-open-dashboard-for-build.mjs"
      - "package.json"
      - "package-lock.json"
      - "build-vercel-static.cjs"
      - ".github/workflows/open-dashboard-tests.yml"
  push:
    branches: [main]
    paths:
      - "web/open-dashboard/**"
      - "scripts/refresh-open-dashboard-package-facts.mjs"
      - "scripts/refresh-open-dashboard-for-build.mjs"
      - "package.json"
      - "package-lock.json"
      - "build-vercel-static.cjs"
      - ".github/workflows/open-dashboard-tests.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix web/open-dashboard test
      - run: node scripts/refresh-open-dashboard-package-facts.mjs --check
      - run: npm run build
