# Keeps the public council's free-model roster alive without anyone editing a file.
#
# WHAT THIS REPLACES
# ------------------
# The roster used to be a literal in web/council/council.js, refreshed only when someone
# noticed the page was broken. Nobody noticed for a month: by 2026-08-28 two of its six
# slugs had been withdrawn from OpenRouter and the critic tier was two-thirds dead, so a
# visitor who tried the council got failures. The set of free models changes weekly, and
# a weekly manual chore is a chore that stops being done.
#
# WHY TWO JOBS
# ------------
# The generator runs `npx -y open-dashboard-mcp@0.4.0`, which downloads and executes code
# from npm at run time. That is the price of tracking the MCP's published version rather
# than vendoring a copy that would itself go stale — but it means the generator step must
# be treated as running untrusted code.
#
# So it does not run anywhere near a write token. `verify` holds `contents: read`, checks
# out with `persist-credentials: false` so no credential is written to the runner's git
# config, and hands its result on as an artifact. `publish` holds the write permission,
# validates what it was handed, and commits. A compromised package therefore reaches
# neither a token nor a push.
#
# It also cannot smuggle anything into the roster: `publish` re-runs the contract tests
# against the downloaded artifact before committing, and those assert every slug is a
# `:free` model that appears in the run's own verified list.
#
# WHY publish CHECKS OUT main RATHER THAN THE TRIGGERING REF
# -----------------------------------------------------------
# `workflow_dispatch` runs against a ref the caller chooses. If `publish` checked out that
# ref, the test file it runs to validate the artifact would itself be branch-controlled —
# arbitrary code executing with `contents: write`. It therefore pins its checkout to
# `main`, so the validation logic is always the reviewed version regardless of which ref
# started the run. `verify` may run branch code freely; it has nothing worth stealing.
#
# Actions are pinned to commit SHAs, not tags. A tag is mutable, and every one of these
# actions runs before or alongside the write token — an earlier draft of this file claimed
# `publish` "runs no third-party code", which was wrong: an action IS third-party code.
# Pinning is what makes that claim true in the only sense that matters. The trailing
# comment records which tag each SHA was at, so the pins can be re-resolved deliberately.
#
# WHY THIS COMMITS TO main RATHER THAN OPENING A PULL REQUEST
# -----------------------------------------------------------
# A PR would need a human to merge it every few days, which is the same chore wearing a
# different hat. The job writes exactly one generated file and nothing else; the diff is
# reviewable after the fact in the commit log, and free-roster.test.js gates the same
# file on every pull request, so a bad roster still cannot arrive through the front door.
#
# NO SECRETS ARE INVOLVED
# -----------------------
# Verification calls go through the same public council relay a visitor's browser uses.
# That relay holds the OpenRouter key and enforces free-only server-side, so this job
# needs no credentials of its own and its probes are indistinguishable from real traffic.
#
# IF THIS JOB STOPS RUNNING
# -------------------------
# The page does not depend on noticing. free-roster.json carries `verifiedAt` — the newest
# moment a published model actually answered, not the moment a run happened — and
# council.js prints its age, switching to an amber warning past three days. A refresh that
# dies, or one that runs but confirms nothing, both show up to the visitor as a growing
# "last verified N days ago" rather than an ageing list that still looks authoritative.
# Note that GitHub disables scheduled workflows in repositories with no activity for 60
# days — that is a second way this can stop, and it fails the same visible way.

name: free roster

on:
  schedule:
    # 05:20 UTC daily. Off the hour, because the top of the hour is when everybody else's
    # cron fires and free-tier queues are worst.
    - cron: '20 5 * * *'
  workflow_dispatch:

# Two runs writing the same generated file would race on push.
concurrency:
  group: free-roster
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: verify free models against the live relay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only, and no credential is left on disk. This is the job that runs npx.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # The repo has no dependencies and no lockfile — `npm ci` would fail outright. The
      # generator pulls open-dashboard-mcp through `npx -y` at run time instead, which is
      # exactly why this job holds no write permission.
      - name: Regenerate the roster
        run: node scripts/refresh-free-roster.mjs

      - name: Verify the roster satisfies its contract
        run: node --test scratch/tests/free-roster.test.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: free-roster
          path: web/council/free-roster.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: commit the roster
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access. Every action it runs is SHA-pinned, and the code it
    # executes comes from main rather than from whichever ref triggered the run.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Pinned to main on purpose: workflow_dispatch can be aimed at any ref, and this
          # job runs scratch/tests/free-roster.test.js. Checking out the triggering ref
          # would let branch-controlled test code execute holding contents: write.
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: free-roster
          path: artifact

      # Validated against OpenRouter, not against itself. An earlier version checked only
      # that each slug ended in `:free` and appeared in the artifact's own `verified`
      # array — but the artifact supplies that array, so a forged file naming
      # `fake/model:free` in both places passed. Every published slug is now checked
      # against openrouter.ai, which the untrusted job cannot forge: it must be a model
      # OpenRouter actually serves, priced at zero. All three tiers must be present.
      #
      # The validator itself comes from the main checkout above, so a branch cannot
      # supply the code that judges its own artifact.
      - name: Validate the artifact against the live OpenRouter catalogue
        run: node scripts/validate-free-roster.mjs artifact/free-roster.json

      - name: Adopt the artifact and re-run the contract tests
        run: |
          cp artifact/free-roster.json web/council/free-roster.json
          node --test scratch/tests/free-roster.test.js

      - name: Commit the roster if it changed
        env:
          # Supplied to this one step rather than persisted in the runner's git config, so
          # nothing earlier in the job — including any action — has a credential to reach.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- web/council/free-roster.json; then
            echo "Roster unchanged — every model verified the same as last run."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/council/free-roster.json

          verified=$(node -p "require('./web/council/free-roster.json').verified.length")
          fresh=$(node -p "require('./web/council/free-roster.json').freshlyVerified")
          probed=$(node -p "require('./web/council/free-roster.json').probed")
          git commit -m "chore(council): refresh verified free-model roster (${verified} published, ${fresh}/${probed} confirmed live)"
          # HEAD:main rather than a bare push: the checkout is detached at main's SHA.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
