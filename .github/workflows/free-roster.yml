# Keeps the public council's free-model roster alive without anyone editing a file.
#
# WHAT THIS REPLACES
# ------------------
# The roster used to be a literal in web/council/council.js, refreshed only when someone
# noticed the page was broken. Nobody noticed for a month: by 2026-08-28 two of its six
# slugs had been withdrawn from OpenRouter and the critic tier was two-thirds dead, so a
# visitor who tried the council got failures. The set of free models changes weekly, and
# a weekly manual chore is a chore that stops being done.
#
# WHY TWO JOBS
# ------------
# The generator runs `npx -y open-dashboard-mcp@0.4.0`, which downloads and executes code
# from npm at run time. That is the price of tracking the MCP's published version rather
# than vendoring a copy that would itself go stale — but it means the generator step must
# be treated as running untrusted code.
#
# So the npx call is confined to `catalogue`, a job holding `contents: read` and checking
# out with `persist-credentials: false`, and it produces exactly one thing: the list of
# model ids the MCP believes are free. Nothing that decides what reaches a visitor is
# decided there.
#
# `publish` does the rest with first-party code from main — it cross-checks that list
# against OpenRouter, runs the live probes itself, assigns the tiers, and commits. The
# probe results are therefore PRODUCED by trusted code rather than accepted from an
# artifact and taken on faith, which is what an earlier draft got wrong: it re-validated
# the artifact only against itself, so a compromised package could have named a
# real-but-dead model in both `rosters` and `verified` and had it published.
#
# The split costs no extra traffic. The probes happen once either way; only their
# location changed. What the untrusted job can still do is SUGGEST candidates — and a
# candidate must survive OpenRouter's catalogue and a real streamed completion before it
# becomes a seat, both judged on the trusted side.
#
# WHY publish PINS ITS CHECKOUT TO main
# -------------------------------------
# So the code it runs — the generator, the validator, the contract tests — is always the
# reviewed version rather than whatever the running ref happens to contain. Combined with
# the schedule-only trigger above, which fixes the workflow definition to the default
# branch, that makes both the steps and the code they execute trusted. Neither measure
# is sufficient alone: `ref: main` cannot protect a job whose own definition came from
# somewhere else.
#
# Actions are pinned to commit SHAs, not tags. A tag is mutable, and every one of these
# actions runs before or alongside the write token — an earlier draft of this file claimed
# `publish` "runs no third-party code", which was wrong: an action IS third-party code.
# Pinning is what makes that claim true in the only sense that matters. The trailing
# comment records which tag each SHA was at, so the pins can be re-resolved deliberately.
#
# WHY THIS COMMITS TO main RATHER THAN OPENING A PULL REQUEST
# -----------------------------------------------------------
# A PR would need a human to merge it every few days, which is the same chore wearing a
# different hat. The job writes exactly one generated file and nothing else; the diff is
# reviewable after the fact in the commit log, and the roster is validated against
# openrouter.ai and re-tested here before the commit is made.
#
# This paragraph used to end with the claim that "free-roster.test.js gates the same file
# on every pull request, so a bad roster still cannot arrive through the front door."
# That was false from the day it was written. These tests ran only in the `publish` job
# below — after a merge, never before one — and the sole PR-triggered workflow was
# glossary-bundle.yml, which names two glossary test files explicitly. Nothing gated the
# roster on the way in. free-roster-tests.yml now does, on every pull request, which is
# what makes the sentence above true rather than aspirational.
#
# NO SECRETS ARE INVOLVED
# -----------------------
# Verification calls go through the same public council relay a visitor's browser uses.
# That relay holds the OpenRouter key and enforces free-only server-side, so this job
# needs no credentials of its own and its probes are indistinguishable from real traffic.
#
# IF THIS JOB STOPS RUNNING
# -------------------------
# The page does not depend on noticing. free-roster.json carries `verifiedAt` — the newest
# moment a published model actually answered, not the moment a run happened — and
# council.js prints its age, switching to an amber warning past three days. A refresh that
# dies, or one that runs but confirms nothing, both show up to the visitor as a growing
# "last verified N days ago" rather than an ageing list that still looks authoritative.
# Note that GitHub disables scheduled workflows in repositories with no activity for 60
# days — that is a second way this can stop, and it fails the same visible way.

name: free roster

on:
  schedule:
    # 05:20 UTC daily. Off the hour, because the top of the hour is when everybody else's
    # cron fires and free-tier queues are worst.
    - cron: '20 5 * * *'
  # Deliberately schedule-only. workflow_dispatch executes the workflow definition FROM
  # THE SELECTED REF, so a run dispatched from a branch would run that branch's copy of
  # this file — its steps and its `permissions:` block included. Pinning the checkout to
  # `ref: main` does not help, because the thing choosing to check out main is itself the
  # branch's file. A scheduled run always executes the default branch's definition, which
  # is the only way to make the trust boundary below mean what it says.
  #
  # To refresh by hand, run `npm run refresh-roster` locally and open a PR with the
  # result. That needs no CI privileges at all, which is rather the point.

# Two runs writing the same generated file would race on push.
concurrency:
  group: free-roster
  cancel-in-progress: false

permissions: {}

jobs:
  catalogue:
    name: ask the MCP which models are free
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only, and no credential is left on disk. This is the job that runs npx.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # The repo has no dependencies and no lockfile — `npm ci` would fail outright. The
      # MCP arrives through `npx -y` at run time instead, which is exactly why this job
      # holds no write permission and emits only a candidate list.
      - name: Ask the MCP for free-model candidates
        run: node scripts/refresh-free-roster.mjs --emit-candidates candidates.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: free-model-candidates
          path: candidates.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: commit the roster
    needs: catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job with write access. Every action it runs is SHA-pinned, and the code it
    # executes comes from main rather than from whichever ref triggered the run.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Pinned to main so the generator, validator and tests this job runs are the
          # reviewed versions, not whatever ref the run started from.
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: free-model-candidates
          path: artifact

      # The candidate list is the ONLY thing carried over from the untrusted job, and it
      # is treated as a set of suggestions. Everything below runs main's code: the
      # OpenRouter cross-check, the live relay probes, the tier assignment, and the
      # free-only assertion. A candidate the MCP invented does not survive the catalogue
      # gate, and one that never answers does not survive the probe.
      - name: Build the roster from the candidates, probing on this side of the boundary
        run: node scripts/refresh-free-roster.mjs --candidates artifact/candidates.json

      # Belt and braces on the money question, checked against openrouter.ai rather than
      # against the file's own claims about itself.
      - name: Validate the result against the live OpenRouter catalogue
        run: node scripts/validate-free-roster.mjs web/council/free-roster.json

      - name: Re-run the contract tests against what will be committed
        run: node --test scratch/tests/free-roster.test.js

      - name: Commit the roster if it changed
        env:
          # Supplied to this one step rather than persisted in the runner's git config, so
          # nothing earlier in the job — including any action — has a credential to reach.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- web/council/free-roster.json; then
            echo "Roster unchanged — every model verified the same as last run."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/council/free-roster.json

          verified=$(node -p "require('./web/council/free-roster.json').verified.length")
          fresh=$(node -p "require('./web/council/free-roster.json').freshlyVerified")
          probed=$(node -p "require('./web/council/free-roster.json').probed")
          git commit -m "chore(council): refresh verified free-model roster (${verified} published, ${fresh}/${probed} confirmed live)"
          # HEAD:main rather than a bare push: the checkout is detached at main's SHA.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
