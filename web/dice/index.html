<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D D12 Dice Roller</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c12;
      --panel: #141626;
      --accent: #7c5cff;
      --text: #eef0ff;
      --muted: #9aa1c7;
      --die-size: clamp(150px, 28vw, 220px);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1c29 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      display: grid;
      gap: 24px;
    }

    header {
      text-align: center;
      display: grid;
      gap: 8px;
    }

    header h1 {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 700;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stage {
      display: grid;
      gap: 24px;
      justify-items: center;
    }

    .dice-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(16px, 4vw, 48px);
      perspective: 1200px;
      width: 100%;
    }

    .die-card {
      background: var(--panel);
      padding: 20px 20px 24px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: min(320px, 90vw);
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .die-label {
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .die {
      width: var(--die-size);
      height: var(--die-size);
      position: relative;
      transform-style: preserve-3d;
    }

    .die-body {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      transition: transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .die.rolling .die-body {
      filter: drop-shadow(0 12px 18px rgba(124, 92, 255, 0.4));
    }

    .top-face {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: linear-gradient(160deg, #fdf7e7, #d6c9a9);
      border: 2px solid rgba(255, 255, 255, 0.45);
      display: grid;
      place-items: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(40px);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.25);
    }

    .top-face::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 14px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .die-body::before,
    .die-body::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: linear-gradient(140deg, #b9b9c9, #8f90a5);
      transform: translateZ(-40px);
      box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.4);
    }

    .die-body::after {
      transform: translateZ(-60px) scale(0.96);
      opacity: 0.65;
    }

    .num {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: #151722;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      padding: 16px 20px;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .controls button {
      border: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .controls button:not(:disabled):hover {
      transform: translateY(-1px) scale(1.02);
    }

    .controls button:focus-visible {
      outline: 3px solid rgba(124, 92, 255, 0.8);
      outline-offset: 3px;
    }

    .results {
      text-align: center;
      font-size: 1rem;
      color: var(--text);
    }

    .results span {
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .die-card {
        width: min(100%, 90vw);
      }
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>3D D12 Dice Roller</h1>
      <p>Spin two dodecahedral dice and always see the correct final face value.</p>
    </header>

    <section class="stage">
      <div class="dice-row">
        <article class="die-card">
          <div class="die-label">Die A</div>
          <div class="die" id="dieA">
            <div class="die-body">
              <div class="top-face">
                <div class="num" id="numA">1</div>
              </div>
            </div>
          </div>
        </article>

        <article class="die-card">
          <div class="die-label">Die B</div>
          <div class="die" id="dieB">
            <div class="die-body">
              <div class="top-face">
                <div class="num" id="numB">1</div>
              </div>
            </div>
          </div>
        </article>
      </div>

      <div class="controls" aria-label="Dice controls">
        <button id="rollButton" type="button">Roll</button>
        <button id="rollAgainButton" type="button">Roll again</button>
      </div>

      <div class="results" aria-live="polite" id="results">
        <div><span>Mode:</span> D12</div>
        <div>Die A: 1 • Die B: 1 • Sum: 2</div>
      </div>
    </section>
  </main>

  <script>
    const dieA = document.getElementById("dieA");
    const dieB = document.getElementById("dieB");
    const numA = document.getElementById("numA");
    const numB = document.getElementById("numB");
    const rollButton = document.getElementById("rollButton");
    const rollAgainButton = document.getElementById("rollAgainButton");
    const results = document.getElementById("results");

    let rolling = false;
    const rollDuration = 1150;
    const flickerInterval = 80;
    let flickerTimerA = null;
    let flickerTimerB = null;

    function randInt(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    function updateResults(a, b) {
      const sum = a + b;
      results.innerHTML = `
        <div><span>Mode:</span> D12</div>
        <div>Die A: ${a} • Die B: ${b} • Sum: ${sum}</div>
      `;
    }

    function startFlicker() {
      stopFlicker();
      flickerTimerA = setInterval(() => {
        numA.textContent = randInt(12);
      }, flickerInterval);
      flickerTimerB = setInterval(() => {
        numB.textContent = randInt(12);
      }, flickerInterval);
    }

    function stopFlicker() {
      clearInterval(flickerTimerA);
      clearInterval(flickerTimerB);
      flickerTimerA = null;
      flickerTimerB = null;
    }

    function spinDie(die, extraTurns) {
      const spinX = 360 * (2 + Math.floor(Math.random() * 2)) + extraTurns;
      const spinY = 360 * (2 + Math.floor(Math.random() * 2)) + extraTurns;
      const spinZ = 360 * (1 + Math.floor(Math.random() * 2));
      die.querySelector(".die-body").style.transform =
        `translate(-50%, -50%) rotateX(${spinX}deg) rotateY(${spinY}deg) rotateZ(${spinZ}deg)`;
    }

    function rollDice() {
      if (rolling) return;
      rolling = true;
      rollButton.disabled = true;
      rollAgainButton.disabled = true;
      dieA.classList.add("rolling");
      dieB.classList.add("rolling");

      const resultA = randInt(12);
      const resultB = randInt(12);

      startFlicker();
      spinDie(dieA, resultA * 15);
      spinDie(dieB, resultB * 20);

      setTimeout(() => {
        stopFlicker();
        numA.textContent = resultA;
        numB.textContent = resultB;
        updateResults(resultA, resultB);
        dieA.classList.remove("rolling");
        dieB.classList.remove("rolling");
        rolling = false;
        rollButton.disabled = false;
        rollAgainButton.disabled = false;
      }, rollDuration);
    }

    rollButton.addEventListener("click", rollDice);
    rollAgainButton.addEventListener("click", rollDice);

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault();
        rollDice();
      }
    });

    updateResults(1, 1);
  </script>
</body>
</html>
