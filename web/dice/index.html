<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Dice Roller (D6 / D12)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c12;
      --panel: #151826;
      --accent: #7c5cff;
      --text: #eef0ff;
      --muted: #9aa1c7;
      --die-size: clamp(130px, 26vw, 200px);
      --cube-face: calc(var(--die-size) * 0.52);
      --d12-face: calc(var(--die-size) * 0.5);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1c29 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      display: grid;
      gap: 24px;
    }

    header {
      text-align: center;
      display: grid;
      gap: 8px;
    }

    header h1 {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 700;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stage {
      display: grid;
      gap: 24px;
      justify-items: center;
    }

    .dice-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(16px, 4vw, 48px);
      perspective: 1200px;
      width: 100%;
    }

    .die-card {
      background: var(--panel);
      padding: 16px 18px 20px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: min(320px, 90vw);
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .die-label {
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .die {
      width: var(--die-size);
      height: var(--die-size);
      position: relative;
      transform-style: preserve-3d;
    }

    .die-body {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%);
      transition: transform 1.35s cubic-bezier(0.16, 0.82, 0.24, 1);
    }

    .die.rolling .die-body {
      filter: drop-shadow(0 12px 18px rgba(124, 92, 255, 0.35));
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 50%;
      left: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #111;
      background: linear-gradient(145deg, #f3f4ff, #cdd1ff);
      border: 2px solid rgba(255, 255, 255, 0.45);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.25);
      backface-visibility: hidden;
    }

    .face span {
      font-size: clamp(1.6rem, 3.4vw, 2.6rem);
    }

    .d6 .face {
      width: var(--cube-face);
      height: var(--cube-face);
      border-radius: 12px;
    }

    .d12 .face {
      width: var(--d12-face);
      height: var(--d12-face);
      clip-path: polygon(
        50% 0%,
        95% 30%,
        80% 100%,
        20% 100%,
        5% 30%
      );
      border-radius: 6px;
      background: linear-gradient(160deg, #fdf7e7, #d6c9a9);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      padding: 16px 20px;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .controls button {
      border: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .controls button:not(:disabled):hover {
      transform: translateY(-1px) scale(1.02);
    }

    .controls button:focus-visible,
    .controls input:focus-visible {
      outline: 3px solid rgba(124, 92, 255, 0.8);
      outline-offset: 3px;
    }

    .mode-toggle {
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .mode-toggle label {
      display: flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
    }

    .results {
      text-align: center;
      font-size: 1rem;
      color: var(--text);
    }

    .results span {
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .die-card {
        width: min(100%, 90vw);
      }
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>3D Dice Roller</h1>
      <p>Roll two dice in realistic 3D — choose D6 cubes or D12 dodecahedrons.</p>
    </header>

    <section class="stage">
      <div class="dice-row">
        <article class="die-card">
          <div class="die-label">Die A</div>
          <div class="die" id="dieA">
            <div class="die-body"></div>
          </div>
        </article>

        <article class="die-card">
          <div class="die-label">Die B</div>
          <div class="die" id="dieB">
            <div class="die-body"></div>
          </div>
        </article>
      </div>

      <div class="controls" aria-label="Dice controls">
        <button id="rollButton" type="button">Roll</button>
        <button id="rollAgainButton" type="button">Roll again</button>

        <div class="mode-toggle" role="radiogroup" aria-label="Select dice mode">
          <label>
            <input type="radio" name="mode" value="d6" checked />
            D6
          </label>
          <label>
            <input type="radio" name="mode" value="d12" />
            D12
          </label>
        </div>
      </div>

      <div class="results" aria-live="polite" id="results">
        <div><span>Mode:</span> D6</div>
        <div>Die A: 1 • Die B: 1 • Sum: 2</div>
      </div>
    </section>
  </main>

  <script>
    const dieA = document.getElementById("dieA");
    const dieB = document.getElementById("dieB");
    const rollButton = document.getElementById("rollButton");
    const rollAgainButton = document.getElementById("rollAgainButton");
    const results = document.getElementById("results");
    const modeInputs = Array.from(document.querySelectorAll('input[name="mode"]'));

    let currentMode = "d6";
    let rolling = false;
    const rollDuration = 1350;

    const d6RotationMap = {
      1: { x: 0, y: 0, z: 0 },
      2: { x: 90, y: 0, z: 0 }, // front -> top
      3: { x: 0, y: 0, z: -90 }, // right -> top
      4: { x: 0, y: 0, z: 90 }, // left -> top
      5: { x: -90, y: 0, z: 0 }, // back -> top
      6: { x: 180, y: 0, z: 0 } // bottom -> top
    };

    function randInt(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    function normalizeVector(vec) {
      const length = Math.hypot(vec[0], vec[1], vec[2]) || 1;
      return [vec[0] / length, vec[1] / length, vec[2] / length];
    }

    function rotationToAlign(normal, target) {
      const n = normalizeVector(normal);
      const t = normalizeVector(target);
      const cross = [
        n[1] * t[2] - n[2] * t[1],
        n[2] * t[0] - n[0] * t[2],
        n[0] * t[1] - n[1] * t[0]
      ];
      const dot = Math.min(1, Math.max(-1, n[0] * t[0] + n[1] * t[1] + n[2] * t[2]));
      const angle = Math.acos(dot);
      const axisLength = Math.hypot(cross[0], cross[1], cross[2]);
      if (axisLength < 0.0001) {
        return { axis: [1, 0, 0], angle };
      }
      return { axis: [cross[0] / axisLength, cross[1] / axisLength, cross[2] / axisLength], angle };
    }

    function getDodecahedronNormals() {
      const phi = (1 + Math.sqrt(5)) / 2;
      const raw = [
        [0, 1, phi],
        [0, -1, phi],
        [0, 1, -phi],
        [0, -1, -phi],
        [1, phi, 0],
        [-1, phi, 0],
        [1, -phi, 0],
        [-1, -phi, 0],
        [phi, 0, 1],
        [-phi, 0, 1],
        [phi, 0, -1],
        [-phi, 0, -1]
      ];
      return raw.map(normalizeVector);
    }

    function clearDie(die) {
      const dieBody = die.querySelector(".die-body");
      dieBody.innerHTML = "";
      dieBody.style.transform = "translate(-50%, -50%)";
      die.classList.remove("d6", "d12");
    }

    function buildD6(die) {
      const dieBody = die.querySelector(".die-body");
      die.classList.add("d6");
      const size = getComputedStyle(die).getPropertyValue("--cube-face");
      const faces = [
        { value: 2, transform: `translate(-50%, -50%) rotateY(0deg) translateZ(calc(${size} / 2))` },
        { value: 5, transform: `translate(-50%, -50%) rotateY(180deg) translateZ(calc(${size} / 2))` },
        { value: 3, transform: `translate(-50%, -50%) rotateY(90deg) translateZ(calc(${size} / 2))` },
        { value: 4, transform: `translate(-50%, -50%) rotateY(-90deg) translateZ(calc(${size} / 2))` },
        { value: 1, transform: `translate(-50%, -50%) rotateX(90deg) translateZ(calc(${size} / 2))` },
        { value: 6, transform: `translate(-50%, -50%) rotateX(-90deg) translateZ(calc(${size} / 2))` }
      ];

      faces.forEach((face) => {
        const faceEl = document.createElement("div");
        faceEl.className = "face";
        faceEl.style.transform = face.transform;
        faceEl.innerHTML = `<span>${face.value}</span>`;
        dieBody.appendChild(faceEl);
      });
    }

    function buildD12(die) {
      const dieBody = die.querySelector(".die-body");
      die.classList.add("d12");
      const normals = getDodecahedronNormals();
      const radius = 0.62;

      normals.forEach((normal, index) => {
        const rotation = rotationToAlign([0, 0, 1], normal);
        const faceEl = document.createElement("div");
        faceEl.className = "face";
        faceEl.dataset.value = String(index + 1);
        faceEl.innerHTML = `<span>${index + 1}</span>`;
        faceEl.style.transform = `translate(-50%, -50%) rotate3d(${rotation.axis.join(",")}, ${rotation.angle}rad) translateZ(calc(var(--d12-face) * ${radius}))`;
        dieBody.appendChild(faceEl);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      [dieA, dieB].forEach((die) => {
        clearDie(die);
        if (mode === "d6") {
          buildD6(die);
        } else {
          buildD12(die);
        }
      });
      updateResults(1, 1);
    }

    function applyD6Rotation(die, value) {
      const base = d6RotationMap[value];
      const extraX = 360 * (2 + Math.floor(Math.random() * 3));
      const extraY = 360 * (2 + Math.floor(Math.random() * 3));
      const extraZ = 360 * (2 + Math.floor(Math.random() * 3));
      const transform = `translate(-50%, -50%) rotateX(${extraX + base.x}deg) rotateY(${extraY + base.y}deg) rotateZ(${extraZ + base.z}deg)`;
      die.querySelector(".die-body").style.transform = transform;
    }

    function applyD12Rotation(die, value) {
      const normals = getDodecahedronNormals();
      const normal = normals[value - 1];
      // Map selected face normal to the "top" direction (negative Y) so the top face shows the result.
      const rotation = rotationToAlign(normal, [0, -1, 0]);
      const extraX = 360 * (2 + Math.floor(Math.random() * 3));
      const extraY = 360 * (2 + Math.floor(Math.random() * 3));
      const extraZ = 360 * (2 + Math.floor(Math.random() * 3));
      die.querySelector(".die-body").style.transform =
        `translate(-50%, -50%) rotateX(${extraX}deg) rotateY(${extraY}deg) rotateZ(${extraZ}deg) ` +
        `rotate3d(${rotation.axis.join(",")}, ${rotation.angle}rad)`;
    }

    function updateResults(a, b) {
      const sum = a + b;
      results.innerHTML = `
        <div><span>Mode:</span> ${currentMode.toUpperCase()}</div>
        <div>Die A: ${a} • Die B: ${b} • Sum: ${sum}</div>
      `;
    }

    function rollDice() {
      if (rolling) return;
      rolling = true;
      rollButton.disabled = true;
      rollAgainButton.disabled = true;
      dieA.classList.add("rolling");
      dieB.classList.add("rolling");

      const max = currentMode === "d6" ? 6 : 12;
      const resultA = randInt(max);
      const resultB = randInt(max);

      if (currentMode === "d6") {
        applyD6Rotation(dieA, resultA);
        applyD6Rotation(dieB, resultB);
      } else {
        applyD12Rotation(dieA, resultA);
        applyD12Rotation(dieB, resultB);
      }

      setTimeout(() => {
        dieA.classList.remove("rolling");
        dieB.classList.remove("rolling");
        updateResults(resultA, resultB);
        rolling = false;
        rollButton.disabled = false;
        rollAgainButton.disabled = false;
      }, rollDuration);
    }

    rollButton.addEventListener("click", rollDice);
    rollAgainButton.addEventListener("click", rollDice);

    modeInputs.forEach((input) => {
      input.addEventListener("change", () => {
        if (input.checked) {
          setMode(input.value);
        }
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault();
        rollDice();
      }
    });

    // Face orientation notes:
    // - D6 faces are built as a true cube. Each face's transform defines its normal.
    //   The d6RotationMap rotates the cube so the chosen face's normal aligns to the top (-Y).
    // - D12 faces use normals taken from icosahedron vertices (true dodecahedron face normals).
    //   rotationToAlign() rotates the chosen face normal to the top direction so its label appears on top.

    setMode("d6");
  </script>
</body>
</html>
