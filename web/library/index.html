<style>
:root {
  --bg: #07070b;
  --surface: #0f0f15;
  --border: rgba(255,255,255,.08);
  --text-primary: #f3f4f6;
  --text-muted: #9ca3af;
  --accent: #4f46e5;
  --accent-green: #22c55e;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  --panel: rgba(15, 15, 21, .82);
  --card-bg: rgba(255,255,255,.03);
  --card-border: var(--border);
  --text: var(--text-primary);
  --muted: var(--text-muted);
  --dim: #6b7280;
  --accent-glow: rgba(79,70,229,.3);
  --purple: #818cf8;
  --green: var(--accent-green);
  --amber: #f59e0b;
  --library-panel-radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--forest-body, Alegreya, Georgia, serif);
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(79,70,229,.11), transparent 40%),
    radial-gradient(circle at 85% 8%, rgba(34,197,94,.06), transparent 40%);
  color: var(--text);
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .85em; }

.wrap { max-width: 1280px; margin: 0 auto; padding: 32px 22px 40px; }

/* ── Header ─────────────────────────────────────────── */
.nav { font-size: .82rem; color: var(--muted); margin-bottom: 18px; }
header.hero { text-align: center; margin-bottom: 22px; }
.logo { font-family: var(--forest-sans, "Alegreya Sans", sans-serif); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
h1 {
  font-family: var(--forest-display, "Cormorant Garamond", Georgia, serif);
  font-size: 2.7rem; font-weight: 650; letter-spacing: .01em;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { color: var(--muted); font-size: .95rem; margin-top: 8px; }

/* ── Floating search bubble ─────────────────────────── */
.search-dock { position: sticky; top: 14px; z-index: 40; display: flex; justify-content: center; margin: 8px 0 26px; }
.search-bubble {
  display: flex; align-items: center; gap: 10px; width: 100%; max-width: 620px;
  background: rgba(15,15,18,.82); border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px; padding: 12px 18px; backdrop-filter: blur(16px);
  box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(79,70,229,.05);
  transition:
    border-color var(--duration-scroll-state) var(--ease-standard),
    box-shadow var(--duration-scroll-state) var(--ease-standard);
}
.search-bubble:focus-within { border-color: var(--accent); box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 3px var(--accent-glow); }
.search-bubble .icon { font-size: 1.05rem; opacity: .7; }
.search-bubble input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: inherit; font-size: 1rem;
}
.search-bubble input::placeholder { color: var(--dim); }
.search-clear {
  background: rgba(255,255,255,.06); border: none; color: var(--muted);
  width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 14px;
  display: none; align-items: center; justify-content: center; flex-shrink: 0;
}
.search-clear.show { display: flex; }
.search-clear:hover { background: rgba(255,255,255,.12); color: var(--text); }
.search-meta { font-size: .72rem; color: var(--dim); white-space: nowrap; }

/* ── Split screen ───────────────────────────────────── */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.panel {
  background: var(--panel); border: 1px solid var(--card-border); border-radius: var(--library-panel-radius);
  backdrop-filter: blur(10px); display: flex; flex-direction: column;
  max-height: calc(100vh - 60px); position: sticky; top: 84px; overflow: hidden;
}
.panel-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--card-border); }
.panel-title { display: flex; align-items: baseline; gap: 10px; }
.panel-title h2 { font-size: 1.05rem; font-weight: 700; }
.panel-title .count { font-size: .78rem; color: var(--muted); }
.panel-title .accent-g { color: var(--accent); }
.panel-title .accent-p { color: var(--purple); }
.panel-sub { font-size: .76rem; color: var(--dim); margin-top: 3px; }

.tagbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag-chip {
  font-size: .72rem; background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 999px; padding: 4px 11px; cursor: pointer; color: var(--muted);
  user-select: none; transition: all var(--duration-fast) var(--ease-standard); white-space: nowrap;
}
.tag-chip:hover { border-color: rgba(255,255,255,.2); color: var(--text); }
.tag-chip.on.g { background: rgba(79,70,229,.16); border-color: var(--accent); color: #a5b4fc; }
.tag-chip.on.p { background: rgba(139,92,246,.16); border-color: var(--purple); color: #c4b5fd; }
.tag-chip .n { opacity: .6; font-size: .92em; }

.panel-body { overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
.panel-body::-webkit-scrollbar { width: 8px; }
.panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

/* Alphabetical section header (glossary) */
.alpha-head {
  font-size: .72rem; font-weight: 700; letter-spacing: .08em; color: var(--dim);
  padding: 10px 12px 4px; position: sticky; top: 0; background: linear-gradient(180deg, rgba(20,20,24,.96), rgba(20,20,24,.7)); backdrop-filter: blur(4px);
}

/* Entry cards */
.entry {
  padding: 11px 13px; border-radius: 10px;
  transition: background var(--duration-fast) var(--ease-standard);
}
.entry:hover { background: var(--card-bg); }
.entry + .entry { border-top: 1px solid rgba(255,255,255,.04); }
.entry-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0; }
.entry-abbr { font-weight: 700; font-size: .95rem; color: var(--text); }
.entry-exp { font-size: .82rem; color: var(--accent); }
.entry-by { font-size: .74rem; color: var(--dim); margin-left: auto; }
.entry-desc { font-size: .82rem; color: var(--muted); line-height: 1.55; margin-top: 4px; }
.entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.mini-tag {
  font-size: .66rem; background: rgba(255,255,255,.05); border: 1px solid var(--card-border);
  border-radius: 5px; padding: 1px 7px; color: var(--muted); cursor: pointer;
  transition: all var(--duration-fast) var(--ease-standard);
}
.mini-tag:hover { border-color: var(--accent); color: #a5b4fc; }
.mini-tag.cat { color: var(--dim); cursor: default; }
.mini-tag.new { color: var(--amber); border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.08); cursor: default; }
.entry-link { font-size: .74rem; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; word-break: break-all; }

.empty { text-align: center; color: var(--dim); padding: 48px 20px; font-size: .88rem; }
.match-hi { background: rgba(79,70,229,.25); border-radius: 3px; padding: 0 1px; color: #e0f2fe; }

footer { text-align: center; color: var(--dim); font-size: .76rem; margin-top: 30px; line-height: 1.7; }

/* ── Responsive: stack on mobile, columns scroll with the page ──────────── */
@media (max-width: 860px) {
  .wrap { padding: 22px 14px 32px; }
  h1 { font-size: 1.85rem; }
  .split { grid-template-columns: 1fr; gap: 14px; }
  .panel { max-height: none; position: static; }
  .panel-body { max-height: 62vh; }
  .search-dock { top: 8px; }
}

/* Task 7: one dense, source-filtered reference index. */
.source-filters,.collections{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 18px}
.source-filter,.collections a{border:1px solid var(--card-border);border-radius:999px;padding:7px 14px;background:var(--card-bg);color:var(--muted);font:700 .76rem/1 var(--forest-sans,sans-serif)}
.source-filter{cursor:pointer}
.source-filter[aria-pressed="true"]{background:rgba(79,70,229,.2);border-color:var(--accent);color:#d9ddff}
.collections{max-width:980px}
.collections a{border-radius:7px}
.library-index{background:var(--panel);border:1px solid var(--card-border);border-radius:var(--library-panel-radius);backdrop-filter:blur(10px);overflow:hidden}
.library-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:13px 18px;border-bottom:1px solid var(--card-border)}
.library-head h2{font:700 1rem/1.2 var(--forest-sans,sans-serif)}
.result-count{color:var(--muted);font:700 .76rem/1.2 var(--forest-sans,sans-serif)}
.library-list{padding:4px 10px 12px}
.library-row{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(0,2fr) auto;gap:14px;align-items:start;padding:9px 8px;border-radius:8px;border-top:1px solid rgba(255,255,255,.045);animation:libraryRowIn var(--duration-normal) var(--ease-out) both;animation-delay:calc(var(--row-index,0) * var(--stagger-list))}
.library-row:first-child{border-top:0}.library-row:hover{background:var(--card-bg)}.library-row:nth-child(n+11){animation-delay:calc(var(--stagger-card) * 10)}
@keyframes libraryRowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.entry-main{min-width:0}.library-row .entry-link{white-space:nowrap}
@media(max-width:860px){.library-row{grid-template-columns:1fr;gap:5px}.library-row .entry-link{white-space:normal}.library-head{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){.library-row{animation:none!important;transition:none!important}}
</style>

<script src="/web/library/platforms-data.js?v=20260706"></script>
<script>
(function () {
  "use strict";
  var GLOSSARY = (window.AI_INIT_GLOSSARY_DATA || []).slice();
  var PLATFORMS = (window.LIBRARY_PLATFORMS || []).slice();

  function initializeUnifiedLibrary() {
    var entries = GLOSSARY.map(function (entry) {
      var tags = Array.isArray(entry.tags) ? entry.tags.map(String) : [];
      return {
        type: "glossary",
        title: String(entry.abbr || ""),
        subtitle: String(entry.expansion || ""),
        description: String(entry.desc || ""),
        byline: String(entry.category || ""),
        tags: tags,
        url: "",
      };
    }).concat(PLATFORMS.map(function (entry) {
      return {
        type: "platform",
        title: String(entry.name || ""),
        subtitle: String(entry.by || ""),
        description: String(entry.desc || ""),
        byline: String(entry.cat || ""),
        tags: [String(entry.tag || "")].filter(Boolean),
        url: String(entry.url || ""),
      };
    })).sort(function (a, b) {
      return a.title.toLowerCase().localeCompare(b.title.toLowerCase());
    });
    var unifiedState = { q: "", source: "all" };
    var renderFrame = 0;
    var host = document.getElementById("library-list");
    var count = document.getElementById("result-count");
    var qEl = document.getElementById("q");
    var clear = document.getElementById("search-clear");
    var filters = Array.from(document.querySelectorAll(".source-filter"));

    function safeExternalUrl(value) {
      try {
        var parsed = new URL(value);
        if (parsed.protocol !== "https:" || parsed.username || parsed.password) return "";
        return parsed.href;
      } catch (_) {
        return "";
      }
    }
    function visibleEntries() {
      var query = unifiedState.q.trim().toLowerCase();
      return entries.filter(function (entry) {
        if (unifiedState.source !== "all" && entry.type !== unifiedState.source) return false;
        if (!query) return true;
        return [entry.title, entry.subtitle, entry.description, entry.byline].concat(entry.tags)
          .join(" ").toLowerCase().includes(query);
      });
    }
    function appendText(parent, className, text) {
      if (!text) return;
      var node = document.createElement("span");
      node.className = className;
      node.textContent = text;
      parent.appendChild(node);
    }
    function renderRow(entry, index) {
      var row = document.createElement("article");
      row.className = "library-row";
      row.dataset.type = entry.type;
      row.style.setProperty("--row-index", String(Math.min(index, 9)));
      var heading = document.createElement("h3");
      heading.className = "entry-head";
      heading.id = "library-entry-" + index;
      row.setAttribute("aria-labelledby", heading.id);
      appendText(heading, "entry-abbr", entry.title);
      if (entry.subtitle && entry.subtitle !== entry.title) {
        appendText(heading, "entry-exp", entry.subtitle);
      }
      var main = document.createElement("div");
      main.className = "entry-main";
      var description = document.createElement("div");
      description.className = "entry-desc";
      description.textContent = entry.description;
      main.appendChild(description);
      var tags = document.createElement("div");
      tags.className = "entry-tags";
      [entry.type, entry.byline].concat(entry.tags).filter(Boolean).forEach(function (tag) {
        appendText(tags, "mini-tag", tag);
      });
      main.appendChild(tags);
      row.appendChild(heading);
      row.appendChild(main);
      var href = safeExternalUrl(entry.url);
      if (href) {
        var link = document.createElement("a");
        link.className = "entry-link";
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", "Visit " + entry.title);
        link.textContent = "Visit ↗";
        row.appendChild(link);
      }
      return row;
    }
    function renderUnified() {
      var visible = visibleEntries();
      host.replaceChildren();
      if (!visible.length) {
        var empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matching entries.";
        host.appendChild(empty);
      } else {
        var fragment = document.createDocumentFragment();
        visible.forEach(function (entry, index) {
          fragment.appendChild(renderRow(entry, index));
        });
        host.appendChild(fragment);
      }
      count.textContent = visible.length + " of " + entries.length + " entries";
      clear.classList.toggle("show", Boolean(unifiedState.q));
      filters.forEach(function (button) {
        button.setAttribute("aria-pressed", String(button.dataset.source === unifiedState.source));
      });
    }
    function scheduleRender() {
      if (renderFrame) return;
      renderFrame = requestAnimationFrame(function () {
        renderFrame = 0;
        renderUnified();
      });
    }
    qEl.addEventListener("input", function () {
      unifiedState.q = qEl.value;
      scheduleRender();
    });
    qEl.addEventListener("keydown", function (event) {
      if (event.key === "Escape") clear.click();
    });
    clear.addEventListener("click", function () {
      unifiedState.q = "";
      qEl.value = "";
      qEl.focus();
      scheduleRender();
    });
    filters.forEach(function (button) {
      button.addEventListener("click", function () {
        unifiedState.source = button.dataset.source;
        scheduleRender();
      });
    });
    renderUnified();
  }

  initializeUnifiedLibrary();
})();
</script>
