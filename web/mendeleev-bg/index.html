<!DOCTYPE html>
<html lang="bg" class="forest-skin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивна Периодична Таблица / Interactive Periodic Table</title>
<meta name="description" content="Interactive bilingual periodic table (Bulgarian/English) with chemistry recipes — click any element to explore its key compounds and real-world uses.">
<meta property="og:title" content="Interactive Periodic Table — Chemistry Recipes">
<meta property="og:description" content="Click any element to see its top compounds, from table salt to Teflon, from barium meals to lithium batteries.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/web/shared/forest-design.css?v=20260723">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#040c14;color:#a0e8ff;font-family:var(--forest-body, Alegreya, Georgia, serif);min-height:100vh;overflow-x:auto}
h1{text-align:center;padding:16px 10px 2px;font-family:var(--forest-display, "Cormorant Garamond", Georgia, serif);font-weight:700;font-size:1.87em;color:#00d4ff;text-shadow:0 0 20px #00d4ff,0 0 40px #0088aa;letter-spacing:3px}
.subtitle{text-align:center;color:#4a9ebb;margin-bottom:12px;font-family:var(--forest-sans, "Alegreya Sans", sans-serif);font-size:.85em;letter-spacing:1px}

/* ── Search & Language Header ────────────── */
.control-header {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 600px;
  justify-content: center;
  margin: 0 auto 12px;
  padding: 0 15px;
  flex-wrap: wrap;
  align-items: center;
}
#searchInput {
  background: rgba(0, 12, 20, 0.7);
  border: 1px solid rgba(0, 212, 255, 0.4);
  border-radius: 6px;
  padding: 8px 14px;
  color: #a0e8ff;
  outline: none;
  font-size: 0.82em;
  transition: all 0.3s;
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.1);
  width: 290px;
}
#searchInput:focus {
  border-color: #00d4ff;
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.35);
  background: rgba(0, 20, 35, 0.85);
}
#langBtn {
  background: rgba(0, 212, 255, 0.08);
  border: 1px solid #00d4ff;
  color: #00d4ff;
  padding: 7px 14px;
  cursor: pointer;
  font-size: 0.75em;
  border-radius: 6px;
  transition: all 0.3s;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
  box-shadow: 0 0 8px rgba(0, 212, 255, 0.1);
}
#langBtn:hover {
  background: #00d4ff;
  color: #040c14;
  box-shadow: 0 0 15px #00d4ff;
}

/* ── Compound bar ────────────────────────── */
.compound-bar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:6px 20px 10px;border-bottom:1px solid rgba(0,212,255,.1)}
.compound-bar label{font-family:var(--forest-sans, "Alegreya Sans", sans-serif);font-size:.68em;opacity:.5;width:100%;text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.cbtn{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.2);color:#80d4f0;padding:4px 10px;font-size:.75em;cursor:pointer;transition:all .2s;white-space:nowrap;border-radius:4px}
.cbtn:hover{background:rgba(0,212,255,.15);border-color:#00d4ff;color:#00d4ff}
.cbtn.active{background:rgba(0,212,255,.22);border-color:#00d4ff;color:#00d4ff;box-shadow:0 0 8px rgba(0,212,255,.3)}
.cbtn.reset{border-color:rgba(255,100,100,.3);color:#ff8888}
.cbtn.reset:hover{background:rgba(255,100,100,.15);border-color:#ff8888}

/* ── Table ───────────────────────────────── */
.pt-wrap{display:flex;justify-content:center;overflow-x:auto;padding:0 10px}
.pt-grid{display:grid;grid-template-columns:repeat(18,50px);grid-template-rows:repeat(10,50px);gap:2px;padding:10px}
.el{width:50px;height:50px;border:1px solid currentColor;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:rgba(0,0,0,.4);overflow:hidden;transition:opacity .3s,filter .3s,box-shadow 0.3s;font-family:'Segoe UI',Tahoma,sans-serif}
.el:hover{z-index:20}
.el .n{font-size:7px;opacity:.55;line-height:1;align-self:flex-start;padding:2px 0 0 3px;cursor:pointer;transition:opacity .2s,color .2s;position:relative;z-index:2}
.el .n:hover{opacity:1;color:#fff;text-decoration:underline dotted}
.el .sym-wrap{display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;cursor:pointer}
.el .s{font-size:15px;font-weight:700;line-height:1.1}
.el .bg{font-size:5.5px;opacity:.8;text-align:center;max-width:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.el::after{content:'';position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none}
.el:hover::after{opacity:.07}
.el.alkali{color:#ff6b35}.el.alkaline{color:#ffd700}.el.transition{color:#00d4ff}
.el.post{color:#7ab8f5}.el.metalloid{color:#00ff88}.el.nonmetal{color:#ff3399}
.el.halogen{color:#ff8c42}.el.noble{color:#bf7fff}.el.lanthanide{color:#a8ff72}
.el.actinide{color:#ff4d6d}.el.unknown{color:#888}
.el.spacer{border:none;background:none;cursor:default;pointer-events:none}

/* Dimming/filtering states */
.compound-on .el, .legend-on .el, .search-on .el {
  opacity: .15;
  filter: grayscale(.85);
}
.compound-on .el.lit, .legend-on .el.lit, .search-on .el.search-match {
  opacity: 1;
  filter: none;
  box-shadow: 0 0 12px currentColor;
  z-index: 5;
}
.compound-on .el.spacer, .legend-on .el.spacer, .search-on .el.spacer {
  opacity: 0;
  filter: none;
}

/* ── Legend ─────────────────────────────── */
.legend{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:6px 20px 10px;font-size:.7em}
.leg{display:flex;align-items:center;gap:4px;cursor:pointer;padding:3px 6px;border-radius:4px;border:1px solid transparent;transition:all 0.2s;user-select:none}
.leg:hover{background:rgba(0,212,255,0.08);border-color:rgba(0,212,255,0.15)}
.leg.active{background:rgba(0,212,255,0.15);border-color:currentColor;box-shadow:0 0 6px currentColor}
.leg.active .leg-sq{background:currentColor}
.leg-sq{width:10px;height:10px;border:2px solid currentColor}
.leg span{opacity:.75}

/* ── Modals ─────────────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(2,10,18,.88);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.overlay.on{display:flex}
.modal{background:#060e18;border:1px solid #00d4ff;box-shadow:0 0 50px rgba(0,212,255,.22);max-width:720px;width:95vw;max-height:92vh;overflow-y:auto;position:relative}
.modal::-webkit-scrollbar{width:5px}
.modal::-webkit-scrollbar-thumb{background:#00d4ff33}
.xbtn{position:absolute;top:12px;right:12px;background:none;border:1px solid #00d4ff44;color:#00d4ff;width:26px;height:26px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:3}
.xbtn:hover{background:#00d4ff;color:#000}

/* ── Element popup ──────────────────────── */
.mhead{padding:18px 40px 14px 18px;border-bottom:1px solid rgba(0,212,255,.2);display:flex;gap:14px;align-items:center;position:sticky;top:0;background:#060e18;z-index:2}
.msym{width:70px;height:70px;border:2px solid currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif}
.msym::before{content:'';position:absolute;inset:-50%;background:conic-gradient(transparent 0deg,currentColor 1deg,transparent 3deg,transparent 180deg,currentColor 181deg,transparent 183deg);animation:spin 5s linear infinite;opacity:.12}
@keyframes spin{to{transform:rotate(360deg)}}
.msym .mn{font-size:10px;opacity:.5;cursor:pointer;border-bottom:1px dotted currentColor;transition:opacity .2s}
.msym .mn:hover{opacity:1}
.msym .ms{font-size:26px;font-weight:700;line-height:1.1}
.msym .mm{font-size:8px;opacity:.5;cursor:pointer;border-bottom:1px dotted currentColor;transition:opacity .2s}
.msym .mm:hover{opacity:1}
.minfo h2{font-size:1.5em;line-height:1.1;margin-bottom:2px}
.minfo .latin{font-size:.8em;opacity:.5;font-style:italic}
.badge{display:inline-block;padding:2px 9px;border:1px solid currentColor;border-radius:12px;font-size:.68em;margin-top:4px;opacity:.85}

/* ── Popup body two-col ─────────────────── */
.mbody{display:flex;gap:0}
.stat-panel{width:160px;flex-shrink:0;border-right:1px solid rgba(0,212,255,.12);padding:14px 12px;background:rgba(0,212,255,.02)}
.stat-item{margin-bottom:10px}
.stat-lbl{font-family:var(--forest-sans, "Alegreya Sans", sans-serif);font-size:.65em;letter-spacing:1.5px;text-transform:uppercase;opacity:.45;margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:3px}
.stat-lbl:hover{opacity:.75}
.stat-lbl .hint{font-size:.9em;opacity:.5}
.stat-val{font-size:.95em;font-weight:600;color:#e0f4ff}
.content-panel{flex:1;padding:14px 18px;overflow:hidden}

.sec{margin-bottom:16px}
.stitle{font-family:var(--forest-sans, "Alegreya Sans", sans-serif);font-size:.73em;letter-spacing:2px;text-transform:uppercase;opacity:.45;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.07)}
.stext{font-size:.87em;line-height:1.8;color:#b8e4f4}
.apps{display:flex;flex-wrap:wrap;gap:5px}
.atag{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.2);padding:3px 9px;font-size:.78em;color:#88ccee;border-radius:3px}
.diy-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.diy-list li{padding:8px 12px;background:rgba(0,255,136,.04);border:1px solid rgba(0,255,136,.18);border-left:3px solid #00ff88;font-size:.84em;line-height:1.6;color:#a8eece}
.diy-list li strong{color:#00ff88;display:block;margin-bottom:2px;font-size:.9em}
.recipes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.recipe-card{padding:8px 10px;background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.22);border-radius:5px;display:flex;flex-direction:column;gap:2px}
.recipe-formula{font-size:1em;font-weight:700;color:#c084fc;letter-spacing:.5px}
.recipe-name{font-size:.75em;color:#e0c3ff;opacity:.9}
.recipe-note{font-size:.68em;color:#a78bfa;opacity:.7;font-style:italic}

/* ── DYK section ────────────────────────── */
.dyk{background:rgba(160,100,255,.05);border:1px solid rgba(160,100,255,.25);padding:12px;margin-bottom:16px;border-radius:6px}
.dyk-ttl{color:#bf7fff;font-family:var(--forest-sans, "Alegreya Sans", sans-serif);font-size:.72em;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.dyk-text{font-size:.84em;line-height:1.75;color:#ccb8f8}

/* ── Links ──────────────────────────────── */
.links{border-top:1px solid rgba(0,212,255,.15);padding-top:12px;margin-top:4px}
.links a{display:inline-block;color:#00d4ff;font-size:.8em;margin:3px 8px 3px 0;text-decoration:none;border-bottom:1px dotted rgba(0,212,255,.4)}
.links a:hover{border-bottom-style:solid}

/* ── Glossary ───────────────────────────── */
.gterm{border-bottom:1px dashed rgba(255,200,100,.5);color:#ffe090;cursor:pointer;transition:background .15s}
.gterm:hover{background:rgba(255,200,100,.12);border-radius:2px}

/* ── Mini popup (atomic num / glossary) ─── */
.mini-overlay{display:none;position:fixed;inset:0;z-index:2000;align-items:center;justify-content:center}
.mini-overlay.on{display:flex}
.mini-bg{position:absolute;inset:0;background:rgba(2,10,18,.75);backdrop-filter:blur(4px)}
.mini-modal{background:#07111d;border:1px solid #ffd700;box-shadow:0 0 30px rgba(255,215,0,.2);max-width:460px;width:92vw;padding:20px;position:relative;z-index:1;border-radius:8px}
.mini-modal.blue{border-color:#00d4ff;box-shadow:0 0 30px rgba(0,212,255,.2)}
.mini-modal h3{font-size:1.1em;margin-bottom:10px}
.mini-modal p{font-size:.88em;line-height:1.8;color:#c0e8f4;margin-bottom:8px}
.mini-xbtn{position:absolute;top:10px;right:10px;background:none;border:1px solid #ffd70044;color:#ffd700;width:24px;height:24px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.mini-xbtn.blue{border-color:#00d4ff44;color:#00d4ff}
.mini-xbtn:hover{background:currentColor;color:#07111d}

/* Bohr simulator specific animation */
@keyframes vibrate {
  0% { transform: translate(0, 0) scale(1); }
  20% { transform: translate(-0.5px, 0.5px) scale(0.98); }
  40% { transform: translate(0.5px, -0.5px) scale(1.02); }
  60% { transform: translate(-0.5px, -0.5px) scale(1); }
  80% { transform: translate(0.5px, 0.5px) scale(0.99); }
  100% { transform: translate(0, 0) scale(1); }
}
.nucleus {
  transform-origin: 160px 90px;
  animation: vibrate 0.25s linear infinite;
}

@media(max-width:600px){
  .mbody{flex-direction:column}
  .stat-panel{width:100%;border-right:none;border-bottom:1px solid rgba(0,212,255,.12);display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>

function activateCompound(key) {
  if (activeCompound === key) { clearAllFilters(); return; }
  clearAllFilters();
  activeCompound = key;
  const c = COMPOUNDS[key][currentLang];
  
  document.querySelectorAll('.cbtn').forEach(b => {
    if (b.getAttribute('onclick') === `activateCompound('${key}')`) {
      b.classList.add('active');
    } else {
      b.classList.remove('active');
    }
  });

  const grid = document.getElementById('ptGrid');
  grid.classList.add('compound-on');
  
  const nums = COMPOUNDS[key].bg.nums;
  document.querySelectorAll('.el').forEach(el => {
    const n = parseInt(el.dataset.num);
    if (nums.includes(n)) {
      el.classList.add('lit');
    } else {
      el.classList.remove('lit');
    }
  });
}

function clearCompound() {
  activeCompound = null;
  document.querySelectorAll('.cbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('ptGrid').classList.remove('compound-on');
  document.querySelectorAll('.el').forEach(el => el.classList.remove('lit'));
}

function getBohrModelSVG(Z, color) {
  const shells = getElectronShells(Z);
  let svg = `<svg class="bohr-sim" viewBox="0 0 320 180" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#020a12; border:1px solid rgba(0,212,255,0.15); border-radius:8px; box-shadow:inset 0 0 20px rgba(0,212,255,0.05);">
    <defs>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      <radialGradient id="nucGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff3399" stop-opacity="0.8"/>
        <stop offset="60%" stop-color="#ff3399" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#ff3399" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <line x1="160" y1="0" x2="160" y2="180" stroke="rgba(0,212,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="90" x2="320" y2="90" stroke="rgba(0,212,255,0.04)" stroke-width="1"/>
    <circle cx="160" cy="90" r="135" fill="none" stroke="rgba(0,212,255,0.015)" stroke-width="1"/>
    <circle cx="160" cy="90" r="100" fill="none" stroke="rgba(0,212,255,0.015)" stroke-width="1"/>
    <circle cx="160" cy="90" r="65" fill="none" stroke="rgba(0,212,255,0.015)" stroke-width="1"/>
  `;

  shells.forEach((count, sIdx) => {
    const sNum = sIdx + 1;
    const r = 24 + sNum * 15;
    const dur = (2.5 * Math.pow(r / 39, 1.5)).toFixed(2); // Accurate Keplerian speed (T ∝ r^1.5)
    const dir = sNum % 2 === 1 ? 1 : -1;
    const fromDeg = dir === 1 ? 0 : 360;
    const toDeg = dir === 1 ? 360 : 0;

    svg += `
    <g>
      <circle cx="160" cy="90" r="${r}" fill="none" stroke="${color}" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="${fromDeg} 160 90" to="${toDeg} 160 90" dur="${dur}s" repeatCount="indefinite"/>
    `;

    for (let eIdx = 0; eIdx < count; eIdx++) {
      const angle = (eIdx * (360 / count) * Math.PI) / 180;
      const ex = 160 + r * Math.cos(angle);
      const ey = 90 + r * Math.sin(angle);
      svg += `<circle cx="${ex}" cy="${ey}" r="3.2" fill="#00d4ff" filter="url(#glow)" stroke="#ffffff" stroke-width="0.3"/>`;
    }

    svg += `
      </g>
    </g>`;
  });

  svg += `<g class="nucleus">`;
  svg += `<circle cx="160" cy="90" r="11" fill="url(#nucGlow)" opacity="0.6"/>`;
  
  // Z-specific accurate nucleus configurations for light elements
  let particles = [];
  if (Z === 1) {
    particles = [{dx: 0, dy: 0, type: 'p'}];
  } else if (Z === 2) {
    particles = [
      {dx: -2.5, dy: -2.5, type: 'p'}, {dx: 2.5, dy: 2.5, type: 'p'},
      {dx: 2.5, dy: -2.5, type: 'n'}, {dx: -2.5, dy: 2.5, type: 'n'}
    ];
  } else if (Z === 3) {
    particles = [
      {dx: -3, dy: -3, type: 'p'}, {dx: 3, dy: -3, type: 'n'},
      {dx: -3, dy: 3, type: 'n'}, {dx: 3, dy: 3, type: 'p'},
      {dx: 0, dy: 0, type: 'n'}, {dx: -4.5, dy: 0, type: 'p'},
      {dx: 4.5, dy: 0, type: 'n'}
    ];
  } else if (Z === 4) {
    particles = [
      {dx: -3, dy: -3, type: 'p'}, {dx: 3, dy: -3, type: 'n'},
      {dx: -3, dy: 3, type: 'n'}, {dx: 3, dy: 3, type: 'p'},
      {dx: 0, dy: -4, type: 'p'}, {dx: 0, dy: 4, type: 'n'},
      {dx: -4.5, dy: 0, type: 'n'}, {dx: 4.5, dy: 0, type: 'p'},
      {dx: 0, dy: 0, type: 'n'}
    ];
  } else if (Z === 5) {
    particles = [
      {dx: -3, dy: -3, type: 'p'}, {dx: 3, dy: -3, type: 'n'},
      {dx: -3, dy: 3, type: 'n'}, {dx: 3, dy: 3, type: 'p'},
      {dx: 0, dy: -4.5, type: 'p'}, {dx: 0, dy: 4.5, type: 'n'},
      {dx: -4.5, dy: 0, type: 'n'}, {dx: 4.5, dy: 0, type: 'p'},
      {dx: -2, dy: -1, type: 'p'}, {dx: 2, dy: 1, type: 'n'},
      {dx: 0, dy: 0, type: 'n'}
    ];
  } else {
    particles = [
      {dx: -3, dy: -3, type: 'p'}, {dx: 3, dy: -3, type: 'n'},
      {dx: -4, dy: 2, type: 'n'}, {dx: 4, dy: 2, type: 'p'},
      {dx: 0, dy: -5, type: 'p'}, {dx: -1, dy: 0, type: 'n'},
      {dx: 1, dy: 0, type: 'p'}, {dx: 0, dy: 5, type: 'n'},
      {dx: -5, dy: -1, type: 'p'}, {dx: 5, dy: -1, type: 'n'},
      {dx: -2, dy: 4, type: 'p'}, {dx: 2, dy: 4, type: 'n'}
    ];
  }
  
  particles.forEach(p => {
    const px = 160 + p.dx;
    const py = 90 + p.dy;
    const pCol = p.type === 'p' ? '#ff3399' : '#00d4ff';
    svg += `<circle cx="${px}" cy="${py}" r="2.6" fill="${pCol}" stroke="#ffffff" stroke-width="0.3"/>`;
  });
  svg += `</g>`;

  const confLabel = TRANSLATIONS[currentLang].configText || 'Config:';
  svg += `
    <text x="8" y="172" fill="#4a9ebb" font-size="7.5" font-family="monospace" opacity="0.75">${confLabel}</text>
    <text x="125" y="172" fill="#00d4ff" font-size="8.5" font-family="monospace" font-weight="bold">${shells.join(', ')}</text>
    <text x="312" y="172" text-anchor="end" fill="${color}" font-size="8.5" font-family="monospace" font-weight="bold">Z = ${Z}</text>
  </svg>`;

  return svg;
}

function glossify(text) {
  if (!text) return '';
  let t = text;
  const terms = Object.keys(GLOSSARY[currentLang]);
  terms.sort((a, b) => b.length - a.length);
  terms.forEach(k => {
    const escK = k.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
    const re = new RegExp(`(?<![а-яА-Яa-zA-Z0-9])(${escK})(?![а-яА-Яa-zA-Z0-9])`, 'gi');
    t = t.replace(re, `<span class="gterm" onclick="openGlossary('${k}')">$1</span>`);
  });
  return t;
}

function openAtomicMass(mass, sym, bg, col){
  activeMiniState = { type: 'atomicMass', mass, sym, bg, col };
  const t = TRANSLATIONS[currentLang];
  document.getElementById('miniModal').className='mini-modal blue';
  document.getElementById('miniXbtn').className='mini-xbtn blue';
  
  const bgName = currentLang === 'bg' ? bg : GRID.find(x => x[0] === GRID.find(e => e[1] === sym)[0])[3];
  
  const descText = currentLang === 'bg'
    ? `<p>Атомната маса е приблизителното тегло на един <span class="gterm" onclick="openGlossary('атом')">атом</span> на ${bgName}.</p>
       <p>Измерва се в атомни единици маса (${t.uText}). 1u = 1.66 × 10⁻²⁷ кг — изключително малко!</p>
       <p>Атомната маса е почти равна на броя на <span class="gterm" onclick="openGlossary('протон')">протоните</span> + <span class="gterm" onclick="openGlossary('неутрон')">неутроните</span> в ядрото.</p>
       <p>Числото <strong style="color:${col}">${mass}</strong> е средна стойност, заради различните <span class="gterm" onclick="openGlossary('изотоп')">изотопи</span> на ${bgName}.</p>`
    : `<p>Atomic mass is the approximate weight of one <span class="gterm" onclick="openGlossary('atom')">atom</span> of ${bgName}.</p>
       <p>It is measured in atomic mass units (${t.uText}). 1u = 1.66 × 10⁻²⁷ kg — incredibly tiny!</p>
       <p>The atomic mass is almost equal to the number of <span class="gterm" onclick="openGlossary('proton')">protons</span> + <span class="gterm" onclick="openGlossary('neutron')">neutrons</span> in the nucleus.</p>
       <p>The number <strong style="color:${col}">${mass}</strong> is an average value because different <span class="gterm" onclick="openGlossary('isotope')">isotopes</span> of ${bgName} exist.</p>`;

  document.getElementById('miniContent').innerHTML=`
    <h3 style="color:${col}">${t.atomicMassTitle} ${mass} ${t.uText}</h3>
    ${descText}`;
  document.getElementById('miniOverlay').classList.add('on');
}

function closeMini(){
  activeMiniState = null;
  document.getElementById('miniOverlay').classList.remove('on');
}

// ── Interactive Legend Multi-Filtering ────────────────────────────────────
let activeLegendCats = [];

function toggleLegendCategory(cat) {
  clearCompound();
  document.getElementById('searchInput').value = '';
  document.getElementById('ptGrid').classList.remove('search-on');
  document.querySelectorAll('.el').forEach(el => el.classList.remove('search-match'));

  const idx = activeLegendCats.indexOf(cat);
  if (idx > -1) {
    activeLegendCats.splice(idx, 1);
  } else {
    // Limit to 3 active categories max to match requirements
    if (activeLegendCats.length >= 3) {
      activeLegendCats.shift(); // Remove the oldest
    }
    activeLegendCats.push(cat);
  }
  
  updateLegendUI();
}

function updateLegendUI() {
  const grid = document.getElementById('ptGrid');
  
  document.querySelectorAll('.leg').forEach(legEl => {
    let cat = null;
    for (const c of legEl.classList) {
      if (c !== 'leg' && c !== 'active') {
        cat = c;
        break;
      }
    }
    if (activeLegendCats.includes(cat)) {
      legEl.classList.add('active');
    } else {
      legEl.classList.remove('active');
    }
  });

  if (activeLegendCats.length === 0) {
    grid.classList.remove('legend-on');
    document.querySelectorAll('.el').forEach(el => el.classList.remove('lit'));
    return;
  }
  
  grid.classList.add('legend-on');
  document.querySelectorAll('.el').forEach(el => {
    const num = parseInt(el.dataset.num);
    if (!num) return;
    const ge = GRID.find(x => x[0] === num);
    if (!ge) return;
    const cat = ge[5];
    if (activeLegendCats.includes(cat)) {
      el.classList.add('lit');
    } else {
      el.classList.remove('lit');
    }
  });
}

function clearLegendFilter() {
  activeLegendCats = [];
  document.querySelectorAll('.leg').forEach(legEl => legEl.classList.remove('active'));
  document.getElementById('ptGrid').classList.remove('legend-on');
  document.querySelectorAll('.el').forEach(el => el.classList.remove('lit'));
}

function clearAllFilters() {
  clearCompound();
  clearLegendFilter();
  document.getElementById('searchInput').value = '';
  document.getElementById('ptGrid').classList.remove('search-on');
  document.querySelectorAll('.el').forEach(el => el.classList.remove('search-match'));
}

  const grid = document.getElementById('ptGrid');
  
  if (!query) {
    grid.classList.remove('search-on');
    document.querySelectorAll('.el').forEach(el => el.classList.remove('search-match'));
    return;
  }
  
  clearCompound();
  clearLegendFilter();
  
  grid.classList.add('search-on');
  
  document.querySelectorAll('.el').forEach(el => {
    const num = parseInt(el.dataset.num);
    if (!num) return;
    const ge = GRID.find(x => x[0] === num);
    if (!ge) return;
    const [n, sym, bg, lat, mass, cat] = ge;
    
    const catNameBG = CAT_NAMES.bg[cat] ? CAT_NAMES.bg[cat].toLowerCase() : '';
    const catNameEN = CAT_NAMES.en[cat] ? CAT_NAMES.en[cat].toLowerCase() : '';
    
    const matches = 
      n.toString() === query || 
      sym.toLowerCase() === query || 
      bg.toLowerCase().includes(query) || 
      lat.toLowerCase().includes(query) ||
      catNameBG.includes(query) ||
      catNameEN.includes(query);
      
    if (matches) {
      el.classList.add('search-match');
    } else {
      el.classList.remove('search-match');
    }
  });
}

// ── Build Dynamic grid ────────────────────────────────────────────────────
function buildGrid(){
  const g=document.getElementById('ptGrid');
  g.innerHTML = '';
  const cells={};
  GRID.forEach(([n,sym,bg,lat,mass,cat,row,col])=>{cells[`${row}_${col}`]={n,sym,bg,lat,mass,cat};});
  
  cells['6_3']={n:'57-71',sym:'La-Lu',bg:'Лантаниди',lat:'Lanthanides',mass:'',cat:'lanthanide',isRef:true};
  cells['7_3']={n:'89-103',sym:'Ac-Lr',bg:'Актиниди',lat:'Actinides',mass:'',cat:'actinide',isRef:true};
  
  for(let r=1;r<=10;r++){
    for(let c=1;c<=18;c++){
      const k=`${r}_${c}`;
      const div=document.createElement('div');
      if(r===8){div.className='el spacer';g.appendChild(div);continue;}
      if(cells[k]){
        const d=cells[k];
        div.className=`el ${d.cat}`;
        div.dataset.num=d.n;
        
        const name = currentLang === 'bg' ? d.bg : d.lat;
        const colVal = CAT_COLORS[d.cat]||'#00d4ff';
        
        if(d.isRef){
          div.innerHTML=`<span style="font-size:6.5px;text-align:center;padding:2px">${d.sym}<br><span style="font-size:5px;opacity:.55">${name}</span></span>`;
          div.style.cursor='default';
        } else {
          div.innerHTML=`<span class="n" title="Атомен номер ${d.n} / Atomic number ${d.n}">${d.n}</span><div class="sym-wrap"><span class="s">${d.sym}</span><span class="bg">${name}</span></div>`;
          
          div.querySelector('.n').addEventListener('click',e=>{
            e.stopPropagation();
            openAtomicNum(d.n,d.sym,d.bg,colVal);
          });
          
          div.querySelector('.sym-wrap').addEventListener('click',e=>{e.stopPropagation();openModal(d.n);});
        }
      } else {
        div.className='el spacer';
      }
      g.appendChild(div);
    }
  }
}

// ── Dual Language Rendering ───────────────────────────────────────────────
function renderLegend() {
  const container = document.getElementById('legendContainer');
  container.innerHTML = '';
  
  const cats = ['alkali', 'alkaline', 'transition', 'post', 'metalloid', 'nonmetal', 'halogen', 'noble', 'lanthanide', 'actinide', 'unknown'];
  cats.forEach(cat => {
    const name = CAT_NAMES[currentLang][cat];
    const activeClass = activeLegendCats.includes(cat) ? 'active' : '';
    container.innerHTML += `
      <div class="leg ${cat} ${activeClass}" onclick="toggleLegendCategory('${cat}')" style="color: ${CAT_COLORS[cat]}">
        <div class="leg-sq"></div>
        <span>${name}</span>
      </div>
    `;
  });
}

function renderCompounds() {
  const bar = document.getElementById('compoundBar');
  const t = TRANSLATIONS[currentLang];
  
  let html = `<label>🔬 ${t.compoundsLabel}</label>`;
  Object.keys(COMPOUNDS).forEach(key => {
    const c = COMPOUNDS[key][currentLang];
    const activeClass = activeCompound === key ? 'active' : '';
    html += `<button class="cbtn ${activeClass}" onclick="activateCompound('${key}')" title="${c.desc}">${c.emoji} ${c.name}</button>`;
  });
  html += `<button class="cbtn reset" onclick="clearAllFilters()">${t.clearBtn}</button>`;
  bar.innerHTML = html;
}

function toggleLanguage() {
  currentLang = currentLang === 'bg' ? 'en' : 'bg';
  
  // Update UI Elements
  const t = TRANSLATIONS[currentLang];
  document.querySelector('.subtitle').innerText = t.subtitle;
  document.getElementById('searchInput').placeholder = t.searchPlaceholder;
  document.getElementById('langBtn').innerText = currentLang === 'bg' ? 'EN' : 'BG';
  
  // Dynamically update main page headers & page title
  document.querySelector('h1').innerText = t.title;
  document.title = t.title.replace(/⚗/g, '').trim();
  
  // Re-build & Re-render everything
  buildGrid();
  renderLegend();
  renderCompounds();
  
  // Keep active compound highlight going
  if (activeCompound) {
    const activeKey = activeCompound;
    activeCompound = null;
    activateCompound(activeKey);
  }
  
  // Keep legend active highlight going
  if (activeLegendCats.length > 0) {
    updateLegendUI();
  }
  
  // Re-localize active modal/popups if open
  if (currentOpenElementNum) {
    openModal(currentOpenElementNum);
  }
  
  if (activeMiniState) {
    if (activeMiniState.type === 'atomicNum') {
      openAtomicNum(activeMiniState.num, activeMiniState.sym, activeMiniState.bg, activeMiniState.col);
    } else if (activeMiniState.type === 'atomicMass') {
      openAtomicMass(activeMiniState.mass, activeMiniState.sym, activeMiniState.bg, activeMiniState.col);
    } else if (activeMiniState.type === 'glossary') {
      // Find translated key
      let oldKey = activeMiniState.key.toLowerCase();
      let newKey = oldKey;
      
      // Match key from Bulgarian to English glossary or vice versa
      const bgKeys = Object.keys(GLOSSARY.bg);
      const enKeys = Object.keys(GLOSSARY.en);
      const bgIdx = bgKeys.indexOf(oldKey);
      const enIdx = enKeys.indexOf(oldKey);
      
      if (currentLang === 'en' && bgIdx > -1) {
        newKey = enKeys[bgIdx] || enKeys[0];
      } else if (currentLang === 'bg' && enIdx > -1) {
        newKey = bgKeys[enIdx] || bgKeys[0];
      }
      openGlossary(newKey);
    }
  }
}

// ── Open element modal ────────────────────────────────────────────────────
let currentOpenElementNum = null;

function openModal(num){
  currentOpenElementNum = num;
  const ge=GRID.find(x=>x[0]===num);
  if(!ge)return;
  const [n,sym,bg,lat,mass,cat]=ge;
  
  const t = TRANSLATIONS[currentLang];
  const eData = ELEMENTS[n] ? ELEMENTS[n][currentLang] : null;
  const def = defaultData(n)[currentLang];
  const d = Object.assign({name: currentLang === 'bg' ? bg : lat, mass, disc: def.disc, where: def.where, dyk: def.dyk, facts: def.facts, apps: def.apps, diy: def.diy}, eData);
  
  const col=CAT_COLORS[cat]||'#00d4ff';
  const row=ge[6],colNum=ge[7];
  const group=colNum<=2||colNum>=13?colNum:(colNum<=12?colNum:'—');
  
  const localizedCat = CAT_NAMES[currentLang][cat] || cat;
  const localizedState = STATES[currentLang][cat] || '—';

  document.getElementById('mhead').innerHTML=`
    <div class="msym" style="color:${col};border-color:${col}">
      <span class="mn" title="${t.atomicNumLabel}" onclick="openAtomicNum(${n},'${sym}','${bg}','${col}')">${n}</span>
      <span class="ms">${sym}</span>
      <span class="mm" title="${t.atomicMassLabel}" onclick="openAtomicMass('${mass}','${sym}','${bg}','${col}')">${mass}</span>
    </div>
    <div class="minfo">
      <h2 style="color:${col}">${d.name}</h2>
      <div class="latin">${lat}</div>
      <span class="badge" style="color:${col};border-color:${col}">${localizedCat}</span>
    </div>`;

  const statHtml=`
    <div class="stat-panel">
      <div class="stat-item">
        <div class="stat-lbl" onclick="openAtomicNum(${n},'${sym}','${bg}','${col}')" style="cursor:pointer;color:${col}">
          ${t.atomicNumLabel} <span class="hint">↗</span>
        </div>
        <div class="stat-val" style="color:${col}">${n}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl" onclick="openAtomicMass('${mass}','${sym}','${bg}','${col}')" style="cursor:pointer;color:${col}">
          ${t.atomicMassLabel} <span class="hint">↗</span>
        </div>
        <div class="stat-val">${mass} ${t.uText}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">${t.period}</div>
        <div class="stat-val">${PERIODS[currentLang][row]||row}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">${t.group}</div>
        <div class="stat-val">${group}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">${t.state}</div>
        <div class="stat-val">${localizedState}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">${t.category}</div>
        <div class="stat-val" style="font-size:.8em">${localizedCat}</div>
      </div>
    </div>`;

  const dyk=d.dyk||{t:'Интересен елемент! / Interesting element!',art:'atom'};
  const bohrSvg = getBohrModelSVG(n, col);
  
  let content=`
    <div class="dyk">
      <div class="dyk-ttl">${t.dykTitle}</div>
      <div style="width:100%; display:flex; justify-content:center; margin:10px 0;">
        <div style="width:320px; height:180px;">${bohrSvg}</div>
      </div>
      <div class="dyk-text">${glossify(dyk.t)}</div>
    </div>
    <div class="sec"><div class="stitle">${t.historyTitle}</div><div class="stext">${glossify(d.disc)}</div></div>`;

  if(d.facts&&d.facts.length){
    content+=`<div class="sec"><div class="stitle">${t.factsTitle}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">`;
    d.facts.forEach(([l,v])=>content+=`<div style="background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.1);padding:6px 9px;font-size:.82em"><div style="opacity:.5;font-size:.78em;margin-bottom:1px">${l}</div>${glossify(String(v))}</div>`);
    content+=`</div></div>`;
  }

  content+=`<div class="sec"><div class="stitle">${t.whereTitle}</div><div class="stext">${glossify(d.where)}</div></div>`;

  if(d.apps&&d.apps.length){
    content+=`<div class="sec"><div class="stitle">${t.appsTitle}</div><div class="apps">`;
    d.apps.forEach(a=>content+=`<span class="atag">${a}</span>`);
    content+=`</div></div>`;
  }

  if(d.diy&&d.diy.length){
    content+=`<div class="sec"><div class="stitle">${t.diyTitle}</div><ul class="diy-list">`;
    d.diy.forEach(x=>content+=`<li><strong>🔬 ${x.t}</strong>${glossify(x.d)}</li>`);
    content+=`</ul></div>`;
  }

  const recipes = RECIPES[n];
  if(recipes&&recipes.length){
    content+=`<div class="sec"><div class="stitle">${t.recipesTitle}</div><div class="recipes-grid">`;
    recipes.forEach(r=>{
      const name = currentLang==='bg' ? r.bg : r.en;
      const note = currentLang==='bg' ? r.nb : r.ne;
      content+=`<div class="recipe-card"><div class="recipe-formula">${r.f}</div><div class="recipe-name">${name}</div><div class="recipe-note">${note}</div></div>`;
    });
    content+=`</div></div>`;
  }

  document.getElementById('mbody').innerHTML=statHtml+`<div class="content-panel">${content}</div>`;
  document.getElementById('overlay').classList.add('on');
}

function closeModal(){
  currentOpenElementNum = null;
  document.getElementById('overlay').classList.remove('on');
}

// ── Init App ──────────────────────────────────────────────────────────────
buildGrid();
renderLegend();
renderCompounds();

document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMini();}});
</script>
