    <style>
      :root {
        --bg: #07070b;
        --surface: #0f0f15;
        --border: rgba(255, 255, 255, 0.08);
        --text-primary: #f3f4f6;
        --text-muted: #9ca3af;
        --accent: #4f46e5;
        --accent-green: #22c55e;
        --radius: 8px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .preview-bg {
        transition: background var(--duration-recovery) var(--ease-out);
      }

      .preview-badge {
        transition: border-color var(--duration-normal) var(--ease-out);
      }

      .state-btn {
        transition:
          border-color var(--duration-fast) var(--ease-out),
          color var(--duration-fast) var(--ease-out);
      }

      @media (max-width: 760px) {
        html,
        body,
        #root {
          min-height: 100%;
          height: auto;
        }

        .app {
          min-height: 100dvh;
          height: auto;
        }

        .topbar {
          min-height: 54px;
          height: auto;
          padding: 8px 12px;
          flex-wrap: wrap;
        }

        .topbar-sub {
          flex-basis: 100%;
          padding-left: 22px;
        }

        .columns {
          display: flex;
          flex-direction: column;
          min-height: 0;
        }

        .panel {
          overflow: visible;
        }

        .left,
        .right {
          border: 0;
          border-bottom: 1px solid var(--border);
        }

        .lib-list {
          display: grid;
          grid-auto-flow: column;
          grid-auto-columns: minmax(160px, 72vw);
          overflow-x: auto;
          overscroll-behavior-inline: contain;
          scroll-snap-type: inline proximity;
          padding-bottom: 10px;
        }

        .lib-item {
          min-height: 56px;
          scroll-snap-align: start;
        }

        .param-list {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .center {
          min-height: 430px;
          height: 62dvh;
        }

        .right {
          min-height: 440px;
        }

        .audio-btn,
        .state-btn,
        .btn,
        .lib-item {
          min-height: 44px;
        }
      }

      @media (max-width: 420px) {
        .param-list {
          grid-template-columns: 1fr;
        }

        .state-bar {
          width: calc(100% - 24px);
          justify-content: center;
        }

        .state-btn {
          flex: 1;
          padding-inline: 10px;
        }
      }
    </style>
