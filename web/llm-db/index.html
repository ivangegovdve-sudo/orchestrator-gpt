<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Platforms DB</title>
    <style>
        :root {
            --bg: #09090b;
            --card-bg: rgba(24, 24, 27, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --muted: #a1a1aa;
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --purple: #8b5cf6;
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.05), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.05), transparent 40%);
            color: var(--text);
            padding: 40px 20px 60px;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--text);
            text-decoration: none;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255,255,255,0.15);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
            background: rgba(0,0,0,0.5);
        }

        input[type="text"]::placeholder {
            color: rgba(255,255,255,0.3);
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--accent) 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Layout for ingest form */
        .ingest-form {
            display: grid;
            grid-template-columns: 1fr 2fr auto;
            gap: 12px;
            align-items: start;
        }
        .ingest-form input { margin-bottom: 0; }

        @media (max-width: 640px) {
            .ingest-form {
                grid-template-columns: 1fr;
            }
        }

        .search-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            margin-bottom: 20px;
        }
        .search-row input, .search-row select {
            margin-bottom: 0;
        }
        @media (max-width: 640px) {
            .search-row {
                grid-template-columns: 1fr;
            }
        }

        .doc-list {
            display: grid;
            gap: 16px;
        }

        .doc-item {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
            animation: slideUpFade 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .doc-item:hover {
            border-color: rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
        }

        .doc-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .doc-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--purple);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .doc-source {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-all;
        }

        .doc-content {
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            background: rgba(0,0,0,0.5);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            color: #d1d5db;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .doc-content::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .doc-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        .doc-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .doc-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }

        .doc-item.expanded .doc-content {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-small {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            font-size: 13px;
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            transition: all 0.2s;
        }
        .btn-small:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            box-shadow: none;
            transform: none;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: var(--accent);
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #ingestStatus {
            margin-top: 12px;
            font-size: 13px;
            min-height: 20px;
            transition: opacity 0.3s;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            border: 1px dashed rgba(255,255,255,0.1);
            font-size: 14px;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--muted);
            margin-top: -10px;
            padding-bottom: 10px;
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>LLM Platforms DB</h1>
                <div class="stats-bar" id="statsBar">
                    <span class="stats-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg> <span id="sourceCount">0</span> Sources</span>
                    <span class="stats-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> <span id="docCount">0</span> Documents</span>
                </div>
            </div>
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to Hub
            </a>
        </header>

        <div class="card">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Ingest Source
            </h2>
            <div class="ingest-form">
                <input type="text" id="ingestName" placeholder="Source Name (e.g. OpenAI)">
                <input type="text" id="ingestUrl" placeholder="URL (e.g. https://platform.openai.com/docs/models.md)">
                <button id="ingestBtn" onclick="ingestSource()">
                    Ingest
                </button>
            </div>
            <div id="ingestStatus"></div>
        </div>

        <div class="card">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Search Documents
            </h2>

            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Search across documents..." onkeyup="if(event.key === 'Enter') searchDocs()">
                <select id="sourceFilter" onchange="searchDocs()">
                    <option value="">All Sources</option>
                </select>
                <button id="searchBtn" onclick="searchDocs()">
                    Search
                </button>
            </div>

            <div id="loading" class="spinner"></div>
            <div id="results" class="doc-list"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/llm-db';
        let isIngesting = false;
        let isSearching = false;

        // 🛡️ SECURITY: Prevent XSS by sanitizing data from backend before inserting via innerHTML
        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        async function loadSources() {
            try {
                const res = await fetch(`${API_BASE}/sources`);
                if (!res.ok) throw new Error('Failed to load sources');
                const sources = await res.json();

                const select = document.getElementById('sourceFilter');
                const currentVal = select.value;

                select.innerHTML = '<option value="">All Sources</option>';
                sources.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = s.name;
                    select.appendChild(option);
                });
                select.value = currentVal;

                document.getElementById('sourceCount').textContent = sources.length;
            } catch (error) {
                console.error('Error loading sources:', error);
            }
        }

        function showStatus(msg, color) {
            const el = document.getElementById('ingestStatus');
            el.textContent = msg;
            el.style.color = color;
            el.style.opacity = '1';
        }

        async function ingestSource() {
            if (isIngesting) return;

            const name = document.getElementById('ingestName').value.trim();
            const url = document.getElementById('ingestUrl').value.trim();
            const btn = document.getElementById('ingestBtn');

            if (!name || !url) {
                showStatus('Please provide both name and URL.', '#ef4444');
                return;
            }

            isIngesting = true;
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="display:block; width:16px; height:16px; margin:0; border-width:2px;"></div>';
            showStatus('Ingesting...', 'var(--accent)');

            try {
                const res = await fetch(`${API_BASE}/ingest`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, url })
                });

                if (!res.ok) throw new Error('Ingestion failed');

                showStatus('Ingestion started successfully. It may take a few moments to process.', '#22c55e');

                document.getElementById('ingestName').value = '';
                document.getElementById('ingestUrl').value = '';

                setTimeout(() => {
                    loadSources();
                    searchDocs();
                    setTimeout(() => { showStatus('', 'transparent'); }, 5000);
                }, 2000);
            } catch (error) {
                console.error('Ingestion error:', error);
                showStatus(`Error: ${error.message}`, '#ef4444');
            } finally {
                isIngesting = false;
                btn.disabled = false;
                btn.textContent = 'Ingest';
            }
        }

        async function searchDocs() {
            if (isSearching) return;

            const query = document.getElementById('searchInput').value.trim();
            const sourceId = document.getElementById('sourceFilter').value;
            const resultsEl = document.getElementById('results');
            const loadingEl = document.getElementById('loading');
            const btn = document.getElementById('searchBtn');

            isSearching = true;
            btn.disabled = true;
            loadingEl.style.display = 'block';
            resultsEl.innerHTML = '';

            try {
                let url = `${API_BASE}/docs?q=${encodeURIComponent(query)}`;
                if (sourceId) url += `&source_id=${sourceId}`;

                const res = await fetch(url);
                if (!res.ok) throw new Error('Search failed');
                const docs = await res.json();

                document.getElementById('docCount').textContent = docs.length;

                if (docs.length === 0) {
                    resultsEl.innerHTML = '<div class="empty-state">No documents found. Try adjusting your search or ingesting new sources.</div>';
                    return;
                }

                docs.forEach((doc, index) => {
                    const div = document.createElement('div');
                    div.className = 'doc-item';
                    div.style.animationDelay = `${index * 0.05}s`;

                    let hostname = '';
                    try {
                        const urlObj = new URL(doc.url);
                        hostname = urlObj.hostname;
                    } catch (e) {
                        hostname = doc.url; // fallback if invalid URL
                    }

                    div.innerHTML = `
                        <div class="doc-title">
                            ${escapeHtml(doc.title)}
                            <span class="doc-badge">${escapeHtml(doc.source_name)}</span>
                        </div>
                        <div class="doc-source">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                            <a href="${escapeHtml(doc.url)}" target="_blank" title="${escapeHtml(doc.url)}">${escapeHtml(hostname)}</a>
                        </div>
                        <button class="btn-small" onclick="toggleDoc(${doc.id}, this)">Show Content</button>
                        <div class="doc-content" id="content-${doc.id}">Loading...</div>
                    `;
                    resultsEl.appendChild(div);
                });
            } catch (error) {
                console.error('Search error:', error);
                resultsEl.innerHTML = `<div class="empty-state" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.2);">Error performing search. Is the backend API running?</div>`;
            } finally {
                isSearching = false;
                btn.disabled = false;
                loadingEl.style.display = 'none';
            }
        }

        async function toggleDoc(id, btnElement) {
            const itemEl = btnElement.closest('.doc-item');
            const contentEl = document.getElementById(`content-${id}`);

            if (itemEl.classList.contains('expanded')) {
                itemEl.classList.remove('expanded');
                btnElement.textContent = 'Show Content';
                return;
            }

            itemEl.classList.add('expanded');
            btnElement.textContent = 'Hide Content';

            if (contentEl.textContent === 'Loading...') {
                try {
                    const res = await fetch(`${API_BASE}/docs/${id}`);
                    if (!res.ok) throw new Error('Failed to fetch document content');
                    const doc = await res.json();

                    let content = doc.content || 'No content available.';
                    content = content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    contentEl.innerHTML = content;
                } catch (error) {
                    contentEl.textContent = `Error loading content: ${error.message}`;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSources();
            searchDocs();
        });
    </script>
</body>
</html>
