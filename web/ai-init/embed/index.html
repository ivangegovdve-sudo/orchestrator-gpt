<!doctype html>
<html lang="en">
<head>
<script defer src="/web/shared/feedback.js?v=20260729d"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI_INIT Embedded Search</title>
<link rel="stylesheet" href="/web/shared/forest-design.css?v=20260729d"/>
<style>
:root {
  --bg: #070a08;
  --panel: rgba(13, 18, 14, 0.94);
  --border: rgba(188, 198, 180, 0.28);
  --text: #f2efe4;
  --muted: #a9b3a1;
  --accent: #8fe6ae;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(circle at 8% 10%, rgba(143, 230, 174, 0.12), transparent 36%),
    radial-gradient(circle at 88% 0%, rgba(232, 184, 107, 0.1), transparent 36%),
    var(--bg);
  font-family: var(--forest-body, Alegreya, Georgia, serif);
}

main {
  width: min(820px, 100%);
  margin: 0 auto;
  padding: 24px 12px;
}

.card {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  padding: 12px;
}

.search {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}

input {
  width: 100%;
  border: 1px solid rgba(188, 198, 180, 0.38);
  border-radius: 12px;
  background: rgba(5, 8, 6, 0.85);
  color: var(--text);
  outline: 0;
  padding: 12px;
  font-size: 1rem;
}

button {
  border: 1px solid rgba(188, 198, 180, 0.38);
  border-radius: 12px;
  background: rgba(10, 15, 11, 0.95);
  color: var(--text);
  cursor: pointer;
  padding: 0 14px;
}

button:hover {
  border-color: rgba(143, 230, 174, 0.62);
}

.results {
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.result {
  width: 100%;
  border: 0;
  border-top: 1px solid rgba(188, 198, 180, 0.18);
  background: transparent;
  color: inherit;
  text-align: left;
  padding: 10px;
  cursor: pointer;
}

.result:first-child { border-top: 0; }

.result:hover { background: rgba(232, 184, 107, 0.12); }

.result b { color: var(--accent); }

.empty {
  padding: 10px;
  color: var(--muted);
  font-size: 0.9rem;
}

#status {
  min-height: 1.2em;
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.83rem;
}

input, button, #status, .result b {
  font-family: var(--forest-sans, "Alegreya Sans", sans-serif);
}
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="search">
      <input id="embed-search-input" type="search" placeholder="Search abbreviation..." autocomplete="off" />
      <button id="embed-search-clear" type="button">Clear</button>
    </div>
    <div id="embed-results" class="results"></div>
    <div id="status"></div>
  </section>
</main>

<script src="../glossary-data.js"></script>
<script src="../glossary-search.js"></script>
<script src="./embed.js"></script>
</body>
</html>
