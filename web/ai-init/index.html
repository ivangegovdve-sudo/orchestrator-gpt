<!doctype html>
<html lang="en" class="forest-skin">
<head>
<script defer src="/web/shared/feedback.js?v=20260725c"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI & Tech Glossary</title>
<link rel="stylesheet" href="/web/shared/forest-design.css?v=20260725c"/>
<style>
:root {
  --bg: #07070b;
  --surface: #0f0f15;
  --bg-soft: #0d120e;
  --panel: rgba(13, 18, 14, 0.92);
  --border: rgba(255, 255, 255, 0.08);
  --text-primary: #f3f4f6;
  --text-muted: #9ca3af;
  --text: #f2efe4;
  --muted: #a9b3a1;
  --accent: #4f46e5;
  --accent-green: #22c55e;
  --glossary-accent: #8fe6ae;
  --accent-2: #e8b86b;
  --shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(circle at 8% 10%, rgba(143, 230, 174, 0.12), transparent 36%),
    radial-gradient(circle at 88% 0%, rgba(232, 184, 107, 0.1), transparent 36%),
    var(--bg);
  font-family: var(--forest-body, Alegreya, Georgia, serif);
}

main {
  min-height: 100vh;
  padding: 26px 16px 36px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.app-shell {
  width: min(920px, 100%);
}

.view {
  display: none;
}

.view.active {
  display: block;
}

.hero {
  text-align: center;
  margin-bottom: 16px;
}

.hero h1 {
  margin: 0;
  font-family: var(--forest-display, "Cormorant Garamond", Georgia, serif);
  font-weight: 650;
  font-size: clamp(1.75rem, 3.6vw, 2.4rem);
  letter-spacing: 0.01em;
}

.hero p {
  margin: 8px auto 0;
  max-width: 620px;
  color: var(--muted);
  font-size: 0.95rem;
}

.search-card,
.library-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: linear-gradient(152deg, rgba(13, 18, 14, 0.98), rgba(5, 8, 6, 0.97));
  box-shadow: var(--shadow);
  padding: 14px;
}

.search-bar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(188, 198, 180, 0.38);
  border-radius: 14px;
  background: rgba(5, 8, 6, 0.85);
  padding: 8px;
}

.icon-button,
.search-button {
  border: 1px solid rgba(188, 198, 180, 0.38);
  background: rgba(10, 15, 11, 0.95);
  color: var(--text);
  border-radius: 11px;
  width: 42px;
  height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-button:hover,
.search-button:hover {
  border-color: rgba(143, 230, 174, 0.62);
}

.books-icon {
  width: 20px;
  height: 20px;
  fill: currentColor;
  transform-origin: center;
}

.icon-button:hover .books-icon {
  animation: bookHoverLoop var(--duration-crown-enter) ease-in-out infinite;
}

@keyframes bookHoverLoop {
  0% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-1px) rotate(-4deg); }
  50% { transform: translateY(1px) rotate(4deg); }
  75% { transform: translateY(-1px) rotate(-2deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

.search-input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: clamp(1.02rem, 2.2vw, 1.24rem);
  padding: 8px 4px;
}

.search-input::placeholder {
  color: #7d8877;
}

.search-hint {
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.83rem;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.results-dropdown {
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: rgba(9, 13, 10, 0.95);
  overflow: hidden;
  max-height: 420px;
  overflow-y: auto;
}

.result-item {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  padding: 10px 12px;
  border-top: 1px solid rgba(188, 198, 180, 0.14);
  cursor: pointer;
}

.result-item:first-child {
  border-top: 0;
}

.result-item:hover,
.result-item.active {
  background: rgba(232, 184, 107, 0.15);
}

.result-top {
  display: flex;
  gap: 8px;
  align-items: baseline;
  margin-bottom: 4px;
}

.result-abbr {
  font-weight: 700;
  color: var(--glossary-accent);
  font-size: 0.98rem;
}

.result-expansion {
  font-size: 0.92rem;
  color: #e6e2d3;
}

.result-desc {
  margin: 0;
  color: var(--muted);
  font-size: 0.83rem;
  line-height: 1.28;
}

.empty-state {
  padding: 12px;
  color: var(--muted);
  font-size: 0.9rem;
}

.library-head {
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.library-title {
  margin: 0;
  font-family: var(--forest-display, "Cormorant Garamond", Georgia, serif);
  font-weight: 650;
  font-size: 1.15rem;
}

.library-subtle {
  font-size: 0.82rem;
  color: var(--muted);
}

.library-scroll {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.accordion {
  border: 1px solid rgba(188, 198, 180, 0.2);
  border-radius: 11px;
  background: rgba(13, 18, 14, 0.82);
  overflow: hidden;
}

.accordion-trigger {
  width: 100%;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  cursor: pointer;
}

.accordion-trigger:hover {
  background: rgba(232, 184, 107, 0.1);
}

.accordion-name {
  font-size: 0.9rem;
  font-weight: 600;
}

.accordion-count {
  font-size: 0.78rem;
  color: var(--muted);
}

.accordion-chevron {
  margin-left: 8px;
  color: var(--muted);
  transition: transform var(--duration-fast) var(--ease-out);
}

.accordion.open > .accordion-trigger .accordion-chevron {
  transform: rotate(90deg);
}

.accordion-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--duration-normal) var(--ease-out);
}

.accordion.open > .accordion-panel {
  grid-template-rows: 1fr;
}

.accordion-inner {
  overflow: hidden;
  padding: 0 8px 8px;
}

.subcategory {
  margin-top: 6px;
}

.subcategory .accordion-name {
  font-size: 0.84rem;
  color: #d6dcc6;
}

.entry-list {
  margin-top: 6px;
  display: grid;
  gap: 6px;
}

.entry-item {
  width: 100%;
  border: 1px solid rgba(188, 198, 180, 0.2);
  border-radius: 9px;
  background: rgba(7, 11, 8, 0.88);
  color: inherit;
  text-align: left;
  cursor: pointer;
  padding: 8px 10px;
}

.entry-item:hover {
  border-color: rgba(143, 230, 174, 0.62);
  background: rgba(10, 15, 11, 0.96);
}

.entry-row {
  display: flex;
  gap: 7px;
  align-items: baseline;
}

.entry-item .abbr {
  color: var(--glossary-accent);
  font-weight: 700;
  font-size: 0.88rem;
}

.entry-item .expansion {
  color: #e2dfd0;
  font-size: 0.82rem;
}

.entry-item .desc {
  margin-top: 3px;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.24;
}

.toast {
  position: fixed;
  right: 14px;
  bottom: 14px;
  border: 1px solid rgba(143, 230, 174, 0.5);
  background: rgba(7, 11, 8, 0.96);
  color: #f2efe4;
  border-radius: 11px;
  padding: 8px 12px;
  font-size: 0.82rem;
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition:
    opacity var(--duration-fast) var(--ease-out),
    transform var(--duration-fast) var(--ease-out);
}

.toast.visible {
  opacity: 1;
  transform: translateY(0);
}

.result-abbr, .entry-item .abbr, .accordion-name, .accordion-count,
.search-hint, .library-subtle, .toast, .search-input {
  font-family: var(--forest-sans, "Alegreya Sans", sans-serif);
}

.hub-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 16px;
  color: var(--glossary-accent);
  text-decoration: none;
  font-size: 13px;
  opacity: .65;
  transition: opacity var(--duration-fast) var(--ease-out);
}

.hub-link:hover,
.hub-link:focus-visible {
  opacity: 1;
}

/* Accessibility focus styles */
button:focus-visible,
input:focus-visible,
.search-input:focus-visible {
  outline: 2px solid var(--glossary-accent);
  outline-offset: 2px;
}

@media (max-width: 640px) {
  main { padding: 18px 10px 24px; }
  .search-card, .library-card { padding: 10px; }
  .icon-button, .search-button { width: 38px; height: 38px; }
}
</style>

</head>
<body data-forest-page="library">
<main>
  <div class="app-shell">
    <a class="hub-link" href="/">← Forest HUB</a>
    <section id="home-view" class="view active" aria-label="Home Search">
      <header class="hero">
        <h1>AI & Tech Glossary</h1>
        <p>Search 527+ AI, compute, cloud, and infra abbreviations instantly — Transformer, Attention, Benchmark, Agent, Fine-tuning, and more. Open the library icon to browse by category.</p>
      </header>

      <div class="search-card">
        <div class="search-bar">
          <button id="home-library-button" class="icon-button" type="button" aria-label="Open Library" title="Open Library">
            <svg class="books-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5C3 4.1 4.1 3 5.5 3H11v17H5.5A2.5 2.5 0 0 1 3 17.5v-12zM13 3h5.5A2.5 2.5 0 0 1 21 5.5v12a2.5 2.5 0 0 1-2.5 2.5H13V3zm-8 2a.5.5 0 0 0-.5.5v12c0 .8.7 1.5 1.5 1.5H9V5H5zm10 0v14h3c.8 0 1.5-.7 1.5-1.5v-12A.5.5 0 0 0 18 5h-3z"/></svg>
          </button>

          <input id="home-search-input" class="search-input" type="search" placeholder="Search abbreviation or term..." autocomplete="off" />

          <button id="home-search-button" class="search-button" type="button" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 0 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="search-hint">
          <span id="home-count"></span>
          <span>Click result to copy · Press <kbd style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:1px 5px;font-size:.8em">/</kbd> to focus</span>
        </div>

        <div id="home-results" class="results-dropdown" hidden></div>
      </div>
    </section>

    <section id="library-view" class="view" aria-label="Library View">
      <div class="library-card">
        <div class="library-head">
          <h2 class="library-title">Library</h2>
          <span class="library-subtle">Collapsed by default</span>
        </div>

        <div class="search-bar">
          <button id="library-home-button" class="icon-button" type="button" aria-label="Back to Home Search" title="Back to Home Search">
            <svg class="books-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5C3 4.1 4.1 3 5.5 3H11v17H5.5A2.5 2.5 0 0 1 3 17.5v-12zM13 3h5.5A2.5 2.5 0 0 1 21 5.5v12a2.5 2.5 0 0 1-2.5 2.5H13V3zm-8 2a.5.5 0 0 0-.5.5v12c0 .8.7 1.5 1.5 1.5H9V5H5zm10 0v14h3c.8 0 1.5-.7 1.5-1.5v-12A.5.5 0 0 0 18 5h-3z"/></svg>
          </button>

          <input id="library-search-input" class="search-input" type="search" placeholder="Search inside library..." autocomplete="off" />

          <button id="library-search-button" class="search-button" type="button" aria-label="Search in Library">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 0 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div id="library-results" class="results-dropdown" hidden></div>

        <div id="library-tree" class="library-scroll"></div>
      </div>
    </section>
  </div>
</main>

<div id="copy-toast" class="toast" role="status" aria-live="polite"></div>

<script src="./glossary-search.js"></script>
<script src="./app.js"></script>

</html>
