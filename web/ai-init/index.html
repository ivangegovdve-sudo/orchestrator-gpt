const cats = {};
DATA.forEach(d=>{
    if(!cats[d.category]) cats[d.category]=[];
    cats[d.category].push(d);
});

const catDiv = document.getElementById("categories");
const content = document.getElementById("content");

Object.keys(cats).forEach(cat=>{
    const link=document.createElement("div");
    link.textContent=cat+" ("+cats[cat].length+")";
    link.style.cursor="pointer";
    link.style.padding="6px";
    link.onclick=()=>document.getElementById(cat).scrollIntoView({behavior:"smooth"});
    catDiv.appendChild(link);

    const section=document.createElement("div");
    section.className="section";
    section.id=cat;

    const title=document.createElement("h2");
    title.textContent=cat;
    section.appendChild(title);

    cats[cat].forEach(item=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`<b>${item.abbr}</b> — ${item.expansion}<br>
        <small>${item.desc}</small>`;
        section.appendChild(card);
    });

    content.appendChild(section);
});
</script>
