<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI_INIT Abbreviation Library</title>
<style>
:root {
  color-scheme: dark;
  --bg: #06080f;
  --bg-soft: #0e1423;
  --panel: rgba(11, 18, 33, 0.9);
  --panel-2: rgba(13, 22, 41, 0.85);
  --border: rgba(131, 152, 196, 0.22);
  --text: #f5f7ff;
  --muted: #97a6c9;
  --accent: #4fd1c5;
  --accent-2: #7aa2ff;
  --shadow: 0 18px 42px rgba(0, 0, 0, 0.38);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 8% 12%, rgba(79, 209, 197, 0.12), transparent 36%),
    radial-gradient(circle at 92% 0%, rgba(122, 162, 255, 0.1), transparent 38%),
    var(--bg);
  color: var(--text);
  font-family: "Space Grotesk", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 18px 48px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

header {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

h1 {
  margin: 0;
  font-size: clamp(1.5rem, 2.4vw, 2.2rem);
  letter-spacing: 0.01em;
}

.subtitle {
  margin: 0;
  color: var(--muted);
  max-width: 820px;
  font-size: 0.97rem;
}

.search-shell {
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(138deg, rgba(16, 26, 48, 0.95), rgba(8, 12, 24, 0.97));
  box-shadow: var(--shadow);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.search-label {
  font-size: 0.78rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.09em;
}

.search-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
}

#search-input {
  width: 100%;
  border: 1px solid rgba(131, 152, 196, 0.3);
  border-radius: 14px;
  background: rgba(5, 10, 22, 0.85);
  color: var(--text);
  padding: 16px 18px;
  font-size: clamp(1.02rem, 2.1vw, 1.28rem);
  font-weight: 500;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}

#search-input:focus {
  border-color: rgba(79, 209, 197, 0.75);
  box-shadow: 0 0 0 4px rgba(79, 209, 197, 0.15);
  transform: translateY(-1px);
}

button {
  border: 1px solid rgba(131, 152, 196, 0.34);
  border-radius: 12px;
  background: rgba(11, 18, 33, 0.96);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}

#clear-search {
  padding: 0 16px;
  font-size: 0.93rem;
}

#clear-search:hover {
  border-color: rgba(79, 209, 197, 0.58);
}

.search-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 0.84rem;
}

.content-grid {
  display: grid;
  gap: 14px;
}

@media (min-width: 1040px) {
  .content-grid {
    grid-template-columns: minmax(300px, 0.9fr) minmax(420px, 1.1fr);
    align-items: start;
  }
}

.panel {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: var(--shadow);
  padding: 12px;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.panel h2 {
  margin: 0;
  font-size: 1rem;
}

.panel-tag {
  color: var(--muted);
  font-size: 0.8rem;
}

.results-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-card,
.entry-card {
  width: 100%;
  text-align: left;
  border-radius: 12px;
  border: 1px solid rgba(131, 152, 196, 0.24);
  background: rgba(8, 13, 24, 0.9);
  color: inherit;
  padding: 11px;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.result-card:hover,
.entry-card:hover {
  transform: translateY(-1px);
  border-color: rgba(79, 209, 197, 0.65);
  background: rgba(11, 18, 34, 0.97);
}

.entry-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.entry-abbr {
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
}

.entry-expansion {
  color: #d7dff3;
  font-weight: 500;
}

.entry-desc {
  margin: 0;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.35;
}

.entry-meta {
  margin-top: 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.badge {
  border-radius: 999px;
  border: 1px solid rgba(131, 152, 196, 0.28);
  padding: 2px 8px;
  font-size: 0.72rem;
  color: #c5d0ee;
}

.empty-state {
  border: 1px dashed rgba(131, 152, 196, 0.35);
  border-radius: 12px;
  padding: 12px;
  color: var(--muted);
  font-size: 0.9rem;
}

.accordion {
  border: 1px solid rgba(131, 152, 196, 0.24);
  border-radius: 12px;
  overflow: hidden;
  background: var(--panel-2);
}

.accordion + .accordion {
  margin-top: 8px;
}

.accordion-trigger {
  width: 100%;
  border: 0;
  border-radius: 0;
  padding: 10px 12px;
  background: transparent;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.accordion-trigger:hover {
  background: rgba(122, 162, 255, 0.08);
}

.accordion-title {
  font-weight: 600;
  font-size: 0.94rem;
}

.accordion-count {
  color: var(--muted);
  font-size: 0.78rem;
}

.accordion-chevron {
  color: var(--muted);
  transform: rotate(0deg);
  transition: transform 0.22s ease;
}

.accordion.open > .accordion-trigger .accordion-chevron {
  transform: rotate(90deg);
}

.accordion-panel {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transition: grid-template-rows 0.28s ease, opacity 0.28s ease;
}

.accordion.open > .accordion-panel {
  grid-template-rows: 1fr;
  opacity: 1;
}

.accordion-inner {
  overflow: hidden;
  padding: 0 8px 8px;
}

.subcategory .accordion-trigger {
  padding: 8px 10px;
}

.subcategory .accordion-title {
  font-size: 0.86rem;
  color: #dce5fb;
}

.subcategory .accordion-count {
  font-size: 0.74rem;
}

.entry-grid {
  display: grid;
  gap: 6px;
  margin-top: 6px;
}

.toast {
  position: fixed;
  right: 16px;
  bottom: 16px;
  border-radius: 12px;
  border: 1px solid rgba(79, 209, 197, 0.4);
  background: rgba(5, 11, 21, 0.96);
  padding: 10px 12px;
  color: #e7fbf9;
  font-size: 0.84rem;
  transform: translateY(14px);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.toast.visible {
  transform: translateY(0);
  opacity: 1;
}

@media (max-width: 720px) {
  .search-row {
    grid-template-columns: 1fr;
  }

  #clear-search {
    min-height: 42px;
  }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>AI_INIT Abbreviation Library</h1>
    <p class="subtitle">Search instantly, browse by category/subcategory, and click any entry card to copy a clean formatted definition to your clipboard.</p>
  </header>

  <section class="search-shell" aria-label="Glossary Search">
    <label class="search-label" for="search-input">Search Glossary</label>
    <div class="search-row">
      <input id="search-input" type="search" placeholder="Try: RAG, TPM, vector database, prompting..." autocomplete="off" />
      <button id="clear-search" type="button">Clear</button>
    </div>
    <div class="search-meta">
      <span><strong id="entry-count">0</strong> entries indexed</span>
      <span>Click a match to copy</span>
    </div>
  </section>

  <div class="content-grid">
    <section class="panel" aria-label="Search Results">
      <div class="panel-head">
        <h2>Search Results</h2>
        <span class="panel-tag" id="results-status">Type in the search bar to start</span>
      </div>
      <div id="results-list" class="results-list"></div>
    </section>

    <section class="panel" aria-label="Category Library">
      <div class="panel-head">
        <h2>Library</h2>
        <span class="panel-tag">Collapsed by default</span>
      </div>
      <div id="library"></div>
    </section>
  </div>
</main>

<div class="toast" id="copy-toast" role="status" aria-live="polite"></div>

<script src="./glossary-data.js"></script>
<script src="./glossary-search.js"></script>
<script src="./app.js"></script>
</body>
</html>
