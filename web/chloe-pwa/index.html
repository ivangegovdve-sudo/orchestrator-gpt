<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chloé">
<title>Chloé</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root {
  --bg: #09090b;
  --purple: #8b5cf6;
  --cyan: #0ea5e9;
  --text: #f8fafc;
  --muted: #a1a1aa;
  --card: rgba(24,24,27,.7);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: pan-y; /* allow transcript scroll */
  user-select: none; -webkit-user-select: none;
}

/* ── Layout ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh; /* dynamic viewport height on mobile Chrome */
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bot);
  position: relative;
}

/* ── Topbar ── */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px 0;
  flex-shrink: 0;
}
.wordmark {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(139,92,246,.55);
}
#btn-config {
  background: none;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 8px;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  padding: 5px 8px;
  opacity: 0.6;
  transition: opacity .2s, border-color .2s;
}
#btn-config:hover, #btn-config:active { opacity: 1; border-color: rgba(139,92,246,.4); }

/* ── Orb section ── */
#orb-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
#orb-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
#chloe-orb {
  display: block;
  cursor: pointer;
  border-radius: 50%;
  background: transparent;
  /* CSS size set by JS to match viewport */
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
@media(prefers-reduced-motion:reduce){ #chloe-orb { display: none; } }

/* Tap ripple overlay */
#tap-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(139,92,246,0);
  pointer-events: none;
  transition: border-color .15s;
}
#tap-ring.active { border-color: rgba(139,92,246,.45); animation: ring-pulse 1.4s ease-in-out infinite; }
@keyframes ring-pulse {
  0%,100% { transform: scale(1); opacity: 0.6; }
  50%      { transform: scale(1.06); opacity: 1; }
}

/* ── Status ── */
#status {
  margin-top: 14px;
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(139,92,246,.55);
  text-align: center;
  transition: color .25s;
  min-height: 1.1em;
  padding: 0 20px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
#status.listening { color: rgba(14,165,233,.9); }
#status.thinking  { color: rgba(139,92,246,.9); }
#status.speaking  { color: rgba(167,139,250,.9); }
#status.error     { color: rgba(248,113,113,.85); letter-spacing: .04em; text-transform: none; font-size: .72rem; }

/* Tap hint */
#tap-hint {
  margin-top: 6px;
  font-size: 0.7rem;
  color: rgba(255,255,255,.18);
  text-align: center;
  transition: opacity .4s;
  letter-spacing: .06em;
}

/* ── Transcript ── */
#transcript-wrap {
  flex-shrink: 0;
  width: 100%;
  max-height: 42vh;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 4px 0 8px;
  background: linear-gradient(to bottom, transparent 0%, rgba(9,9,11,.98) 18%);
}
#transcript-wrap:empty { display: none; }
#transcript {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 14px 6px;
}
.msg {
  font-size: 0.84rem;
  line-height: 1.52;
  max-width: 86%;
  border-radius: 16px;
  padding: 8px 14px;
  animation: msg-in .2s ease-out;
}
@keyframes msg-in { from { opacity:0; transform: translateY(6px); } }
.msg.user {
  background: rgba(139,92,246,.12);
  color: #d4bbff;
  border: 1px solid rgba(139,92,246,.18);
  align-self: flex-end;
  border-bottom-right-radius: 5px;
}
.msg.assistant {
  background: rgba(14,165,233,.08);
  color: #bae6fd;
  border: 1px solid rgba(14,165,233,.13);
  align-self: flex-start;
  border-bottom-left-radius: 5px;
}
.msg.interim {
  background: transparent;
  color: rgba(255,255,255,.3);
  border: 1px dashed rgba(255,255,255,.1);
  align-self: flex-end;
  font-style: italic;
  font-size: 0.78rem;
}

/* ── Config modal ── */
#cfg-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.82);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  padding: 0 0 var(--safe-bot);
}
#cfg-modal.open { display: flex; }
.cfg-sheet {
  background: #111113;
  border: 1px solid rgba(139,92,246,.22);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px 28px;
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  overflow-y: auto;
  animation: sheet-up .22s ease-out;
}
@keyframes sheet-up { from { transform: translateY(40px); opacity:0; } }
.cfg-sheet h2 { font-size: 1rem; font-weight: 700; margin-bottom: 18px; color: var(--text); }
.cfg-drag { width: 36px; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; margin: 0 auto 18px; }
.cfg-field { margin-bottom: 13px; }
.cfg-field label {
  display: block; font-size: .72rem; color: var(--muted);
  margin-bottom: 5px; letter-spacing: .05em; text-transform: uppercase;
}
.cfg-field input, .cfg-field textarea {
  width: 100%;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(139,92,246,.2);
  border-radius: 10px;
  color: var(--text);
  padding: 10px 13px;
  font-size: .84rem;
  font-family: "SF Mono", "Fira Code", monospace;
  outline: none;
  transition: border-color .15s;
}
.cfg-field input:focus, .cfg-field textarea:focus { border-color: var(--purple); }
.cfg-field textarea { resize: none; height: 72px; font-family: inherit; font-size: .82rem; }
.cfg-hint { font-size: .7rem; color: rgba(255,255,255,.28); margin-top: 5px; line-height: 1.5; }
.cfg-actions { display: flex; gap: 10px; margin-top: 18px; }
.btn-primary {
  flex: 1; background: var(--purple); color: #fff; border: none;
  border-radius: 10px; padding: 12px; font-size: .9rem; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
.btn-primary:active { opacity: .8; }
.btn-cancel {
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
  color: var(--muted); border-radius: 10px; padding: 12px 18px;
  font-size: .9rem; cursor: pointer;
}
.cfg-status { margin-top: 12px; font-size: .75rem; color: rgba(139,92,246,.75); text-align: center; min-height: 1em; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="wordmark">Chloé</span>
    <button id="btn-config" title="Settings" aria-label="Settings">⚙</button>
  </div>

  <div id="orb-section">
    <div id="orb-wrap">
      <!-- canvas dimensions set by JS -->
      <canvas id="chloe-orb" aria-label="Chloé avatar — tap to speak"></canvas>
      <div id="tap-ring"></div>
    </div>
    <div id="status">idle</div>
    <div id="tap-hint">tap to speak</div>
  </div>

  <div id="transcript-wrap">
    <div id="transcript"></div>
  </div>
</div>

<!-- Config bottom sheet -->
<div id="cfg-modal" role="dialog" aria-modal="true" aria-label="Chloé settings">
  <div class="cfg-sheet">
    <div class="cfg-drag"></div>
    <h2>💜 Chloé Setup</h2>

    <div class="cfg-field">
      <label>Chat URL</label>
      <input type="url" id="cfg-chat" placeholder="http://localhost:8766/chat" inputmode="url" autocomplete="off"/>
      <div class="cfg-hint">Default: localhost bridge (on-device, most secure). Or use direct Tailscale URL if KVM2 has HTTPS cert.</div>
    </div>
    <div class="cfg-field">
      <label>TTS URL</label>
      <input type="url" id="cfg-tts" placeholder="http://localhost:8766/tts" inputmode="url" autocomplete="off"/>
    </div>
    <div class="cfg-field">
      <label>Bearer Token <span style="color:rgba(255,255,255,.3);font-size:.65rem">(leave blank if using localhost bridge — bridge injects it)</span></label>
      <input type="password" id="cfg-token" placeholder="optional — bridge handles auth" autocomplete="new-password"/>
      <div class="cfg-hint">Stored in localStorage on this device only. Never sent to sdforest.site servers.</div>
    </div>
    <div class="cfg-field">
      <label>System Prompt</label>
      <textarea id="cfg-sysprompt" placeholder="You are Chloé…"></textarea>
    </div>

    <div class="cfg-actions">
      <button class="btn-cancel" onclick="closeConfig()">Cancel</button>
      <button class="btn-primary" onclick="saveConfig()">Save</button>
    </div>
    <div class="cfg-status" id="cfg-status"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   CHLOÉ PWA  — fullscreen avatar conversation
   Arch: Web Speech API (STT) → localhost bridge or direct Tailscale
         (chat POST) → TTS WAV → AudioContext → orb reacts
   ════════════════════════════════════════════════════════════════ */

/* ── Config ─────────────────────────────────────────────────── */
const CFG_KEY = 'chloe_pwa_v1';
let cfg = {};
try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (_) {}
const DEFAULTS = {
  chatUrl:      'http://localhost:8766/chat',
  ttsUrl:       'http://localhost:8766/tts',
  token:        '',
  systemPrompt: 'You are Chloé, Ivan\'s AI companion. Be warm, direct, and concise — 2-3 sentences unless more detail is needed.',
};
function C(k) { return cfg[k] !== undefined && cfg[k] !== '' ? cfg[k] : DEFAULTS[k]; }

/* ── Orb canvas setup (responsive) ─────────────────────────── */
const canvas = document.getElementById('chloe-orb');
const orbSection = document.getElementById('orb-section');
const tapRing = document.getElementById('tap-ring');

let orbCSS = 300; // CSS px — will be set by resize
const DPR = Math.min(window.devicePixelRatio || 2, 3);

function resizeOrb() {
  const vw = window.innerWidth;
  const avail = orbSection.clientHeight - 60; /* leave room for status + hint */
  const dim = Math.min(vw * 0.82, avail * 0.82, 360);
  orbCSS = Math.max(200, Math.round(dim));
  canvas.style.width  = orbCSS + 'px';
  canvas.style.height = orbCSS + 'px';
  canvas.width  = Math.round(orbCSS * DPR);
  canvas.height = Math.round(orbCSS * DPR);
}
resizeOrb();
window.addEventListener('resize', resizeOrb);

/* ── Orb animation (Fibonacci dot-sphere, adapted from /web/library/chloe/) ── */
(function chloeOrb() {
  if (!canvas || window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const ctx = canvas.getContext('2d');

  const N = 168;
  const DOTS = Array.from({ length: N }, (_, i) => {
    const py    = 1 - (i / (N - 1)) * 2;
    const pr    = Math.sqrt(Math.max(0, 1 - py * py));
    const theta = i * Math.PI * (3 - Math.sqrt(5));
    return { py, pr, theta };
  });

  const mouse = { tx: 0, ty: 0, x: 0, y: 0 };

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.tx = ((e.clientX - r.left)  / orbCSS - 0.5) * 2;
    mouse.ty = ((e.clientY - r.top)   / orbCSS - 0.5) * 2;
  });
  canvas.addEventListener('mouseleave', () => { mouse.tx = 0; mouse.ty = 0; });
  canvas.addEventListener('touchmove', e => {
    const t = e.touches[0];
    const r = canvas.getBoundingClientRect();
    mouse.tx = ((t.clientX - r.left) / orbCSS - 0.5) * 2;
    mouse.ty = ((t.clientY - r.top)  / orbCSS - 0.5) * 2;
  }, { passive: true });
  canvas.addEventListener('touchend',   () => { mouse.tx = 0; mouse.ty = 0; });

  /* Audio level exposed externally — driven by TTS analyser or mic */
  window.orbAudio = 0;

  function pseudoAudio(t) { return 0.04 * (Math.sin(t * 1.7) * 0.5 + 0.5); }

  const LINK_THRESH = 42;
  const LINK_SQ     = LINK_THRESH * LINK_THRESH;

  function frame(now) {
    requestAnimationFrame(frame);
    /* Re-read canvas dims each frame — resize may have changed them */
    const W  = orbCSS, H = orbCSS;
    const CX = W / 2,  CY = H / 2;
    const R  = W * 0.31; /* orb radius ~31% of CSS side */

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const t = now / 1000;
    mouse.x += (mouse.tx - mouse.x) * 0.055;
    mouse.y += (mouse.ty - mouse.y) * 0.055;

    const audio  = (window.orbAudio > 0) ? window.orbAudio : pseudoAudio(t);
    const breath = 1 + 0.065 * Math.sin(t * 0.62) + audio * 0.35;
    const rot    = t * 0.20;

    const tiltX =  mouse.y * 0.28;
    const tiltY = -mouse.x * 0.28;
    const cTX = Math.cos(tiltX), sTX = Math.sin(tiltX);
    const cTY = Math.cos(tiltY), sTY = Math.sin(tiltY);

    const pts = DOTS.map(d => {
      const a = d.theta + rot;
      let x0  = d.pr * Math.cos(a);
      let y0  = d.py;
      let z0  = d.pr * Math.sin(a);
      const w = 0.015 * Math.sin(t * 1.1 + d.theta * 2.3);
      x0 += w * d.py;
      y0 += w * d.pr;
      const x1 =  x0 * cTY + z0 * sTY;
      const z1 = -x0 * sTY + z0 * cTY;
      const y2 =  y0 * cTX - z1 * sTX;
      const z2 =  y0 * sTX + z1 * cTX;
      const sc = R * breath;
      return { sx: CX + x1 * sc, sy: CY + y2 * sc, depth: (z2 + 1) / 2 };
    });
    pts.sort((a, b) => a.depth - b.depth);

    ctx.clearRect(0, 0, W, H);

    /* Proximity connection lines — drawn behind dots */
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].sx - pts[j].sx;
        const dy = pts[i].sy - pts[j].sy;
        const d2 = dx * dx + dy * dy;
        if (d2 >= LINK_SQ) continue;
        const str  = 1 - Math.sqrt(d2) / LINK_THRESH;
        const avgD = (pts[i].depth + pts[j].depth) * 0.5;
        const hue  = 260 - avgD * 72;
        const al   = str * 0.32 * avgD * (0.6 + audio * 1.8);
        ctx.beginPath();
        ctx.moveTo(pts[i].sx, pts[i].sy);
        ctx.lineTo(pts[j].sx, pts[j].sy);
        ctx.strokeStyle = `hsla(${hue},78%,68%,${al})`;
        ctx.lineWidth   = 0.55 + str * 0.45;
        ctx.stroke();
      }
    }

    /* Sharp dots — no blur */
    for (const p of pts) {
      const al   = 0.14 + p.depth * 0.72 + audio * 0.45;
      const hue  = 260 - p.depth * 72;
      const size = 1.05 + p.depth * 2.0 + audio * 2.8;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue},80%,72%,${al})`;
      ctx.fill();
    }
  }
  requestAnimationFrame(frame);
})();

/* ── UI refs ────────────────────────────────────────────────── */
const statusEl      = document.getElementById('status');
const tapHintEl     = document.getElementById('tap-hint');
const transcriptEl  = document.getElementById('transcript');
const transcriptWrap = document.getElementById('transcript-wrap');

/* ── State ──────────────────────────────────────────────────── */
let convState   = 'idle';   // idle | listening | thinking | speaking
let messages    = [];       // conversation history (user + assistant pairs)
let idleTimer   = null;
let interimEl   = null;     // live interim transcript bubble

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className   = cls || '';
}
function showHint(v) { tapHintEl.style.opacity = v ? '1' : '0'; }
function setRing(v)  { tapRing.classList[v ? 'add' : 'remove']('active'); }

/* ── Transcript ──────────────────────────────────────────────── */
function addMsg(role, text) {
  if (interimEl) { interimEl.remove(); interimEl = null; }
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  transcriptEl.appendChild(div);
  transcriptWrap.scrollTop = transcriptWrap.scrollHeight;
}
function setInterim(text) {
  if (!interimEl) {
    interimEl = document.createElement('div');
    interimEl.className = 'msg interim';
    transcriptEl.appendChild(interimEl);
  }
  interimEl.textContent = text + '…';
  transcriptWrap.scrollTop = transcriptWrap.scrollHeight;
}
function clearInterim() {
  if (interimEl) { interimEl.remove(); interimEl = null; }
}

/* ── Idle timer ──────────────────────────────────────────────── */
function armIdle(ms = 14000) {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (convState !== 'idle') return;
    messages = [];           /* clear context after idle */
    setStatus('idle', '');
    showHint(true);
  }, ms);
}
function disarmIdle() { clearTimeout(idleTimer); }

/* ── Web Speech API ──────────────────────────────────────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, recognizing = false;

if (SR) {
  recognition = new SR();
  recognition.continuous      = false;
  recognition.interimResults  = true;
  recognition.lang            = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognizing  = true;
    convState    = 'listening';
    setStatus('listening…', 'listening');
    setRing(true);
    showHint(false);
    disarmIdle();
  };

  recognition.onresult = e => {
    let finalText = '', interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText   += e.results[i][0].transcript;
      else                       interimText += e.results[i][0].transcript;
    }
    if (interimText) setInterim(interimText.slice(0, 60));
    if (finalText.trim()) handleUserTurn(finalText.trim());
  };

  recognition.onerror = e => {
    recognizing = false;
    setRing(false);
    clearInterim();
    if (e.error === 'no-speech') {
      convState = 'idle';
      setStatus('idle', '');
      showHint(true);
      armIdle();
    } else if (e.error === 'not-allowed') {
      setStatus('mic blocked — grant permission', 'error');
      convState = 'idle';
      showHint(true);
    } else {
      setStatus(e.error, 'error');
      convState = 'idle';
      showHint(true);
      armIdle();
    }
  };

  recognition.onend = () => {
    recognizing = false;
    setRing(false);
    /* If no final result caused a state change, go idle */
    if (convState === 'listening') {
      convState = 'idle';
      setStatus('idle', '');
      showHint(true);
      armIdle();
    }
  };
} else {
  setStatus('Web Speech not supported on this browser', 'error');
}

function startListening() {
  if (!recognition) return;
  if (recognizing || convState === 'thinking' || convState === 'speaking') return;
  try { recognition.start(); } catch (_) {}
}
function stopListening() {
  if (recognition && recognizing) { try { recognition.stop(); } catch (_) {} }
}

/* ── Orb tap / click ─────────────────────────────────────────── */
canvas.addEventListener('click', () => {
  if (convState === 'idle') { startListening(); return; }
  if (convState === 'speaking') { stopSpeaking(); return; }
});
canvas.addEventListener('touchstart', () => {}, { passive: true }); /* iOS audio unlock */

/* ── Conversation turn ───────────────────────────────────────── */
async function handleUserTurn(text) {
  if (!text) return;
  clearInterim();
  addMsg('user', text);
  convState = 'thinking';
  setStatus('thinking…', 'thinking');
  setRing(false);
  window.orbAudio = 0.08; /* subtle pulse while waiting */

  const sysp = C('systemPrompt');
  const payload = {
    model:      'default',
    stream:     false,
    max_tokens: 512,
    messages:   [
      ...(sysp ? [{ role: 'system', content: sysp }] : []),
      ...messages,
      { role: 'user', content: text },
    ],
  };
  messages.push({ role: 'user', content: text });

  const chatUrl = C('chatUrl');
  const token   = C('token');
  const hdrs    = { 'Content-Type': 'application/json' };
  if (token) hdrs['Authorization'] = 'Bearer ' + token;

  let reply = '';
  try {
    const r = await fetch(chatUrl, { method: 'POST', headers: hdrs, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('Chat ' + r.status);
    const data = await r.json();
    reply = (data.choices?.[0]?.message?.content || '').trim();
    if (!reply) throw new Error('empty reply');
  } catch (err) {
    window.orbAudio = 0;
    convState = 'idle';
    setStatus('chat error: ' + err.message, 'error');
    showHint(true);
    armIdle(6000);
    return;
  }

  messages.push({ role: 'assistant', content: reply });
  addMsg('assistant', reply);
  await speakReply(reply);
}

/* ── TTS + audio playback ────────────────────────────────────── */
let audioCtx = null;
let activeSrc = null;
let speaking  = false;

function stopSpeaking() {
  speaking = false;
  window.orbAudio = 0;
  if (activeSrc) { try { activeSrc.stop(); } catch (_) {} activeSrc = null; }
  convState = 'idle';
  setStatus('idle', '');
  showHint(true);
  armIdle();
}

async function speakReply(text) {
  convState = 'speaking';
  setStatus('speaking…', 'speaking');
  speaking  = true;

  const ttsUrl = C('ttsUrl');
  const token  = C('token');
  const hdrs   = { 'Content-Type': 'application/json' };
  if (token) hdrs['Authorization'] = 'Bearer ' + token;

  let wavBuf;
  try {
    const r = await fetch(ttsUrl, {
      method:  'POST',
      headers: hdrs,
      body:    JSON.stringify({ text, speed: 1.0 }),
    });
    if (!r.ok) throw new Error('TTS ' + r.status);
    wavBuf = await r.arrayBuffer();
  } catch (err) {
    window.orbAudio = 0;
    speaking  = false;
    convState = 'idle';
    setStatus('tts error: ' + err.message, 'error');
    showHint(true);
    armIdle(6000);
    /* Still listen for follow-up even if TTS fails */
    setTimeout(startListening, 1800);
    return;
  }

  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const decoded  = await audioCtx.decodeAudioData(wavBuf);
    const src      = audioCtx.createBufferSource();
    src.buffer     = decoded;
    activeSrc      = src;

    /* Analyser → orbAudio (drives orb during speech) */
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const abuf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    analyser.connect(audioCtx.destination);

    const tick = () => {
      if (!speaking) { window.orbAudio = 0; return; }
      analyser.getFloatTimeDomainData(abuf);
      let rms = 0;
      for (const s of abuf) rms += s * s;
      window.orbAudio = Math.min(1, Math.sqrt(rms / abuf.length) * 16);
      requestAnimationFrame(tick);
    };
    tick();

    src.start();
    await new Promise(res => { src.onended = res; });
  } catch (err) {
    /* AudioContext decode/play failure — skip gracefully */
  }

  window.orbAudio = 0;
  speaking        = false;
  activeSrc       = null;

  if (convState !== 'speaking') return; /* stopSpeaking() was called */
  convState = 'idle';
  setStatus('idle', '');
  showHint(true);
  armIdle();

  /* Auto-listen for follow-up */
  setTimeout(startListening, 1400);
}

/* ── Config modal ────────────────────────────────────────────── */
function openConfig() {
  document.getElementById('cfg-chat').value     = C('chatUrl');
  document.getElementById('cfg-tts').value      = C('ttsUrl');
  document.getElementById('cfg-token').value    = C('token');
  document.getElementById('cfg-sysprompt').value = C('systemPrompt');
  document.getElementById('cfg-status').textContent = '';
  document.getElementById('cfg-modal').classList.add('open');
}
function closeConfig() {
  document.getElementById('cfg-modal').classList.remove('open');
}
function saveConfig() {
  cfg.chatUrl      = document.getElementById('cfg-chat').value.trim()     || DEFAULTS.chatUrl;
  cfg.ttsUrl       = document.getElementById('cfg-tts').value.trim()      || DEFAULTS.ttsUrl;
  cfg.token        = document.getElementById('cfg-token').value.trim();
  cfg.systemPrompt = document.getElementById('cfg-sysprompt').value.trim() || DEFAULTS.systemPrompt;
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  document.getElementById('cfg-status').textContent = 'Saved.';
  setTimeout(closeConfig, 700);
}

document.getElementById('btn-config').onclick = openConfig;
/* Close on backdrop tap */
document.getElementById('cfg-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('cfg-modal')) closeConfig();
});

/* ── First-run: show config if nothing saved ──────────────────── */
if (!localStorage.getItem(CFG_KEY)) {
  /* Slight delay so the orb loads first */
  setTimeout(openConfig, 1200);
}

/* ── URL param: ?listen=1 → autostart ───────────────────────── */
if (new URLSearchParams(location.search).get('listen') === '1') {
  /* If config not set, show setup first then skip autostart */
  if (localStorage.getItem(CFG_KEY)) {
    setTimeout(startListening, 900);
  }
}

/* ── Service Worker ──────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
}
</script>
