<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chloé">
<title>Chloé</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<!--
  CHLOÉ PWA — fullscreen avatar conversation
  ────────────────────────────────────────────────────────────────────
  Audio engine:   voice2voice-buddy patterns
    • getUserMedia → AudioContext → AnalyserNode (FFT, speech-range,
      smoothingTimeConstant=0.6, 0.3/0.7 smoothing) — V2V useAudioEnergy.js
    • Single shared AudioContext: mic energy (listening) + TTS energy (speaking)
    • Status state machine: idle→listening→user_speaking→thinking→speaking
      mirrors V2V events.js (response.created=thinking, response.done=listening)
    • Barge-in: tap orb during speaking to interrupt (V2V concept)
    • WAV blob URL cleanup: URL.revokeObjectURL — V2V useVoiceSynthesis.js

  Built new (not from V2V):
    • Web Speech API STT (V2V uses WebRTC/Silero VAD)
    • REST calls to KVM2 :8700 chat + :8660 TTS (V2V uses OpenAI Realtime)
    • Dot-orb visual (V2V uses Lottie+ring)
    • PWA manifest + service worker
    • Localhost bridge design for HTTPS→Tailscale
    • localStorage config (token, URLs, system prompt)
  ────────────────────────────────────────────────────────────────────
-->
<style>
:root {
  --bg:      #09090b;
  --purple:  #8b5cf6;
  --cyan:    #0ea5e9;
  --text:    #f8fafc;
  --muted:   #a1a1aa;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
body {
  padding-top:    env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left:   env(safe-area-inset-left, 0px);
  padding-right:  env(safe-area-inset-right, 0px);
}

/* ── Layout ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  height: 100vh; /* fallback */
  position: relative;
}
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px 0;
  flex-shrink: 0;
}
.wordmark {
  font-size: .75rem; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase;
  color: rgba(139,92,246,.5);
}
#btn-cfg {
  background: none;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 8px;
  color: var(--muted);
  font-size: 1rem; line-height: 1;
  cursor: pointer; padding: 5px 8px;
  opacity: .55; transition: opacity .2s, border-color .2s;
}
#btn-cfg:hover, #btn-cfg:active { opacity: 1; border-color: rgba(139,92,246,.35); }

/* ── Orb section ── */
#orb-section {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden; min-height: 0;
}
#orb-wrap { position: relative; }
#chloe-orb {
  display: block; cursor: pointer;
  border-radius: 50%; background: transparent;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
@media(prefers-reduced-motion:reduce){ #chloe-orb { display: none; } }

/* Listening ring — animated during user_speaking */
#tap-ring {
  position: absolute; inset: -8px;
  border-radius: 50%;
  border: 1.5px solid rgba(14,165,233,0);
  pointer-events: none;
  transition: border-color .2s;
}
#tap-ring.on { border-color: rgba(14,165,233,.5); animation: ring-pulse 1.2s ease-in-out infinite; }
@keyframes ring-pulse {
  0%,100% { transform: scale(1); opacity: .65; }
  50%      { transform: scale(1.05); opacity: 1; }
}

/* ── Status text ── */
#status {
  margin-top: 14px;
  font-size: .77rem; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  color: rgba(139,92,246,.5);
  text-align: center;
  min-height: 1.1em;
  padding: 0 20px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
  transition: color .25s;
}
#status.s-listening    { color: rgba(14,165,233,.7); }
#status.s-user_speaking{ color: rgba(14,165,233,.95); }
#status.s-thinking     { color: rgba(139,92,246,.9); }
#status.s-speaking     { color: rgba(167,139,250,.9); }
#status.s-error        { color: rgba(248,113,113,.85); font-size:.7rem; letter-spacing:.03em; text-transform:none; }
#tap-hint {
  margin-top: 6px;
  font-size: .68rem; color: rgba(255,255,255,.17);
  text-align: center; letter-spacing: .05em;
  transition: opacity .35s;
}

/* ── Transcript ── */
#transcript-wrap {
  flex-shrink: 0; width: 100%;
  max-height: 40vh; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 4px 0 6px;
  background: linear-gradient(to bottom, transparent 0%, rgba(9,9,11,.97) 16%);
}
#transcript {
  display: flex; flex-direction: column;
  gap: 8px; padding: 0 14px 6px;
}
.msg {
  font-size: .83rem; line-height: 1.52;
  max-width: 86%;
  border-radius: 16px; padding: 8px 14px;
  animation: msg-in .18s ease-out;
}
@keyframes msg-in { from { opacity:0; transform:translateY(5px); } }
.msg.user {
  background: rgba(139,92,246,.11); color: #d4bbff;
  border: 1px solid rgba(139,92,246,.17);
  align-self: flex-end; border-bottom-right-radius: 5px;
}
.msg.assistant {
  background: rgba(14,165,233,.08); color: #bae6fd;
  border: 1px solid rgba(14,165,233,.12);
  align-self: flex-start; border-bottom-left-radius: 5px;
}
.msg.interim {
  background: transparent; color: rgba(255,255,255,.28);
  border: 1px dashed rgba(255,255,255,.1);
  align-self: flex-end; font-style: italic; font-size: .76rem;
}

/* ── Config sheet ── */
#cfg-modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.82);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 200; align-items: flex-end; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#cfg-modal.open { display: flex; }
.cfg-sheet {
  background: #111113;
  border: 1px solid rgba(139,92,246,.2);
  border-radius: 24px 24px 0 0;
  padding: 18px 20px 28px;
  width: 100%; max-width: 480px;
  max-height: 90vh; overflow-y: auto;
  animation: sheet-up .2s ease-out;
}
@keyframes sheet-up { from { transform: translateY(36px); opacity: 0; } }
.cfg-drag { width: 36px; height: 4px; background: rgba(255,255,255,.13); border-radius: 2px; margin: 0 auto 16px; }
.cfg-sheet h2 { font-size: .95rem; font-weight: 700; margin-bottom: 16px; }
.cfg-f { margin-bottom: 12px; }
.cfg-f label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 4px; letter-spacing: .05em; text-transform: uppercase; }
.cfg-f input, .cfg-f textarea {
  width: 100%;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(139,92,246,.18);
  border-radius: 9px; color: var(--text);
  padding: 9px 12px; font-size: .82rem;
  font-family: "SF Mono","Fira Code",monospace;
  outline: none; transition: border-color .15s;
}
.cfg-f input:focus, .cfg-f textarea:focus { border-color: var(--purple); }
.cfg-f textarea { resize: none; height: 66px; font-family: inherit; font-size: .8rem; }
.cfg-hint { font-size: .68rem; color: rgba(255,255,255,.25); margin-top: 4px; line-height: 1.5; }
.cfg-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn-save { flex:1; background: var(--purple); color:#fff; border:none; border-radius:9px; padding:11px; font-size:.88rem; font-weight:600; cursor:pointer; transition: opacity .15s; }
.btn-save:active { opacity:.8; }
.btn-cancel { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:var(--muted); border-radius:9px; padding:11px 16px; font-size:.88rem; cursor:pointer; }
.cfg-msg { margin-top:10px; font-size:.72rem; color:rgba(139,92,246,.75); text-align:center; min-height:1em; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="wordmark">Chloé</span>
    <button id="btn-cfg" title="Settings" aria-label="Settings">⚙</button>
  </div>

  <div id="orb-section">
    <div id="orb-wrap">
      <canvas id="chloe-orb" aria-label="Chloé avatar — tap to speak"></canvas>
      <div id="tap-ring"></div>
    </div>
    <div id="status">idle</div>
    <div id="tap-hint">tap to speak</div>
  </div>

  <div id="transcript-wrap">
    <div id="transcript"></div>
  </div>
</div>

<!-- Config bottom sheet -->
<div id="cfg-modal" role="dialog" aria-modal="true" aria-label="Chloé settings">
  <div class="cfg-sheet">
    <div class="cfg-drag"></div>
    <h2>💜 Chloé Setup</h2>

    <div class="cfg-f">
      <label>Chat URL</label>
      <input type="url" id="cfg-chat" placeholder="http://localhost:8766/chat" inputmode="url" autocomplete="off"/>
      <div class="cfg-hint">localhost:8766 = Termux bridge (most secure). Or direct Tailscale HTTPS URL.</div>
    </div>
    <div class="cfg-f">
      <label>TTS URL</label>
      <input type="url" id="cfg-tts" placeholder="http://localhost:8766/tts" inputmode="url" autocomplete="off"/>
    </div>
    <div class="cfg-f">
      <label>Bearer Token <span style="opacity:.45;font-size:.65rem">(leave blank if using Termux bridge — it injects auth)</span></label>
      <input type="password" id="cfg-token" placeholder="optional" autocomplete="new-password"/>
      <div class="cfg-hint">Stored in localStorage on this device only. Never sent to sdforest.site servers.</div>
    </div>
    <div class="cfg-f">
      <label>System Prompt</label>
      <textarea id="cfg-sysprompt" placeholder="You are Chloé…"></textarea>
    </div>

    <div class="cfg-actions">
      <button class="btn-cancel" onclick="closeConfig()">Cancel</button>
      <button class="btn-save" onclick="saveConfig()">Save</button>
    </div>
    <div class="cfg-msg" id="cfg-msg"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   CHLOÉ PWA — fullscreen avatar conversation
   Audio plumbing adapted from voice2voice-buddy (V2V):
     • FFT energy: getByteFrequencyData, speech-range focus, 0.3/0.7 smooth
     • Single shared AudioContext: mic analyser + TTS analyser
     • Status state machine: idle→listening→user_speaking→thinking→speaking
   Built new: Web Speech API STT, REST→KVM2, dot-orb visual, PWA shell
   ════════════════════════════════════════════════════════════════════ */

/* ── CONFIG ─────────────────────────────────────────────────────── */
const CFG_KEY = 'chloe_pwa_v1';
let cfg = {};
try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (_) {}
const DEFAULTS = {
  chatUrl:      'http://localhost:8766/chat',
  ttsUrl:       'http://localhost:8766/tts',
  token:        '',
  systemPrompt: "You are Chloé, Ivan's AI companion. Be warm, direct, and concise — 2-3 sentences unless more detail is needed.",
};
const C = k => (cfg[k] !== undefined && cfg[k] !== '') ? cfg[k] : DEFAULTS[k];

/* ── ORB CANVAS SETUP ───────────────────────────────────────────── */
const canvas  = document.getElementById('chloe-orb');
const orbSect = document.getElementById('orb-section');
const tapRing = document.getElementById('tap-ring');
const DPR     = Math.min(window.devicePixelRatio || 2, 3);
let orbCSS    = 300;

function resizeOrb() {
  const avail = orbSect.clientHeight - 60;
  orbCSS = Math.max(200, Math.min(window.innerWidth * 0.82, avail * 0.82, 360));
  orbCSS = Math.round(orbCSS);
  canvas.style.width  = orbCSS + 'px';
  canvas.style.height = orbCSS + 'px';
  canvas.width  = Math.round(orbCSS * DPR);
  canvas.height = Math.round(orbCSS * DPR);
}
resizeOrb();
window.addEventListener('resize', resizeOrb);

/* ── ORB ANIMATION ──────────────────────────────────────────────── */
/* Dot-orb: Fibonacci sphere, proximity lines, breathing, audio-reactive.
   Ported from /web/library/chloe/index.html (the polished version).
   Visual component swapped from V2V's Lottie+ring to this canvas orb. */
(function orbAnim() {
  if (!canvas || window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const ctx = canvas.getContext('2d');
  const N   = 168;
  const DOTS = Array.from({ length: N }, (_, i) => {
    const py    = 1 - (i / (N - 1)) * 2;
    const pr    = Math.sqrt(Math.max(0, 1 - py * py));
    const theta = i * Math.PI * (3 - Math.sqrt(5));
    return { py, pr, theta };
  });

  const mouse = { tx: 0, ty: 0, x: 0, y: 0 };
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.tx = ((e.clientX - r.left) / orbCSS - .5) * 2;
    mouse.ty = ((e.clientY - r.top)  / orbCSS - .5) * 2;
  });
  canvas.addEventListener('mouseleave', () => { mouse.tx = 0; mouse.ty = 0; });
  canvas.addEventListener('touchmove', e => {
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    mouse.tx = ((t.clientX - r.left) / orbCSS - .5) * 2;
    mouse.ty = ((t.clientY - r.top)  / orbCSS - .5) * 2;
  }, { passive: true });
  canvas.addEventListener('touchend', () => { mouse.tx = 0; mouse.ty = 0; });

  /* orbAudio: 0..1, driven by mic (listening) or TTS (speaking),
     falls back to pseudo-sine when idle */
  window.orbAudio = 0;
  const pseudo = t => .035 * (Math.sin(t * 1.7) * .5 + .5);

  const LINK_T  = 42, LINK_SQ = LINK_T * LINK_T;

  requestAnimationFrame(function frame(now) {
    requestAnimationFrame(frame);
    const W = orbCSS, H = orbCSS, CX = W / 2, CY = H / 2;
    const R = W * .31;
    const t = now / 1000;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    mouse.x += (mouse.tx - mouse.x) * .055;
    mouse.y += (mouse.ty - mouse.y) * .055;

    const audio  = window.orbAudio > 0 ? window.orbAudio : pseudo(t);
    const breath = 1 + .065 * Math.sin(t * .62) + audio * .35;
    const rot    = t * .20;
    const tX     =  mouse.y * .28, tY = -mouse.x * .28;
    const cX = Math.cos(tX), sX = Math.sin(tX);
    const cY = Math.cos(tY), sY = Math.sin(tY);

    const pts = DOTS.map(d => {
      const a  = d.theta + rot;
      let x0   = d.pr * Math.cos(a);
      let y0   = d.py;
      let z0   = d.pr * Math.sin(a);
      const w  = .015 * Math.sin(t * 1.1 + d.theta * 2.3);
      x0 += w * d.py; y0 += w * d.pr;
      const x1 =  x0 * cY + z0 * sY;
      const z1 = -x0 * sY + z0 * cY;
      const y2 =  y0 * cX - z1 * sX;
      const z2 =  y0 * sX + z1 * cX;
      return { sx: CX + x1 * R * breath, sy: CY + y2 * R * breath, depth: (z2 + 1) / 2 };
    });
    pts.sort((a, b) => a.depth - b.depth);
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].sx - pts[j].sx, dy = pts[i].sy - pts[j].sy;
        const d2 = dx * dx + dy * dy;
        if (d2 >= LINK_SQ) continue;
        const str = 1 - Math.sqrt(d2) / LINK_T;
        const avg = (pts[i].depth + pts[j].depth) * .5;
        ctx.beginPath();
        ctx.moveTo(pts[i].sx, pts[i].sy);
        ctx.lineTo(pts[j].sx, pts[j].sy);
        ctx.strokeStyle = `hsla(${260 - avg * 72},78%,68%,${str * .32 * avg * (.6 + audio * 1.8)})`;
        ctx.lineWidth   = .55 + str * .45;
        ctx.stroke();
      }
    }
    for (const p of pts) {
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, 1.05 + p.depth * 2.0 + audio * 2.8, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${260 - p.depth * 72},80%,72%,${.14 + p.depth * .72 + audio * .45})`;
      ctx.fill();
    }
  });
})();

/* ── AUDIO ENGINE (V2V patterns) ───────────────────────────────── */
/*
 * V2V useAudioEnergy.js pattern:
 *   fftSize=512, smoothingTimeConstant=0.6, getByteFrequencyData,
 *   focus on mid-high bins (speech range 300–4000 Hz),
 *   0.3/0.7 smoothing on the output level.
 *
 * Single shared AudioContext drives:
 *   - micAnalyser: mic stream → orbAudio during listening/user_speaking
 *   - ttsAnalyser: WAV decode → orbAudio during speaking
 */
let audioCtx     = null;
let micStream    = null;
let micAnalyser  = null, micBuf;
let micRafId     = null;
let ttsActive    = false;
let activeTtsSrc = null;
let ttsAnalyser  = null, ttsBuf;

/* Create/resume AudioContext + mic analyser on first user gesture (autoplay policy) */
async function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    return;
  }
  try {
    /* V2V getUserMedia with echoCancellation + noiseSuppression + autoGainControl */
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    /* V2V useAudioEnergy: fftSize=512, smoothingTimeConstant=0.6 */
    micAnalyser = audioCtx.createAnalyser();
    micAnalyser.fftSize = 512;
    micAnalyser.smoothingTimeConstant = 0.6;
    const micSrc = audioCtx.createMediaStreamSource(micStream);
    micSrc.connect(micAnalyser);
    micBuf = new Uint8Array(micAnalyser.frequencyBinCount);

    startMicEnergyLoop();
  } catch (err) {
    console.warn('[audio] getUserMedia failed:', err.message);
    /* Fall back: create AudioContext only (for TTS), no mic energy */
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

/* V2V useAudioEnergy loop: focus mid-high bins, 0.3/0.7 smooth — drives orb during listening */
function startMicEnergyLoop() {
  if (!micAnalyser) return;
  cancelAnimationFrame(micRafId);
  function tick() {
    micRafId = requestAnimationFrame(tick);
    if (ttsActive) return; /* TTS analyser takes over during speaking */
    if (convState !== 'listening' && convState !== 'user_speaking') {
      window.orbAudio = Math.max(0, window.orbAudio - .02);
      return;
    }
    micAnalyser.getByteFrequencyData(micBuf);
    /* V2V: focus on upper 2/3 of bins (speech/presence frequencies) */
    const mid  = Math.floor(micBuf.length / 3);
    const high = micBuf.slice(mid);
    const rms  = Math.sqrt(high.reduce((s, v) => s + v * v, 0) / high.length) / 255;
    /* V2V 0.3/0.7 smoothing */
    window.orbAudio = window.orbAudio * .3 + rms * .7;
  }
  tick();
}

/* TTS playback: decode WAV with AudioContext + AnalyserNode → orb reacts to Chloé's voice */
async function playTTS(wavBuf) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  const decoded = await audioCtx.decodeAudioData(wavBuf);
  const src     = audioCtx.createBufferSource();
  src.buffer    = decoded;
  activeTtsSrc  = src;

  /* V2V pattern: separate analyser for TTS energy — same fftSize/smoothing */
  ttsAnalyser = audioCtx.createAnalyser();
  ttsAnalyser.fftSize = 512;
  ttsAnalyser.smoothingTimeConstant = 0.6;
  ttsBuf = new Uint8Array(ttsAnalyser.frequencyBinCount);

  src.connect(ttsAnalyser);
  ttsAnalyser.connect(audioCtx.destination);
  ttsActive = true;

  function tickTts() {
    if (!ttsActive) { window.orbAudio = 0; return; }
    requestAnimationFrame(tickTts);
    ttsAnalyser.getByteFrequencyData(ttsBuf);
    const mid  = Math.floor(ttsBuf.length / 3);
    const high = ttsBuf.slice(mid);
    const rms  = Math.sqrt(high.reduce((s, v) => s + v * v, 0) / high.length) / 255;
    window.orbAudio = window.orbAudio * .3 + rms * .7;
  }
  tickTts();

  src.start();
  return new Promise(res => { src.onended = res; });
}

function stopTTS() {
  ttsActive = false;
  window.orbAudio = 0;
  if (activeTtsSrc) { try { activeTtsSrc.stop(); } catch (_) {} activeTtsSrc = null; }
}

/* ── STATE MACHINE ──────────────────────────────────────────────── */
/*
 * V2V events.js status states (adapted):
 *   idle → listening → user_speaking → thinking → speaking → listening
 *
 * idle:          no active session
 * listening:     recognition started, waiting for speech
 * user_speaking: speech detected (recognition onresult firing)
 * thinking:      sent to KVM2 chat, awaiting reply
 * speaking:      TTS playing
 */
let convState   = 'idle';
let messages    = [];
let idleTimer   = null;

const statusEl   = document.getElementById('status');
const tapHintEl  = document.getElementById('tap-hint');
const transcriptEl = document.getElementById('transcript');
const transcriptWrap = document.getElementById('transcript-wrap');

const STATUS_LABEL = {
  idle:         'idle',
  listening:    'listening…',
  user_speaking:'hearing you…',
  thinking:     'thinking…',
  speaking:     'speaking…',
};
const STATUS_CLS = {
  listening:    's-listening',
  user_speaking:'s-user_speaking',
  thinking:     's-thinking',
  speaking:     's-speaking',
};

function setState(s, label) {
  convState = s;
  statusEl.textContent = label || STATUS_LABEL[s] || s;
  statusEl.className   = STATUS_CLS[s] || '';
  tapRing.classList[s === 'user_speaking' ? 'add' : 'remove']('on');
  tapHintEl.style.opacity = (s === 'idle') ? '1' : '0';
}

function armIdle(ms = 14000) {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (convState !== 'idle') return;
    messages = [];
  }, ms);
}

/* ── TRANSCRIPT ──────────────────────────────────────────────────── */
/* V2V TranscriptView pattern: onTranscript(role, text) appends entry */
let interimEl = null;

function onTranscript(role, text) {
  if (interimEl) { interimEl.remove(); interimEl = null; }
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  transcriptEl.appendChild(d);
  transcriptWrap.scrollTop = transcriptWrap.scrollHeight;
}

function setInterim(text) {
  if (!interimEl) {
    interimEl = document.createElement('div');
    interimEl.className = 'msg interim';
    transcriptEl.appendChild(interimEl);
  }
  interimEl.textContent = text + '…';
  transcriptWrap.scrollTop = transcriptWrap.scrollHeight;
}

function clearInterim() {
  if (interimEl) { interimEl.remove(); interimEl = null; }
}

/* ── WEB SPEECH API STT ──────────────────────────────────────────── */
/*
 * V2V uses WebRTC VAD (server-side for OpenAI, Silero for local gateway).
 * We use the browser's Web Speech API instead — simpler, no WASM, works on
 * Android Chrome, and handles VAD internally.
 * Turn-taking: recognition.onend → startListening again (auto-listen loop).
 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, recognizing = false;

if (SR) {
  recognition = new SR();
  recognition.continuous      = false;
  recognition.interimResults  = true;
  recognition.lang            = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognizing = true;
    setState('listening');
    clearTimeout(idleTimer);
  };

  recognition.onresult = e => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final   += e.results[i][0].transcript;
      else                       interim += e.results[i][0].transcript;
    }
    if (interim) {
      setState('user_speaking'); /* V2V: input_audio_buffer.speech_started → user_speaking */
      setInterim(interim.slice(0, 55));
    }
    if (final.trim()) handleUserTurn(final.trim());
  };

  recognition.onerror = e => {
    recognizing = false;
    clearInterim();
    if (e.error === 'no-speech' || e.error === 'aborted') {
      setState('idle'); armIdle();
    } else if (e.error === 'not-allowed') {
      setState('idle', ''); statusEl.textContent = 'mic blocked — check permissions';
      statusEl.className = 's-error';
    } else {
      setState('idle', e.error); statusEl.className = 's-error'; armIdle(5000);
    }
  };

  recognition.onend = () => {
    recognizing = false;
    if (convState === 'listening' || convState === 'user_speaking') {
      setState('idle'); armIdle();
    }
  };
} else {
  statusEl.textContent = 'Web Speech not supported';
  statusEl.className   = 's-error';
}

function startListening() {
  if (!recognition) return;
  if (recognizing || convState === 'thinking' || convState === 'speaking') return;
  try { recognition.start(); } catch (_) {}
}

function stopListening() {
  if (recognition && recognizing) try { recognition.stop(); } catch (_) {}
}

/* ── ORB INTERACTION ─────────────────────────────────────────────── */
canvas.addEventListener('touchstart', async () => {
  /* Unlock AudioContext on first touch (autoplay policy) */
  await ensureAudio().catch(() => {});
}, { passive: true });

canvas.addEventListener('click', async () => {
  await ensureAudio().catch(() => {});
  if (convState === 'idle') { startListening(); return; }
  /* V2V barge-in: tap orb during speaking → interrupt TTS, go back to listening */
  if (convState === 'speaking') {
    stopTTS();
    setState('idle');
    setTimeout(startListening, 400);
  }
});

/* ── URL PARAM ?listen=1 → autostart ─────────────────────────────── */
/* V2V wake-word gate: external daemon fronts the PWA and signals listen start.
   We use ?listen=1 query param (set by Termux wake_word_pwa.py am start intent). */
if (new URLSearchParams(location.search).get('listen') === '1' && localStorage.getItem(CFG_KEY)) {
  setTimeout(async () => {
    await ensureAudio().catch(() => {});
    startListening();
  }, 900);
}

/* ── CONVERSATION TURN ───────────────────────────────────────────── */
/*
 * V2V events.js flow (adapted to REST):
 *   user speech → handleUserTurn()                     [user_speaking]
 *   → POST KVM2 chat                                   [thinking]  ← V2V: response.created
 *   → reply text → TTS fetch → playTTS()              [speaking]   ← V2V: response.output_item.added
 *   → TTS done → auto-startListening()                [listening]  ← V2V: response.done
 */
async function handleUserTurn(text) {
  if (!text) return;
  clearInterim();
  onTranscript('user', text);             /* V2V onTranscript('user', transcript) */
  messages.push({ role: 'user', content: text });

  setState('thinking');                   /* V2V: response.created → 'thinking' */
  window.orbAudio = .07;                  /* subtle pulse while waiting */

  const sysp = C('systemPrompt');
  const payload = {
    model:      'default',
    stream:     false,
    max_tokens: 512,
    messages: [
      ...(sysp ? [{ role: 'system', content: sysp }] : []),
      ...messages,
    ],
  };

  const hdrs = { 'Content-Type': 'application/json' };
  const tok  = C('token');
  if (tok) hdrs['Authorization'] = 'Bearer ' + tok;

  let reply = '';
  try {
    const r = await fetch(C('chatUrl'), { method: 'POST', headers: hdrs, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('chat ' + r.status);
    const d = await r.json();
    reply = (d.choices?.[0]?.message?.content || '').trim();
    if (!reply) throw new Error('empty reply');
  } catch (err) {
    window.orbAudio = 0;
    setState('idle', 'chat error: ' + err.message);
    statusEl.className = 's-error';
    armIdle(6000);
    return;
  }

  messages.push({ role: 'assistant', content: reply });
  onTranscript('assistant', reply);      /* V2V onTranscript('assistant', transcript) */

  setState('speaking');                  /* V2V: response.output_item.added (role=assistant) */
  window.orbAudio = 0;

  /* Fetch TTS → WAV → play via AudioContext (orb reacts to Chloé's voice) */
  const ttsHdrs = { 'Content-Type': 'application/json' };
  if (tok) ttsHdrs['Authorization'] = 'Bearer ' + tok;

  try {
    const r = await fetch(C('ttsUrl'), {
      method: 'POST',
      headers: ttsHdrs,
      body: JSON.stringify({ text: reply, speed: 1.0 }),
    });
    if (!r.ok) throw new Error('tts ' + r.status);
    const wavBuf = await r.arrayBuffer();
    await playTTS(wavBuf);              /* blocks until audio ends */
  } catch (err) {
    /* TTS failed — continue to re-listen anyway */
    console.warn('[tts]', err.message);
  }

  ttsActive = false;
  window.orbAudio = 0;

  if (convState !== 'speaking') return;  /* barge-in already changed state */

  setState('idle');                      /* V2V: response.done → 'listening' */
  armIdle();

  /* Auto-listen for follow-up (V2V: session stays open, model auto-listens) */
  setTimeout(startListening, 1400);
}

/* ── CONFIG MODAL ────────────────────────────────────────────────── */
function openConfig() {
  document.getElementById('cfg-chat').value     = C('chatUrl');
  document.getElementById('cfg-tts').value      = C('ttsUrl');
  document.getElementById('cfg-token').value    = C('token');
  document.getElementById('cfg-sysprompt').value = C('systemPrompt');
  document.getElementById('cfg-msg').textContent = '';
  document.getElementById('cfg-modal').classList.add('open');
}
function closeConfig() {
  document.getElementById('cfg-modal').classList.remove('open');
}
function saveConfig() {
  cfg.chatUrl      = document.getElementById('cfg-chat').value.trim()      || DEFAULTS.chatUrl;
  cfg.ttsUrl       = document.getElementById('cfg-tts').value.trim()       || DEFAULTS.ttsUrl;
  cfg.token        = document.getElementById('cfg-token').value.trim();
  cfg.systemPrompt = document.getElementById('cfg-sysprompt').value.trim() || DEFAULTS.systemPrompt;
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  document.getElementById('cfg-msg').textContent = 'Saved.';
  setTimeout(closeConfig, 600);
}

document.getElementById('btn-cfg').onclick = openConfig;
document.getElementById('cfg-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('cfg-modal')) closeConfig();
});

/* First-run: open config if nothing saved yet */
if (!localStorage.getItem(CFG_KEY)) setTimeout(openConfig, 1100);

/* ── SERVICE WORKER ──────────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
}
</script>
</body>
