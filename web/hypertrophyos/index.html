<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper Trophy OS · Forest HUB</title>
  <meta name="description" content="Training intelligence dashboard for science-backed exercise rules, calculators, and ingestion pipeline tracking." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: #07110d;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    /* ── Thin top toolbar ── */
    .toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: rgba(7, 17, 13, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(190, 242, 100, 0.18);
    }

    .toolbar-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: #a7b5a3;
      text-decoration: none;
      letter-spacing: .01em;
      transition: color .2s;
      flex-shrink: 0;
    }
    .toolbar-back:hover { color: #f7fee7; }

    .toolbar-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 600;
      color: #bef264;
      letter-spacing: .03em;
      white-space: nowrap;
      pointer-events: none;
    }

    .toolbar-open {
      margin-left: auto;
      font-size: 12px;
      color: #a7b5a3;
      text-decoration: none;
      letter-spacing: .04em;
      transition: color .2s;
      flex-shrink: 0;
    }
    .toolbar-open:hover { color: #bef264; }

    /* ── Full-viewport iframe below the toolbar ── */
    .app-frame {
      position: fixed;
      top: 44px;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100vh - 44px);
      border: 0;
      display: block;
      background: #020617;
    }
  </style>
</head>
<body>

  <!-- ── Toolbar ── -->
  <nav class="toolbar" aria-label="Site navigation">
    <a href="/" class="toolbar-back">← Forest HUB</a>
    <span class="toolbar-title">Hyper Trophy OS</span>
    <a class="toolbar-open"
       href="https://app-production-533c.up.railway.app"
       target="_blank"
       rel="noopener noreferrer">Open ↗</a>
  </nav>

  <!-- ── Full-page embed ── -->
  <iframe
    class="app-frame"
    title="Hyper Trophy OS"
    src="https://app-production-533c.up.railway.app"
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
    allow="fullscreen; clipboard-write"
  ></iframe>

</body>
</html>
