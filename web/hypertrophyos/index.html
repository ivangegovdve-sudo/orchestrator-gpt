<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper Trophy OS · Forest HUB</title>
  <meta name="description" content="Training intelligence dashboard for science-backed exercise rules, calculators, and ingestion pipeline tracking — with a research chat that synthesises the local corpus and live PubMed." />
  <style>
    :root {
      /* Forest HUB unified tokens (cyan accent is canon) */
      --bg: #07070b;
      --surface: #0f0f15;
      --border: rgba(255,255,255,0.08);
      --text-primary: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #4f46e5;
      --accent-green: #22c55e;
      --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: #07110d;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    /* ── Thin top toolbar ── */
    .toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: rgba(7, 17, 13, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(190, 242, 100, 0.18);
    }
    .toolbar-back {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; color: #a7b5a3; text-decoration: none;
      letter-spacing: .01em; transition: color .2s; flex-shrink: 0;
    }
    .toolbar-back:hover { color: #f7fee7; }
    .toolbar-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 13px; font-weight: 600; color: #bef264;
      letter-spacing: .03em; white-space: nowrap; pointer-events: none;
    }
    .toolbar-open {
      margin-left: auto; font-size: 12px; color: #a7b5a3;
      text-decoration: none; letter-spacing: .04em; transition: color .2s; flex-shrink: 0;
    }
    .toolbar-open:hover { color: #bef264; }

    /* ── Full-viewport iframe below the toolbar ── */
    .app-frame {
      position: fixed;
      top: 44px; left: 0; right: 0; bottom: 0;
      width: 100%; height: calc(100vh - 44px);
      border: 0; display: block; background: #020617;
    }

    /* ── Research chat widget ── */
    .chat-fab {
      position: fixed; z-index: 200;
      right: 20px; bottom: 20px;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 18px; border: 0; cursor: pointer;
      border-radius: 999px;
      background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700; letter-spacing: .01em;
      box-shadow: 0 8px 28px rgba(79,70,229,.35);
      transition: transform .18s, box-shadow .18s, opacity .18s;
    }
    .chat-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(79,70,229,.5); }
    .chat-fab svg { width: 18px; height: 18px; }

    .chat-panel {
      position: fixed; z-index: 210;
      right: 20px; bottom: 20px;
      width: min(420px, calc(100vw - 32px));
      height: min(620px, calc(100vh - 76px));
      display: none; flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 24px 70px rgba(0,0,0,.6);
      overflow: hidden;
    }
    .chat-panel.open { display: flex; }

    .chat-head {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(79,70,229,.10), transparent);
    }
    .chat-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
    .chat-head h2 { font-size: 14px; color: var(--text-primary); font-weight: 700; }
    .chat-head p { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .chat-close {
      margin-left: auto; background: none; border: 0; cursor: pointer;
      color: var(--text-muted); font-size: 20px; line-height: 1; padding: 2px 6px;
    }
    .chat-close:hover { color: var(--text-primary); }

    .chat-log {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg { font-size: 13.5px; line-height: 1.5; }
    .msg.user { align-self: flex-end; max-width: 85%;
      background: var(--accent); color: #fff; font-weight: 600;
      padding: 9px 13px; border-radius: 13px 13px 3px 13px; }
    .msg.bot { align-self: flex-start; max-width: 100%; color: var(--text-primary); }
    .msg.bot .answer {
      background: #14141c; border: 1px solid var(--border);
      padding: 11px 13px; border-radius: 3px 13px 13px 13px; white-space: pre-wrap;
    }
    .sources { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 0 2px; }
    .src-badge {
      font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
      padding: 3px 9px; border-radius: 999px; border: 1px solid;
    }
    .src-badge.oracle { color: var(--accent); border-color: rgba(79,70,229,.4); background: rgba(79,70,229,.08); }
    .src-badge.pubmed { color: #fca5f1; border-color: rgba(252,165,241,.4); background: rgba(252,165,241,.08); }
    .src-badge.none   { color: var(--text-muted); border-color: var(--border); }

    .refs { margin-top: 9px; }
    .refs h4 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
      color: var(--text-muted); margin-bottom: 6px; }
    .ref {
      display: block; font-size: 12px; color: var(--text-muted);
      padding: 6px 9px; margin-bottom: 5px;
      background: #101017; border: 1px solid var(--border);
      border-radius: 7px; text-decoration: none;
    }
    a.ref:hover { color: var(--text-primary); border-color: rgba(79,70,229,.35); }
    .ref .pmid { color: #fca5f1; font-weight: 700; }
    .ref .meta { color: #6b7280; }

    .chat-empty { color: var(--text-muted); font-size: 13px; line-height: 1.6; text-align: center; margin: auto 8px; }
    .chat-empty strong { color: var(--text-primary); }
    .suggest { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
    .suggest button {
      font-size: 11.5px; color: var(--accent); cursor: pointer;
      background: rgba(79,70,229,.07); border: 1px solid rgba(79,70,229,.25);
      padding: 6px 10px; border-radius: 999px;
    }
    .suggest button:hover { background: rgba(79,70,229,.15); }

    .chat-form {
      display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border);
    }
    .chat-form input {
      flex: 1; background: #101017; border: 1px solid var(--border);
      border-radius: 9px; color: var(--text-primary); padding: 10px 12px; font-size: 13.5px;
    }
    .chat-form input:focus { outline: none; border-color: rgba(79,70,229,.5); }
    .chat-form button {
      background: var(--accent); border: 0; border-radius: 9px; cursor: pointer;
      color: #fff; font-weight: 700; padding: 0 15px; font-size: 13.5px;
    }
    .chat-form button:disabled { opacity: .5; cursor: default; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: blink 1.2s infinite both; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  </style>
  <link rel="stylesheet" href="/web/assets/forest-motion.css?v=1" />
</head>
<body>

  <!-- ── Toolbar ── -->
  <nav class="toolbar" aria-label="Site navigation" data-fm-reveal="fade">
    <a href="/" class="toolbar-back">← Forest HUB</a>
    <span class="toolbar-title">Hyper Trophy OS</span>
    <a class="toolbar-open"
       href="https://chloe.blumenkraft.cloud/hypertrophy/"
       target="_blank" rel="noopener noreferrer">Open ↗</a>
  </nav>

  <!-- ── Full-page embed (live Oracle API) ── -->
  <iframe
    class="app-frame"
    title="Hyper Trophy OS"
    src="https://chloe.blumenkraft.cloud/hypertrophy/"
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
    allow="fullscreen; clipboard-write"
  ></iframe>

  <!-- ── Research chat launcher ── -->
  <button class="chat-fab" id="chatFab" aria-label="Open research chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Ask research
  </button>

  <!-- ── Research chat panel ── -->
  <section class="chat-panel" id="chatPanel" aria-label="Research chat">
    <header class="chat-head">
      <span class="dot"></span>
      <div>
        <h2>Research Chat</h2>
        <p>Local corpus + live PubMed</p>
      </div>
      <button class="chat-close" id="chatClose" aria-label="Close">×</button>
    </header>
    <div class="chat-log" id="chatLog">
      <div class="chat-empty" id="chatEmpty">
        Ask a training-science question. Answers synthesise the ingested
        <strong>Oracle facts &amp; rules</strong> and live <strong>PubMed</strong>
        papers, with source attribution.
        <div class="suggest">
          <button data-q="How much protein per day for hypertrophy?">Protein for hypertrophy</button>
          <button data-q="Optimal training volume per muscle per week?">Weekly volume</button>
          <button data-q="Does training to failure build more muscle?">Training to failure</button>
        </div>
      </div>
    </div>
    <form class="chat-form" id="chatForm">
      <input id="chatInput" type="text" autocomplete="off"
             placeholder="Ask about hypertrophy science…" />
      <button type="submit" id="chatSend">Ask</button>
    </form>
  </section>

  <script>
    const API = "https://chloe.blumenkraft.cloud/hypertrophy";
    const fab = document.getElementById("chatFab");
    const panel = document.getElementById("chatPanel");
    const log = document.getElementById("chatLog");
    const empty = document.getElementById("chatEmpty");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("chatInput");
    const sendBtn = document.getElementById("chatSend");

    function openPanel() { panel.classList.add("open"); fab.style.display = "none"; input.focus(); }
    function closePanel() { panel.classList.remove("open"); fab.style.display = ""; }
    fab.addEventListener("click", openPanel);
    document.getElementById("chatClose").addEventListener("click", closePanel);

    document.querySelectorAll(".suggest button").forEach(b =>
      b.addEventListener("click", () => { input.value = b.dataset.q; form.requestSubmit(); }));

    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html != null) e.innerHTML = html;
      return e;
    }
    function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

    function srcBadges(sources) {
      const wrap = el("div", "sources");
      if (!sources || !sources.length) {
        wrap.appendChild(el("span", "src-badge none", "No source"));
        return wrap;
      }
      sources.forEach(s => {
        const cls = s === "PubMed" ? "pubmed" : "oracle";
        wrap.appendChild(el("span", "src-badge " + cls, esc(s)));
      });
      return wrap;
    }

    function renderBot(data) {
      const bot = el("div", "msg bot");
      bot.appendChild(srcBadges(data.sources));
      bot.appendChild(el("div", "answer", esc(data.answer || data.note || "No answer available.")));

      const nFacts = (data.facts || []).length;
      const pubmed = data.pubmed || [];
      if (nFacts || pubmed.length) {
        const refs = el("div", "refs");
        if (nFacts) {
          refs.appendChild(el("h4", null, `Oracle DB · ${nFacts} supporting fact${nFacts>1?"s":""}`));
          (data.facts || []).slice(0, 3).forEach(f => {
            const src = esc((f.paper_title || "").slice(0, 70));
            refs.appendChild(el("div", "ref",
              `${esc((f.claim||"").slice(0,140))}${src ? ` <span class="meta">— ${src}</span>` : ""}`));
          });
        }
        if (pubmed.length) {
          refs.appendChild(el("h4", null, `PubMed · ${pubmed.length} paper${pubmed.length>1?"s":""}`));
          pubmed.forEach(p => {
            const meta = [p.journal, p.year].filter(Boolean).map(esc).join(" · ");
            const a = el("a", "ref",
              `<span class="pmid">PMID:${esc(p.pmid)}</span> ${esc(p.title)}${meta ? ` <span class="meta">(${meta})</span>` : ""}`);
            a.href = p.url; a.target = "_blank"; a.rel = "noopener noreferrer";
            refs.appendChild(a);
          });
        }
        bot.appendChild(refs);
      }
      return bot;
    }

    async function ask(question) {
      if (empty) empty.style.display = "none";
      log.appendChild(el("div", "msg user", esc(question)));
      const typing = el("div", "msg bot");
      typing.innerHTML = '<div class="answer"><span class="typing"><span></span><span></span><span></span></span></div>';
      log.appendChild(typing);
      log.scrollTop = log.scrollHeight;
      sendBtn.disabled = true;

      try {
        const r = await fetch(API + "/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await r.json();
        typing.replaceWith(renderBot(data));
      } catch (err) {
        typing.replaceWith(renderBot({ answer: "Couldn't reach the research API. Please try again.", sources: [] }));
      } finally {
        sendBtn.disabled = false;
        log.scrollTop = log.scrollHeight;
        input.focus();
      }
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      ask(q);
    });
  </script>

  <script src="/web/assets/forest-motion.js?v=1" data-theme="hypertrophy" data-preset="fibers" data-portal-open data-cursor data-iris></script>

</body>
</html>
