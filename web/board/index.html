<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Unlisted operations view. Not linked from the homepage and not a project card. -->
<meta name="robots" content="noindex, nofollow">
<title>Fleet Board — SDForest</title>
<style>
  /* Deliberately close to the board's own palette rather than the site tokens: this page is
     a frame around someone else's document, and two competing designs meeting at an iframe
     boundary looks like a bug. */
  :root{--bg:#fbfbfa;--fg:#1c1c1a;--muted:#6b6b66;--line:#e2e2dd;--card:#fff;
        --accent:#2f5fd0;--warn:#b45309;--bad:#b42318;--ok:#15803d;--chip:#f1f1ee;}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#e8e8e4;--muted:#9a9a93;
        --line:#2c2c29;--card:#1b1b1a;--accent:#7ea6ff;--warn:#f59e0b;--bad:#f87171;
        --ok:#4ade80;--chip:#232322;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
  h1{font-size:1.15rem;margin:1.25rem 0 .15rem;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 .9rem}
  .sub a{color:var(--accent)}

  /* The freshness strip is the point of this page, so it is the loudest thing on it. */
  .status{border:1px solid var(--line);border-left-width:4px;border-radius:8px;
          background:var(--card);padding:.75rem .9rem;margin:0 0 1rem}
  .status .head{font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .status .detail{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
                  color:var(--muted);margin-top:.3rem;word-break:break-word}
  .status.live{border-left-color:var(--ok)}
  .status.live .head{color:var(--ok)}
  .status.aging{border-left-color:var(--warn)}
  .status.aging .head{color:var(--warn)}
  .status.stale{border-left-color:var(--bad)}
  .status.stale .head{color:var(--bad)}
  .status.loading{border-left-color:var(--line)}

  button{font:inherit;background:var(--chip);color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:.4rem .8rem;cursor:pointer;margin-top:.6rem}
  button:hover{border-color:var(--accent)}
  iframe{width:100%;height:calc(100vh - 190px);min-height:420px;border:1px solid var(--line);
         border-radius:8px;background:var(--card)}
  .hidden{display:none}
</style>

<div class="wrap">
  <h1>Fleet Board</h1>
  <p class="sub">Coordination board, generated on Ivan's machine every ~15&nbsp;min and published from there.
    Read-only mirror &mdash; <a href="/">Forest HUB</a></p>

  <div class="status loading" id="status" role="status" aria-live="polite">
    <div class="head" id="status-head">Checking how old this board is&hellip;</div>
    <div class="detail" id="status-detail">Fetching the published snapshot.</div>
    <button type="button" id="reveal" class="hidden">Show the expired board anyway</button>
  </div>

  <iframe id="board" title="Fleet coordination board" class="hidden" sandbox="allow-same-origin"></iframe>
</div>

<script>
(() => {
  'use strict';

  // The board declares its own expiry and instructs readers to reject it past that point:
  //   "VALID UNTIL <iso>  (2 x 15 m interval). A reader MUST reject this board past that
  //    time."
  // This page honours that literally. Past the deadline it does NOT render the board as
  // though it were current; it says so and puts the content behind a deliberate click.
  // Showing a stale board silently is the single failure this deployment must not have,
  // because a board that is wrong but looks live is worse than no board at all.
  const VALID_UNTIL = /VALID UNTIL\s+(\S+)/;
  // Fallback only. The board's own declared window is two generation intervals; this is
  // used when the HTML could not be read but state.json could.
  const FALLBACK_WINDOW_MS = 30 * 60 * 1000;
  const AGING_FRACTION = 0.6;   // amber once most of the validity window is spent
  const POLL_MS = 60_000;

  const el = (id) => document.getElementById(id);
  const statusBox = el('status');
  const head = el('status-head');
  const detail = el('status-detail');
  const reveal = el('reveal');
  const frame = el('board');

  let revealed = false;

  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const describeAge = (ms) => {
    const mins = Math.floor(ms / 60000);
    if (mins < 1) return 'less than a minute ago';
    if (mins < 60) return `${plural(mins, 'minute')} ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${plural(hours, 'hour')} ${plural(mins % 60, 'minute')} ago`;
    return `${plural(Math.floor(hours / 24), 'day')} ${plural(hours % 24, 'hour')} ago`;
  };

  const setStatus = (kind, title, note) => {
    statusBox.className = `status ${kind}`;
    head.textContent = title;
    detail.textContent = note;
  };

  async function load() {
    let state = null;
    let html = null;
    try {
      // state.json first and separately: the generator writes it last on purpose, so it is
      // the authoritative timestamp even when a cached copy of the page body is older.
      const [stateRes, htmlRes] = await Promise.all([
        fetch('/api/board?file=state', { cache: 'no-store' }),
        fetch('/api/board?file=html', { cache: 'no-store' }),
      ]);
      if (!stateRes.ok) {
        const body = await stateRes.json().catch(() => ({}));
        setStatus('stale', 'No board is published.',
          body.error ? `${body.error} ${body.detail || ''}`.trim() : `The snapshot endpoint returned HTTP ${stateRes.status}.`);
        frame.classList.add('hidden');
        return;
      }
      state = await stateRes.json();
      html = htmlRes.ok ? await htmlRes.text() : null;
    } catch (error) {
      // A failed refresh must never leave a previously-good board looking current.
      setStatus('stale', 'Could not reach the published board.',
        `${error.message}. Anything shown below is from an earlier fetch and may be out of date.`);
      return;
    }

    const generatedAt = Date.parse(state?.generatedAt ?? '');
    if (!Number.isFinite(generatedAt)) {
      setStatus('stale', 'The published board has no usable timestamp.',
        'state.json carried no parseable generatedAt, so its age cannot be established. Treating it as unusable.');
      frame.classList.add('hidden');
      return;
    }

    // Prefer the deadline the board declares over one derived here, so the page honours the
    // generator's own rule rather than a second opinion about it.
    const declared = html && VALID_UNTIL.exec(html);
    const declaredMs = declared ? Date.parse(declared[1]) : NaN;
    const validUntil = Number.isFinite(declaredMs) ? declaredMs : generatedAt + FALLBACK_WINDOW_MS;

    const now = Date.now();
    const age = now - generatedAt;
    const window = Math.max(1, validUntil - generatedAt);
    const expired = now > validUntil;
    const stamp = `generated ${new Date(generatedAt).toISOString()} · valid until ${new Date(validUntil).toISOString()}`
      + (declared ? '' : ' (derived — the board did not declare one)');

    if (expired) {
      const overdue = describeAge(now - validUntil).replace(' ago', '');
      setStatus('stale', `STALE — this board expired ${overdue} ago. Do not act on it.`,
        `Generated ${describeAge(age)}. The board instructs readers to reject it past its validity window, `
        + `so it is not shown. This normally means the generator on Ivan's machine stopped running or stopped publishing. ${stamp}`);
      reveal.classList.remove('hidden');
      if (!revealed) frame.classList.add('hidden');
      return;
    }

    reveal.classList.add('hidden');
    const kind = age > window * AGING_FRACTION ? 'aging' : 'live';
    const lead = kind === 'aging'
      ? `Current, but due to refresh — generated ${describeAge(age)}.`
      : `Live — generated ${describeAge(age)}.`;
    setStatus(kind, lead, stamp);

    if (html) {
      // srcdoc rather than pointing the frame at the proxy URL: the board is a standalone
      // document with its own stylesheet, and an iframe keeps it from fighting this page's.
      // Kept sandboxed with no allow-scripts — the board is static markup and has no reason
      // to execute anything.
      frame.srcdoc = html;
      frame.classList.remove('hidden');
    }
  }

  reveal.addEventListener('click', () => {
    revealed = true;
    frame.classList.remove('hidden');
    reveal.classList.add('hidden');
  });

  load();
  // Re-checked on a timer so a tab left open all day ages visibly instead of freezing at
  // whatever it said when it was opened.
  setInterval(load, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
