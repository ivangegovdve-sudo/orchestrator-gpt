<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Unlisted operations view. Not linked from the homepage and not a project card. -->
<meta name="robots" content="noindex, nofollow">
<title>Fleet Board — SDForest</title>
<style>
  /* Deliberately close to the board's own palette rather than the site tokens: this page is
     a frame around someone else's document, and two competing designs meeting at an iframe
     boundary looks like a bug. */
  :root{--bg:#fbfbfa;--fg:#1c1c1a;--muted:#6b6b66;--line:#e2e2dd;--card:#fff;
        --accent:#2f5fd0;--warn:#b45309;--bad:#b42318;--ok:#15803d;--chip:#f1f1ee;}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#e8e8e4;--muted:#9a9a93;
        --line:#2c2c29;--card:#1b1b1a;--accent:#7ea6ff;--warn:#f59e0b;--bad:#f87171;
        --ok:#4ade80;--chip:#232322;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
  h1{font-size:1.15rem;margin:1.25rem 0 .15rem;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 .9rem}
  .sub a{color:var(--accent)}

  /* The freshness strip is the point of this page, so it is the loudest thing on it. */
  .status{border:1px solid var(--line);border-left-width:4px;border-radius:8px;
          background:var(--card);padding:.75rem .9rem;margin:0 0 1rem}
  .status .head{font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .status .detail{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
                  color:var(--muted);margin-top:.3rem;word-break:break-word}
  .status.live{border-left-color:var(--ok)}
  .status.live .head{color:var(--ok)}
  .status.aging{border-left-color:var(--warn)}
  .status.aging .head{color:var(--warn)}
  .status.stale{border-left-color:var(--bad)}
  .status.stale .head{color:var(--bad)}
  .status.loading{border-left-color:var(--line)}

  button{font:inherit;background:var(--chip);color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:.4rem .8rem;cursor:pointer;margin-top:.6rem}
  button:hover{border-color:var(--accent)}
  iframe{width:100%;height:calc(100vh - 190px);min-height:420px;border:1px solid var(--line);
         border-radius:8px;background:var(--card)}
  .hidden{display:none}
</style>

<div class="wrap">
  <h1>Fleet Board</h1>
  <p class="sub">Coordination board, generated on Ivan's machine every ~15&nbsp;min and published from there.
    Read-only mirror &mdash; <a href="/">Forest HUB</a></p>

  <div class="status loading" id="status" role="status" aria-live="polite">
    <div class="head" id="status-head">Checking how old this board is&hellip;</div>
    <div class="detail" id="status-detail">Fetching the published snapshot.</div>
    <button type="button" id="reveal" class="hidden">Show the expired board anyway</button>
  </div>

  <iframe id="board" title="Fleet coordination board" class="hidden" sandbox="allow-same-origin"></iframe>
</div>

<script>
(() => {
  'use strict';

  // The board declares its own expiry and instructs readers to reject it past that point:
  //   "VALID UNTIL <iso>  (2 x 15 m interval). A reader MUST reject this board past that
  //    time."
  // This page honours that literally. Past the deadline it does NOT render the board as
  // though it were current; it says so and puts the content behind a deliberate click.
  // Showing a stale board silently is the single failure this deployment must not have,
  // because a board that is wrong but looks live is worse than no board at all.
  //
  // The declaration is read from the generator's own diagnostics block, where GENERATED and
  // VALID UNTIL sit on consecutive lines:
  //
  //   GENERATED 2026-08-28T09:28:01Z - age 0m - run 4eb7 - ...
  //   VALID UNTIL 2026-08-28T09:58:01Z  (2 x 15 m interval). ...
  //
  // Both are required and both must be line-anchored. An earlier version searched the whole
  // document for the first "VALID UNTIL" anywhere, which is unsafe: the board's body is
  // assembled from task text and PR titles, so a task whose text happened to contain that
  // phrase would have supplied the deadline and could have kept an expired board looking
  // valid. Anchoring to line starts and pairing the two lines makes the body unable to
  // impersonate the header.
  const DECLARATION = /^GENERATED\s+(\S+)[^\r\n]*\r?\n^VALID UNTIL\s+(\S+)/gm;
  const AGING_FRACTION = 0.6;   // amber once most of the validity window is spent
  const POLL_MS = 60_000;

  const el = (id) => document.getElementById(id);
  const statusBox = el('status');
  const head = el('status-head');
  const detail = el('status-detail');
  const reveal = el('reveal');
  const frame = el('board');

  // Which snapshot the reader deliberately revealed, identified by its generatedAt. A bare
  // boolean was wrong twice over: it never reset, so one reveal made EVERY later expired
  // board render without a second click, and it survived failed refreshes, so the button
  // could re-show a board the page had just declared unreachable. Tying consent to a
  // specific snapshot means it expires with that snapshot, which is what "reject past its
  // validity window" has to mean if it means anything.
  let revealedFor = null;
  // The snapshot the reveal button would show, kept so the click has something to render
  // without re-fetching and without the frame holding a document it is not showing.
  let lastSnapshot = null;
  // Loads overlap: a 60s poll, a visibilitychange, and the initial call can all be in
  // flight at once, and they do not finish in the order they started. Without this an
  // older response landing after a newer refusal would overwrite the banner and the frame
  // and put a board back on screen that the page had already rejected. Each load takes a
  // ticket; only the newest is allowed to touch the DOM.
  let loadSeq = 0;

  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const describeAge = (ms) => {
    const mins = Math.floor(ms / 60000);
    if (mins < 1) return 'less than a minute ago';
    if (mins < 60) return `${plural(mins, 'minute')} ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${plural(hours, 'hour')} ${plural(mins % 60, 'minute')} ago`;
    return `${plural(Math.floor(hours / 24), 'day')} ${plural(hours % 24, 'hour')} ago`;
  };

  const setStatus = (kind, title, note) => {
    statusBox.className = `status ${kind}`;
    head.textContent = title;
    detail.textContent = note;
  };

  // Every path that refuses to show a board goes through here, so none of them can forget
  // half the job: the frame is emptied rather than merely hidden (a hidden srcdoc is still
  // one click from being shown), the reveal affordance is withdrawn, and any prior consent
  // is dropped.
  const refuse = (kind, title, note) => {
    setStatus(kind, title, note);
    frame.classList.add('hidden');
    frame.removeAttribute('srcdoc');
    reveal.classList.add('hidden');
    revealedFor = null;
  };

  async function load() {
    const seq = ++loadSeq;
    const current = () => seq === loadSeq;
    let state = null;
    let html = null;
    try {
      // state.json first and separately: the generator writes it last on purpose, so it is
      // the authoritative timestamp even when a cached copy of the page body is older.
      const [stateRes, htmlRes] = await Promise.all([
        fetch('/api/board?file=state', { cache: 'no-store' }),
        fetch('/api/board?file=html', { cache: 'no-store' }),
      ]);
      if (!stateRes.ok) {
        const body = await stateRes.json().catch(() => ({}));
        if (!current()) return;
        if (!current()) return;
      refuse('stale', 'No board is published.',
          body.error ? `${body.error} ${body.detail || ''}`.trim() : `The snapshot endpoint returned HTTP ${stateRes.status}.`);
        return;
      }
      // Both halves are required. Treating a failed HTML fetch as a successful refresh
      // would let the page report "Live" over a board it did not actually retrieve --
      // either an empty frame or, worse, the previous fetch's board under a fresh
      // timestamp.
      if (!htmlRes.ok) {
        if (!current()) return;
        if (!current()) return;
      refuse('stale', 'Could not retrieve the board itself.',
          `state.json loaded but the board returned HTTP ${htmlRes.status}. Nothing below can be trusted as current.`);
        return;
      }
      state = await stateRes.json();
      html = await htmlRes.text();
    } catch (error) {
      // A failed refresh must never leave a previously-good board on screen. Setting the
      // banner without hiding the frame was the bug: a tab open across an outage would keep
      // rendering the last board it managed to fetch, which is the reject-and-do-not-render
      // policy stated everywhere else in this file being quietly not applied.
      if (!current()) return;
      refuse('stale', 'Could not reach the published board.',
        `${error.message}. The board is not shown, because nothing here can be confirmed current.`);
      return;
    }

    const generatedAt = Date.parse(state?.generatedAt ?? '');
    if (!Number.isFinite(generatedAt)) {
      if (!current()) return;
      refuse('stale', 'The published board has no usable timestamp.',
        'state.json carried no parseable generatedAt, so its age cannot be established. Treating it as unusable.');
      return;
    }

    // The deadline is the one the board declares. There is deliberately no fallback: if the
    // declaration cannot be read, the board's expiry rule cannot be honoured, and a page
    // that invents a window would be substituting its own judgement for the instruction it
    // is supposed to be obeying. Unverifiable is treated as unusable.
    // EVERY declaration pair is collected, not just the first. Taking the first match was
    // still forgeable: the board's body is assembled from task text and PR titles, so a
    // task could carry its own GENERATED/VALID UNTIL pair, place it above the real header,
    // copy state.json's timestamp onto the GENERATED line to satisfy the cross-check below,
    // and hand the page any deadline it liked.
    //
    // So the rule is uniqueness rather than position: keep the pairs whose GENERATED
    // matches state.json, and require exactly one. Zero means the header is unreadable.
    // More than one means the document contains competing declarations and there is no
    // principled way to pick between them -- which is a reason to refuse, not to guess.
    const candidates = [...html.matchAll(DECLARATION)]
      .map((match) => ({ generated: Date.parse(match[1]), until: Date.parse(match[2]) }))
      .filter((c) => Number.isFinite(c.generated) && Number.isFinite(c.until));
    const matching = candidates.filter((c) => c.generated === generatedAt);

    if (matching.length === 0) {
      const why = candidates.length === 0
        ? 'Its GENERATED / VALID UNTIL header could not be parsed at all.'
        : `Its header declares ${new Date(candidates[0].generated).toISOString()} but state.json reports `
          + `${new Date(generatedAt).toISOString()}; they describe different runs.`;
      if (!current()) return;
      refuse('stale', 'The published board has no verifiable expiry.',
        `${why} The board requires readers to reject it past its validity window, and a window that `
        + 'cannot be established cannot be respected, so it is not shown.');
      return;
    }
    if (matching.length > 1) {
      if (!current()) return;
      refuse('stale', 'The published board declares more than one expiry.',
        `${matching.length} competing GENERATED/VALID UNTIL declarations carry this run's timestamp. `
        + 'Which one is authoritative cannot be determined, so the board is not shown.');
      return;
    }
    const validUntil = matching[0].until;

    if (!current()) return;
    lastSnapshot = { generatedAt: state.generatedAt, html };
    const now = Date.now();
    const age = now - generatedAt;
    const window = Math.max(1, validUntil - generatedAt);
    const expired = now > validUntil;
    const stamp = `generated ${new Date(generatedAt).toISOString()} · valid until ${new Date(validUntil).toISOString()} (declared by the board)`;

    if (expired) {
      const overdue = describeAge(now - validUntil).replace(' ago', '');
      if (!current()) return;
      setStatus('stale', `STALE — this board expired ${overdue} ago. Do not act on it.`,
        `Generated ${describeAge(age)}. The board instructs readers to reject it past its validity window, `
        + `so it is not shown. This normally means the generator on Ivan's machine stopped running or stopped publishing. ${stamp}`);
      // Consent applies to one snapshot. A different one needs a fresh click.
      if (revealedFor === state.generatedAt) {
        frame.srcdoc = html;
        frame.classList.remove('hidden');
        reveal.classList.add('hidden');
      } else {
        frame.classList.add('hidden');
        frame.removeAttribute('srcdoc');
        reveal.classList.remove('hidden');
        revealedFor = null;
      }
      return;
    }

    if (!current()) return;
    reveal.classList.add('hidden');
    const kind = age > window * AGING_FRACTION ? 'aging' : 'live';
    const lead = kind === 'aging'
      ? `Current, but due to refresh — generated ${describeAge(age)}.`
      : `Live — generated ${describeAge(age)}.`;
    setStatus(kind, lead, stamp);

    {
      // srcdoc rather than pointing the frame at the proxy URL: the board is a standalone
      // document with its own stylesheet, and an iframe keeps it from fighting this page's.
      // Kept sandboxed with no allow-scripts — the board is static markup and has no reason
      // to execute anything.
      frame.srcdoc = html;
      frame.classList.remove('hidden');
    }
  }

  reveal.addEventListener('click', () => {
    if (!lastSnapshot) return;
    revealedFor = lastSnapshot.generatedAt;
    frame.srcdoc = lastSnapshot.html;
    frame.classList.remove('hidden');
    reveal.classList.add('hidden');
  });

  load();
  // Re-checked on a timer so a tab left open all day ages visibly instead of freezing at
  // whatever it said when it was opened.
  setInterval(load, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
