<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивна Периодична Таблица</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#040c14;color:#a0e8ff;font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh;overflow-x:auto}
h1{text-align:center;padding:16px 10px 2px;font-size:1.7em;color:#00d4ff;text-shadow:0 0 20px #00d4ff,0 0 40px #0088aa;letter-spacing:3px}
.subtitle{text-align:center;color:#4a9ebb;margin-bottom:6px;font-size:.85em;letter-spacing:1px}

/* ── Compound bar ─────────────────────────── */
.compound-bar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:6px 20px 10px;border-bottom:1px solid rgba(0,212,255,.1)}
.compound-bar label{font-size:.68em;opacity:.5;width:100%;text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
.cbtn{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.2);color:#80d4f0;padding:4px 10px;font-size:.75em;cursor:pointer;transition:all .2s;white-space:nowrap}
.cbtn:hover{background:rgba(0,212,255,.15);border-color:#00d4ff;color:#00d4ff}
.cbtn.active{background:rgba(0,212,255,.22);border-color:#00d4ff;color:#00d4ff;box-shadow:0 0 8px rgba(0,212,255,.3)}
.cbtn.reset{border-color:rgba(255,100,100,.3);color:#ff8888}
.cbtn.reset:hover{background:rgba(255,100,100,.15);border-color:#ff8888}

/* ── Table ───────────────────────────────── */
.pt-wrap{display:flex;justify-content:center;overflow-x:auto;padding:0 10px}
.pt-grid{display:grid;grid-template-columns:repeat(18,50px);grid-template-rows:repeat(10,50px);gap:2px;padding:10px}
.el{width:50px;height:50px;border:1px solid currentColor;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:rgba(0,0,0,.4);overflow:hidden;transition:opacity .3s,filter .3s}
.el:hover{z-index:20}
.el .n{font-size:7px;opacity:.55;line-height:1;align-self:flex-start;padding:2px 0 0 3px;cursor:pointer;transition:opacity .2s,color .2s;position:relative;z-index:2}
.el .n:hover{opacity:1;color:#fff;text-decoration:underline dotted}
.el .sym-wrap{display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;cursor:pointer}
.el .s{font-size:15px;font-weight:700;line-height:1.1}
.el .bg{font-size:5.5px;opacity:.8;text-align:center;max-width:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.el::after{content:'';position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none}
.el:hover::after{opacity:.07}
.el.alkali{color:#ff6b35}.el.alkaline{color:#ffd700}.el.transition{color:#00d4ff}
.el.post{color:#7ab8f5}.el.metalloid{color:#00ff88}.el.nonmetal{color:#ff3399}
.el.halogen{color:#ff8c42}.el.noble{color:#bf7fff}.el.lanthanide{color:#a8ff72}
.el.actinide{color:#ff4d6d}.el.unknown{color:#666}
.el.spacer{border:none;background:none;cursor:default;pointer-events:none}
/* compound dimming */
.compound-on .el{opacity:.18;filter:grayscale(.8)}
.compound-on .el.lit{opacity:1;filter:none;box-shadow:0 0 12px currentColor}
.compound-on .el.spacer{opacity:0;filter:none}

/* ── Legend ─────────────────────────────── */
.legend{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:6px 20px 10px;font-size:.7em}
.leg{display:flex;align-items:center;gap:4px}
.leg-sq{width:10px;height:10px;border:2px solid currentColor}
.leg span{opacity:.75}

/* ── Modals ─────────────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(2,10,18,.88);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.overlay.on{display:flex}
.modal{background:#060e18;border:1px solid #00d4ff;box-shadow:0 0 50px rgba(0,212,255,.22);max-width:720px;width:95vw;max-height:92vh;overflow-y:auto;position:relative}
.modal::-webkit-scrollbar{width:5px}
.modal::-webkit-scrollbar-thumb{background:#00d4ff33}
.xbtn{position:absolute;top:12px;right:12px;background:none;border:1px solid #00d4ff44;color:#00d4ff;width:26px;height:26px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:3}
.xbtn:hover{background:#00d4ff;color:#000}

/* ── Element popup ──────────────────────── */
.mhead{padding:18px 40px 14px 18px;border-bottom:1px solid rgba(0,212,255,.2);display:flex;gap:14px;align-items:center;position:sticky;top:0;background:#060e18;z-index:2}
.msym{width:70px;height:70px;border:2px solid currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.msym::before{content:'';position:absolute;inset:-50%;background:conic-gradient(transparent 0deg,currentColor 1deg,transparent 3deg,transparent 180deg,currentColor 181deg,transparent 183deg);animation:spin 5s linear infinite;opacity:.12}
@keyframes spin{to{transform:rotate(360deg)}}
.msym .mn{font-size:10px;opacity:.5;cursor:pointer;border-bottom:1px dotted currentColor;transition:opacity .2s}
.msym .mn:hover{opacity:1}
.msym .ms{font-size:26px;font-weight:700;line-height:1.1}
.msym .mm{font-size:8px;opacity:.5;cursor:pointer;border-bottom:1px dotted currentColor;transition:opacity .2s}
.msym .mm:hover{opacity:1}
.minfo h2{font-size:1.5em;line-height:1.1;margin-bottom:2px}
.minfo .latin{font-size:.8em;opacity:.5;font-style:italic}
.badge{display:inline-block;padding:2px 9px;border:1px solid currentColor;border-radius:12px;font-size:.68em;margin-top:4px;opacity:.85}

/* ── Popup body two-col ─────────────────── */
.mbody{display:flex;gap:0}
.stat-panel{width:160px;flex-shrink:0;border-right:1px solid rgba(0,212,255,.12);padding:14px 12px;background:rgba(0,212,255,.02)}
.stat-item{margin-bottom:10px}
.stat-lbl{font-size:.65em;letter-spacing:1.5px;text-transform:uppercase;opacity:.45;margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:3px}
.stat-lbl:hover{opacity:.75}
.stat-lbl .hint{font-size:.9em;opacity:.5}
.stat-val{font-size:.95em;font-weight:600;color:#e0f4ff}
.content-panel{flex:1;padding:14px 18px;overflow:hidden}

.sec{margin-bottom:16px}
.stitle{font-size:.73em;letter-spacing:2px;text-transform:uppercase;opacity:.45;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.07)}
.stext{font-size:.87em;line-height:1.8;color:#b8e4f4}
.apps{display:flex;flex-wrap:wrap;gap:5px}
.atag{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.2);padding:3px 9px;font-size:.78em;color:#88ccee}
.diy-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.diy-list li{padding:8px 12px;background:rgba(0,255,136,.04);border:1px solid rgba(0,255,136,.18);border-left:3px solid #00ff88;font-size:.84em;line-height:1.6;color:#a8eece}
.diy-list li strong{color:#00ff88;display:block;margin-bottom:2px;font-size:.9em}

/* ── DYK section ────────────────────────── */
.dyk{background:rgba(160,100,255,.05);border:1px solid rgba(160,100,255,.25);padding:12px;margin-bottom:16px}
.dyk-ttl{color:#bf7fff;font-size:.72em;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.wfwrap{position:relative;margin-bottom:6px}
.wfart{width:100%;height:80px;display:block}
.wf-caption{font-size:.7em;opacity:.45;text-align:center;font-style:italic;margin-bottom:8px}
.dyk-text{font-size:.84em;line-height:1.75;color:#ccb8f8}

/* ── Links ──────────────────────────────── */
.links{border-top:1px solid rgba(0,212,255,.15);padding-top:12px;margin-top:4px}
.links a{display:inline-block;color:#00d4ff;font-size:.8em;margin:3px 8px 3px 0;text-decoration:none;border-bottom:1px dotted rgba(0,212,255,.4)}
.links a:hover{border-bottom-style:solid}

/* ── Glossary ───────────────────────────── */
.gterm{border-bottom:1px dashed rgba(255,200,100,.5);color:#ffe090;cursor:pointer;transition:background .15s}
.gterm:hover{background:rgba(255,200,100,.12);border-radius:2px}

/* ── Mini popup (atomic num / glossary) ─── */
.mini-overlay{display:none;position:fixed;inset:0;z-index:2000;align-items:center;justify-content:center}
.mini-overlay.on{display:flex}
.mini-bg{position:absolute;inset:0;background:rgba(2,10,18,.75);backdrop-filter:blur(4px)}
.mini-modal{background:#07111d;border:1px solid #ffd700;box-shadow:0 0 30px rgba(255,215,0,.2);max-width:460px;width:92vw;padding:20px;position:relative;z-index:1}
.mini-modal.blue{border-color:#00d4ff;box-shadow:0 0 30px rgba(0,212,255,.2)}
.mini-modal h3{font-size:1.1em;margin-bottom:10px}
.mini-modal p{font-size:.88em;line-height:1.8;color:#c0e8f4;margin-bottom:8px}
.mini-modal .diagram{width:100%;height:90px;margin:10px 0}
.mini-xbtn{position:absolute;top:10px;right:10px;background:none;border:1px solid #ffd70044;color:#ffd700;width:24px;height:24px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.mini-xbtn.blue{border-color:#00d4ff44;color:#00d4ff}
.mini-xbtn:hover{background:currentColor}

@media(max-width:600px){
  .mbody{flex-direction:column}
  .stat-panel{width:100%;border-right:none;border-bottom:1px solid rgba(0,212,255,.12);display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<h1>⚗ ПЕРИОДИЧНА ТАБЛИЦА ⚗</h1>
<div class="subtitle">Кликни на символа за елемент · Кликни на числото за обяснение · За деца от 8 до 10 години</div>

<!-- Compound bar -->
<div class="compound-bar">
  <label>🔬 Маркирай елементите в:</label>
  <button class="cbtn" onclick="activateCompound('water')">💧 Вода H₂O</button>
  <button class="cbtn" onclick="activateCompound('salt')">🧂 Сол NaCl</button>
  <button class="cbtn" onclick="activateCompound('co2')">🌿 Въглерод CO₂</button>
  <button class="cbtn" onclick="activateCompound('sugar')">🍬 Захар</button>
  <button class="cbtn" onclick="activateCompound('bones')">🦴 Кости</button>
  <button class="cbtn" onclick="activateCompound('steel')">🔩 Стомана</button>
  <button class="cbtn" onclick="activateCompound('diamond')">💎 Диамант</button>
  <button class="cbtn" onclick="activateCompound('seawater')">🌊 Морска вода</button>
  <button class="cbtn" onclick="activateCompound('battery')">🔋 Li батерия</button>
  <button class="cbtn" onclick="activateCompound('aspirin')">💊 Аспирин</button>
  <button class="cbtn reset" onclick="clearCompound()">✕ Изчисти</button>
</div>

<div class="legend">
  <div class="leg alkali"><div class="leg-sq"></div><span>Алкален метал</span></div>
  <div class="leg alkaline"><div class="leg-sq"></div><span>Алкалоземен</span></div>
  <div class="leg transition"><div class="leg-sq"></div><span>Преходен метал</span></div>
  <div class="leg post"><div class="leg-sq"></div><span>Постпреходен</span></div>
  <div class="leg metalloid"><div class="leg-sq"></div><span>Металоид</span></div>
  <div class="leg nonmetal"><div class="leg-sq"></div><span>Неметал</span></div>
  <div class="leg halogen"><div class="leg-sq"></div><span>Халоген</span></div>
  <div class="leg noble"><div class="leg-sq"></div><span>Благороден газ</span></div>
  <div class="leg lanthanide"><div class="leg-sq"></div><span>Лантанид</span></div>
  <div class="leg actinide"><div class="leg-sq"></div><span>Актинид</span></div>
</div>

<div class="pt-wrap"><div class="pt-grid" id="ptGrid"></div></div>

<!-- Main element overlay -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="xbtn" onclick="closeModal()">✕</button>
    <div class="mhead" id="mhead"></div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<!-- Mini popup (atomic number / mass / glossary) -->
<div class="mini-overlay" id="miniOverlay">
  <div class="mini-bg" onclick="closeMini()"></div>
  <div class="mini-modal" id="miniModal">
    <button class="mini-xbtn" id="miniXbtn" onclick="closeMini()">✕</button>
    <div id="miniContent"></div>
  </div>
</div>

<script>
// ── Compounds ─────────────────────────────────────────────────────────────
const COMPOUNDS={
  water:{name:'Вода (H₂O)',nums:[1,8],desc:'Водата е от водород и кислород. Два водородни атома + един кислороден атом.'},
  salt:{name:'Трапезна сол (NaCl)',nums:[11,17],desc:'Натриев хлорид — натрий + хлор. Тя е в морето и в солницата ти.'},
  co2:{name:'Въглероден диоксид (CO₂)',nums:[6,8],desc:'Въглерод + кислород. Ти издишваш CO₂, а растенията го поглъщат.'},
  sugar:{name:'Захар / Глюкоза (C₆H₁₂O₆)',nums:[6,1,8],desc:'Захарта е само въглерод, водород и кислород — наредени по специален начин.'},
  bones:{name:'Кости (Ca₃(PO₄)₂)',nums:[20,15,8],desc:'Костите ти са от калций, фосфор и кислород. Пийте мляко!'},
  steel:{name:'Стомана (Fe + C)',nums:[26,6],desc:'Стоманата е желязо с малко въглерод вътре. Прави го много по-твърдо.'},
  diamond:{name:'Диамант (C)',nums:[6],desc:'Диамантът е само въглерод! Но атомите са наредени в специална кубична решетка.'},
  seawater:{name:'Морска вода',nums:[1,8,11,17,12,19,20],desc:'Морската вода съдържа много елементи: вода (H,O), сол (Na,Cl), магнезий, калий, калций и още много.'},
  battery:{name:'Li-йонна батерия',nums:[3,27,8],desc:'Батерията на телефона ти използва литий, кобалт и кислород за да съхранява ток.'},
  aspirin:{name:'Аспирин (C₉H₈O₄)',nums:[6,1,8],desc:'Аспиринът е само въглерод, водород и кислород — но наредени по специален начин.'}
};
let activeCompound=null;
function activateCompound(key){
  if(activeCompound===key){clearCompound();return;}
  activeCompound=key;
  const c=COMPOUNDS[key];
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[onclick="activateCompound('${key}')"]`).classList.add('active');
  document.getElementById('ptGrid').classList.add('compound-on');
  document.querySelectorAll('.el').forEach(el=>{
    const n=parseInt(el.dataset.num);
    if(c.nums.includes(n)) el.classList.add('lit'); else el.classList.remove('lit');
  });
}
function clearCompound(){
  activeCompound=null;
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ptGrid').classList.remove('compound-on');
  document.querySelectorAll('.el').forEach(el=>el.classList.remove('lit'));
}

// ── SVG wireframe art ─────────────────────────────────────────────────────
const ART_CAPTIONS={
  atom:'Атомна структура: електрони, въртящи се около ядрото',
  molecule:'Молекулна връзка: два атома, споделящи електрони',
  crystal:'Кристална решетка: атоми наредени в правилен модел',
  flame:'Горене: атомите отделят енергия като светлина и топлина',
  diamond:'Диамантена кристална решетка: въглерод в кубична структура',
  wave:'Вълнообразно движение: как електромагнитните вълни се разпространяват',
  gear:'Метална кристална решетка: атомите образуват здрава структура',
  balloon:'Газово разширение: молекулите се движат в цялото пространство',
  star:'Ядрен синтез в звездите: откъдето идват тежките елементи',
  helix:'Двойна спирала: структура на ДНК молекулата (съдържа фосфор)',
  radiation:'Радиоактивен разпад: ядрото изпраща частици и енергия',
};
function svgAtom(c){return`<svg class="wfart" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg"><ellipse cx="160" cy="40" rx="70" ry="22" fill="none" stroke="${c}" stroke-width="1" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="0 160 40" to="360 160 40" dur="6s" repeatCount="indefinite"/></ellipse><ellipse cx="160" cy="40" rx="70" ry="22" fill="none" stroke="${c}" stroke-width="1" opacity=".6" transform="rotate(60 160 40)"><animateTransform attributeName="transform" type="rotate" from="60 160 40" to="420 160 40" dur="8s" repeatCount="indefinite"/></ellipse><ellipse cx="160" cy="40" rx="70" ry="22" fill="none" stroke="${c}" stroke-width="1" opacity=".6" transform="rotate(120 160 40)"><animateTransform attributeName="transform" type="rotate" from="120 160 40" to="480 160 40" dur="10s" repeatCount="indefinite"/></ellipse><circle cx="160" cy="40" r="7" fill="none" stroke="${c}" stroke-width="2"/><circle cx="160" cy="40" r="3" fill="${c}" opacity=".8"/><circle r="3" fill="${c}" opacity=".9"><animateMotion dur="6s" repeatCount="indefinite" path="M160,40 m-70,0 a70,22 0 1,0 140,0 a70,22 0 1,0 -140,0"/></circle></svg>`}
function svgMolecule(c){return`<svg class="wfart" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg"><line x1="120" y1="40" x2="200" y2="40" stroke="${c}" stroke-width="2" opacity=".7"/><line x1="120" y1="37" x2="200" y2="37" stroke="${c}" stroke-width="1" opacity=".3"/><circle cx="92" cy="40" r="22" fill="none" stroke="${c}" stroke-width="1.5" opacity=".7"/><circle cx="228" cy="40" r="22" fill="none" stroke="${c}" stroke-width="1.5" opacity=".7"/><circle cx="92" cy="40" r="6" fill="${c}" opacity=".6"/><circle cx="228" cy="40" r="6" fill="${c}" opacity=".6"/><circle r="3" fill="${c}" opacity=".9"><animate attributeName="cx" values="70;116;70" dur="3s" repeatCount="indefinite"/><animate attributeName="cy" values="26;40;54" dur="3s" repeatCount="indefinite"/></circle></svg>`}
function svgCrystal(c){return`<svg class="wfart" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg"><g opacity=".7" stroke="${c}" fill="none"><polygon points="160,5 235,42 160,75 85,42" stroke-width="1.5"/><polygon points="160,5 235,42 160,75 85,42" stroke-width="1" opacity=".4" transform="rotate(45 160 40)"/><line x1="160" y1="5" x2="160" y2="75" stroke-width="1" opacity=".3"/><line x1="85" y1="42" x2="235" y2="42" stroke-width="1" opacity=".3"/><circle cx="160" cy="5" r="3" fill="${c}"/><circle cx="235" cy="42" r="3" fill="${c}"/><circle cx="160" cy="75" r="3" fill="${c}"/><circle cx="85" cy="42" r="3" fill="${c}"/><circle cx="160" cy="40" r="4" fill="${c}" opacity=".8"/><animateTransform attributeName="transform" type="rotate" from="0 160 40" to="360 160 40" dur="12s" repeatCount="indefinite"/></g></svg>`}

function svgDiamond(c){return`<svg class="wfart" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg"><g stroke="${c}" fill="none" stroke-width="1.2"><polygon points="160,5 215,38 198,72 122,72 105,38" opacity=".8"/><line x1="160" y1="5" x2="160" y2="72" opacity=".25"/><line x1="105" y1="38" x2="215" y2="38" opacity=".25"/><line x1="105" y1="38" x2="198" y2="72" opacity=".2"/><line x1="215" y1="38" x2="122" y2="72" opacity=".2"/></g></svg>`}

function glossify(text){
  let t=text;
  Object.keys(GLOSSARY).forEach(k=>{
    const re=new RegExp(`(?<![а-яА-Яa-zA-Z])(${k})(?![а-яА-Яa-zA-Z])`, 'g');
    t=t.replace(re, `<span class="gterm" onclick="openGlossary('${k}')">$1</span>`);
  });
  return t;
}
function openGlossary(key){
  const g=GLOSSARY[key];
  if(!g)return;
  const mm=document.getElementById('miniModal');
  const xb=document.getElementById('miniXbtn');
  mm.className='mini-modal';
  xb.className='mini-xbtn';
  const artFn=SVGS[g.art]||svgAtom;
  document.getElementById('miniContent').innerHTML=`
    <h3 style="color:#ffe090;margin-bottom:8px">📖 ${g.t}</h3>
    ${artFn('#ffe090')}
    <div style="font-size:.68em;opacity:.4;text-align:center;font-style:italic;margin-bottom:8px">${ART_CAPTIONS[g.art]||''}</div>
    <p>${g.d}</p>`;
  document.getElementById('miniOverlay').classList.add('on');
}

function openAtomicNum(num, sym, bg, col){

  mm.className='mini-modal blue';
  document.getElementById('miniXbtn').className='mini-xbtn blue';
  document.getElementById('miniContent').innerHTML=`
    <h3 style="color:${col}">⚛ Атомен номер: ${num}</h3>
    <svg class="diagram" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
      <circle cx="200" cy="45" r="18" fill="none" stroke="${col}" stroke-width="2" opacity=".8"/>
      <text x="200" y="40" text-anchor="middle" fill="${col}" font-size="11" font-family="monospace">ядро</text>
      <text x="200" y="53" text-anchor="middle" fill="${col}" font-size="9" opacity=".7">${num} протона</text>
      ${Array.from({length:Math.min(num,8)},(_,i)=>{const a=i*(360/Math.min(num,8))*Math.PI/180,r=52;return`<circle cx="${200+r*Math.cos(a)}" cy="${45+r*Math.sin(a)}" r="4" fill="${col}" opacity=".7"/>`}).join('')}
      <ellipse cx="200" cy="45" rx="52" ry="20" fill="none" stroke="${col}" stroke-width="1" opacity=".35" stroke-dasharray="3,4"/>
      <text x="62" y="22" fill="${col}" font-size="9" opacity=".5">е⁻ електрони</text>
    </svg>
    <p><strong style="color:${col}">${bg}</strong> (${sym}) има атомен номер <strong style="color:${col}">${num}</strong>.</p>
    <p>Атомният номер = броят на <span class="gterm" onclick="openGlossary('протон')">протоните</span> в <span class="gterm" onclick="openGlossary('ядро')">ядрото</span>. Той определя кой <span class="gterm" onclick="openGlossary('елемент')">елемент</span> е атомът — ако промениш броя на протоните, получаваш съвсем различен елемент!</p>
    <p>В неутрален атом броят на <span class="gterm" onclick="openGlossary('електрон')">електроните</span> = броят на протоните = <strong style="color:${col}">${num}</strong>.</p>`;
  document.getElementById('miniOverlay').classList.add('on');
}

// ── Atomic mass popup ─────────────────────────────────────────────────────
function openAtomicMass(mass, sym, bg, col){
  document.getElementById('miniModal').className='mini-modal blue';

  document.getElementById('miniContent').innerHTML=`
    <h3 style="color:${col}">⚖ Атомна маса: ${mass} u</h3>
    <p>Атомната маса е приблизителното тегло на един <span class="gterm" onclick="openGlossary('атом')">атом</span> на ${bg}.</p>
    <p>Измерва се в атомни единици маса (u). 1u = 1.66 × 10⁻²⁷ кг — невъобразимо малко!</p>
    <p>Атомната маса е почти равна на броя на <span class="gterm" onclick="openGlossary('протон')">протоните</span> + <span class="gterm" onclick="openGlossary('неутрон')">неутроните</span> в ядрото. Електроните тежат толкова малко, че почти не се броят.</p>

  document.getElementById('miniOverlay').classList.add('on');
}

      const k=`${r}_${c}`;
      const div=document.createElement('div');
      if(r===8){div.className='el spacer';g.appendChild(div);continue;}
      if(cells[k]){
        const d=cells[k];
        div.className=`el ${d.cat}`;
        div.dataset.num=d.n;
        if(d.isRef){
          div.innerHTML=`<span style="font-size:6.5px;text-align:center;padding:2px">${d.sym}<br><span style="font-size:5px;opacity:.55">${d.bg}</span></span>`;
          div.style.cursor='default';
        } else {
          div.innerHTML=`<span class="n" title="Атомен номер ${d.n} — кликни за обяснение">${d.n}</span><div class="sym-wrap"><span class="s">${d.sym}</span><span class="bg">${d.bg}</span></div>`;
          // number click → atomic number popup
          div.querySelector('.n').addEventListener('click',e=>{
            e.stopPropagation();
            const col=CAT_COLORS[d.cat]||'#00d4ff';
            openAtomicNum(d.n,d.sym,d.bg,col);
          });
          // symbol/name click → element page
          div.querySelector('.sym-wrap').addEventListener('click',e=>{e.stopPropagation();openModal(d.n);});
        }
      } else {
        div.className='el spacer';
      }
      g.appendChild(div);
    }
  }
}
buildGrid();

// ── Open element modal ────────────────────────────────────────────────────
function openModal(num){
  const ge=GRID.find(x=>x[0]===num);
  if(!ge)return;
  const [n,sym,bg,lat,mass,cat]=ge;
  const d=Object.assign({lat,mass},ELEMENTS[n]||defaultData(n));
  const col=CAT_COLORS[cat]||'#00d4ff';
  const row=ge[6],colNum=ge[7];
  const group=colNum<=2||colNum>=13?colNum:(colNum<=12?colNum:'—');

  document.getElementById('mhead').innerHTML=`
    <div class="msym" style="color:${col};border-color:${col}">
      <span class="mn" title="Атомен номер" onclick="openAtomicNum(${n},'${sym}','${bg}','${col}')">${n}</span>
      <span class="ms">${sym}</span>
      <span class="mm" title="Атомна маса" onclick="openAtomicMass('${mass}','${sym}','${bg}','${col}')">${mass}</span>
    </div>
    <div class="minfo">
      <h2 style="color:${col}">${bg}</h2>
      <div class="latin">${lat}</div>
      <span class="badge" style="color:${col};border-color:${col}">${CAT_NAMES[cat]||cat}</span>
    </div>`;

  // Stat panel
  const statHtml=`
    <div class="stat-panel">
      <div class="stat-item">
        <div class="stat-lbl" onclick="openAtomicNum(${n},'${sym}','${bg}','${col}')" style="cursor:pointer;color:${col}">
          Атомен номер <span class="hint">↗</span>
        </div>
        <div class="stat-val" style="color:${col}">${n}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl" onclick="openAtomicMass('${mass}','${sym}','${bg}','${col}')" style="cursor:pointer;color:${col}">
          Атомна маса <span class="hint">↗</span>
        </div>
        <div class="stat-val">${mass} u</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">Период (ред)</div>
        <div class="stat-val">${PERIODS[row]||row}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">Група (колона)</div>
        <div class="stat-val">${group}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">Агрегатно</div>
        <div class="stat-val">${STATES_BG[cat]||'—'}</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">Категория</div>
        <div class="stat-val" style="font-size:.8em">${CAT_NAMES[cat]||cat}</div>
      </div>
    </div>`;

  // Content panel
  const dyk=d.dyk||{t:'Интересен елемент!',art:'atom'};
  const artFn=SVGS[dyk.art]||svgAtom;
  let content=`
    <div class="dyk">
      <div class="dyk-ttl">🔭 Знаеш ли, че...</div>
      <div class="wfwrap">${artFn(col)}</div>
      <div class="wf-caption">▲ ${ART_CAPTIONS[dyk.art]||'Схематична илюстрация'}</div>
      <div class="dyk-text">${glossify(dyk.t)}</div>
    </div>
    <div class="sec"><div class="stitle">📜 История на откритието</div><div class="stext">${glossify(d.disc)}</div></div>`;

  if(d.facts&&d.facts.length){
    content+=`<div class="sec"><div class="stitle">⚡ Факти</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">`;
    d.facts.forEach(([l,v])=>content+=`<div style="background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.1);padding:6px 9px;font-size:.82em"><div style="opacity:.5;font-size:.78em;margin-bottom:1px">${l}</div>${glossify(String(v))}</div>`);
    content+=`</div></div>`;
  }

  content+=`<div class="sec"><div class="stitle">🌍 Намира се в</div><div class="stext">${glossify(d.where)}</div></div>`;

  if(d.apps&&d.apps.length){
    content+=`<div class="sec"><div class="stitle">🏭 Приложения</div><div class="apps">`;
    d.apps.forEach(a=>content+=`<span class="atag">${a}</span>`);
    content+=`</div></div>`;
  }

  if(d.diy&&d.diy.length){
    content+=`<div class="sec"><div class="stitle">🧪 Домашни опити</div><ul class="diy-list">`;
    d.diy.forEach(x=>content+=`<li><strong>🔬 ${x.t}</strong>${glossify(x.d)}</li>`);
    content+=`</ul></div>`;
  }

  if(d.links&&d.links.length){
    content+=`<div class="links"><div class="stitle">🔗 Научи повече</div>`;
    d.links.forEach(l=>content+=`<a href="${l.u}" target="_blank" rel="noopener">↗ ${l.t}</a>`);
    content+=`</div>`;
  }

  document.getElementById('mbody').innerHTML=statHtml+`<div class="content-panel">${content}</div>`;
  document.getElementById('overlay').classList.add('on');
}

function closeModal(){document.getElementById('overlay').classList.remove('on');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMini();}});
</script>
